name: 3. 영상 만들기

# 대본 → 영상 → 유튜브 비공개 업로드.
#
# 아이폰 GitHub 앱에서 쓰는 법
#   Actions 탭 → "3. 영상 만들기" → Run workflow
#
# 끝나면 유튜브 앱에서 비공개 영상을 확인하고,
# "4. 공개하기" 버튼으로 공개 전환한다.
#
# ⚠️ 완성 영상(MP4)은 저장소에 절대 커밋하지 않는다.
#    편당 수백 MB이고, 지워도 이력에 영구히 남아 저장소가 되돌릴 수 없이 커진다.
#    실행이 끝나면 작업 공간이 통째로 사라진다.

on:
  # ⭐ 표식 파일(.trigger/produce)이 바뀌면 자동으로 돈다 (2026-08-08).
  #    까닭: 손님이 버튼을 누른 뒤 코드가 고쳐지면 **그 실행에는 고친 것이 안 들어간다.**
  #    실제로 7분 차이로 그렇게 되어 영상 한 편을 헛만들었다. 이제 고친 사람이
  #    직접 시동을 걸 수 있어 '고쳐 놓고 눌러 달라 → 옛 코드로 돎' 이 사라진다.
  #    버튼(아래 workflow_dispatch)은 그대로라 손님 사용법은 안 바뀐다.
  push:
    paths:
      - '.trigger/produce'
  workflow_dispatch:
    inputs:
      episode:
        description: '회차 (비우면 대본이 있는 가장 최근 회차)'
        required: false
        default: ''
      art:
        description: '없는 그림을 만들까요 (인물 그림이 빠지면 회색 실루엣이 나갑니다)'
        required: true
        default: '없는 것만 만든다'
        type: choice
        options:
          - '없는 것만 만든다'
          - '배경만 만든다 (0원)'
          - '만들지 않는다 (있는 것으로)'
      limit:
        description: '앞 N컷만 (시험용. 0이면 전체)'
        required: false
        default: '0'
      voice:
        description: '나레이션'
        required: true
        default: '음성 생성'
        type: choice
        options:
          # ⭐ 기본값은 '시험 실행(앞 N컷)일 때는 자동으로 무음' 이다.
          #    시험은 화면을 보려고 돌리는 것이라 소리가 필요 없다. 값을 아낀다.
          - '음성 생성'
          - '무음으로 시험'
          - '시험 실행에도 음성 만들기'
      only:
        description: '하나만 다시 만들기 (비우면 전부)'
        required: false
        default: ''
        type: choice
        options: ['', 'longform', 'short1', 'short2', 'short3']
      upload:
        description: '유튜브 업로드 — 이제 관리자 페이지에서 영상 보고 올립니다'
        required: true
        default: '올리지 않음'
        type: choice
        options:
          # ⭐ 2026-08-07 부터 기본은 **안 올림**이다.
          #    영상을 눈으로 본 뒤 관리자 페이지에서 올린다(그때 바로 공개로 올라간다).
          - '올리지 않음'
          - '롱폼만 (비공개)'
          - '롱폼 + 쇼츠 (비공개)'

permissions:
  contents: write

concurrency:
  group: produce
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    # ⚠️ 표식 파일로 돌 때는 inputs 가 **전부 빈 값**이다. 그대로 쓰면
    #    'limit == 0' 같은 검사가 어긋나 음성 보관을 건너뛰는 등 조용히 망가진다.
    #    그래서 기본값을 여기서 정하고, 아래 단계들은 env 만 쓴다.
    env:
      EPISODE: ${{ inputs.episode || '' }}
      VOICE:   ${{ inputs.voice   || '음성 생성' }}
      ONLY:    ${{ inputs.only    || '' }}
      LIMIT:   ${{ inputs.limit   || '0' }}
      UPLOAD:  ${{ inputs.upload  || '올리지 않음' }}


    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 도구 준비 (FFmpeg · 한글 폰트)
        run: |
          set -euo pipefail
          # ⚠️ 여기서 ffmpeg 를 실제로 **설치**한다.
          #    예전에는 'ffmpeg -version | head -1' 로 확인만 했다. 그런데
          #    ① ubuntu-latest 이미지에서 ffmpeg 가 빠졌고
          #    ② 파이프( | head )라서 exit status 가 head(0) 이 되어
          #    ffmpeg 가 없어도 이 단계가 "성공" 으로 찍혔다.
          #    그래서 한참 뒤 나레이션 단계에서 FileNotFoundError 로 죽었다.
          #    set -o pipefail 과 실제 설치, 둘 다 있어야 한다.
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-nanum
          # numpy 는 목소리 높이를 재는 데 쓴다(tts.py normalize_pitch).
          # 없으면 높이 고르기가 조용히 건너뛰어져 목소리가 흔들린 채로 나간다.
          python3 -m pip install --quiet Pillow numpy

          # 있다고 믿지 않고 확인한다. 없으면 여기서 멈춘다 — 뒤에서 죽는 것보다 낫다.
          for cmd in ffmpeg ffprobe; do
            command -v "$cmd" >/dev/null || { echo "::error::$cmd 가 설치되지 않았습니다"; exit 1; }
            echo "$cmd: $($cmd -version 2>&1 | head -1)"
          done
          FONT=$(ls /usr/share/fonts/truetype/nanum/ 2>/dev/null | head -1 || true)
          [ -n "$FONT" ] || { echo "::error::한글 폰트가 설치되지 않았습니다"; exit 1; }
          echo "나눔 폰트: $FONT"

      - name: 회차 정하기
        id: pick
        run: |
          EP="${{ env.EPISODE }}"
          if [ -z "$EP" ]; then
            EP=$(ls -1 data/scripts/EP*.json 2>/dev/null | grep -v '\.eval\.\|\.shorts\.' | sort | tail -1 | xargs -n1 basename | sed 's/\.json//')
          fi
          if [ -z "$EP" ]; then
            echo "## 만들 대본이 없습니다" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "먼저 **2. 대본 만들기** 를 실행하십시오." >> "$GITHUB_STEP_SUMMARY"
            echo "::error::대본이 없습니다."
            exit 1
          fi
          echo "ep=$EP" >> "$GITHUB_OUTPUT"
          echo "회차: $EP"

      # ⭐ **만들기 전에 대본을 검사한다.**
      #    예전에는 대본 생성 때만 검사했다. 그래서 사람이 손으로 고친 대본이나
      #    규칙이 추가되기 전에 만들어 둔 옛 대본이 **검사 없이** 영상까지 갔다.
      #    12분 렌더링과 음성 값을 다 쓴 뒤에 잘못을 발견하면 늦다 — 여기서 막는다.
      # ⭐ 묶어서 읽힌 소리를 컷마다 잘라 쓰므로, **자르기가 틀리면 자막과 소리가
      #    통째로 밀린다.** 값이 나가기 전에 여기서 막는다(제미나이를 안 부른다 · 20초).
      - name: 음성 자르기 검사 (값 0원)
        run: |
          set -o pipefail
          python3 tools/voice_test_split.py
          python3 tools/voice_test_group.py
          python3 tools/voice_len_test.py
          python3 tools/voice_test_pitch.py
          python3 tools/voice_test_guard.py
          python3 tools/voice_test_stt.py
          python3 tools/shorts_test.py
          # 배역에 안 맞는 목소리를 막는 장치가 살아 있는가 (장남 186Hz 사건)
          python3 tools/voice_test_cast.py
          # 효과음에 '삑 삑'(기계가 만든 전자음)이 섞이지 않았는가 — 2026-08-09 손님 지적
          python3 tools/sfx_test.py
          # 회상 시점 자막이 그림과 어긋나지 않는가 — '아버지 생전' 문제
          python3 tools/timelabel_test.py
          python3 tools/variant_test.py
          # 인물이 배경과 따로 움직이는가 (합쳐지면 카메라 떨림으로 되돌아간다)
          python3 tools/motion_test.py

      # ⭐ 영상 맨 끝에 구독 유도 한 컷을 붙인다 (손님 선택 2026-08-07).
      #    대본에 컷으로 넣어야 **음성도 만들어지고** 자막·길이가 자동으로 따라온다.
      #    렌더링에서만 붙이면 소리가 없다.
      #    몇 번 돌려도 결과가 같다 — 이미 있으면 그냥 둔다.
      - name: 구독 유도 컷 붙이기
        run: |
          set -o pipefail
          python3 tools/add_outro.py "data/scripts/${{ steps.pick.outputs.ep }}.json"

      # ⭐ 효과음을 자동으로 깔아 준다 (손님 2026-08-09: "효과음이 너무 없어").
      #    실측: EP001 115컷 중 효과음이 있는 컷이 18컷(15%) 뿐이었다.
      #    대본을 다시 쓰면 값이 드니, 이미 쓴 대본에 코드가 규칙대로 깔아 준다.
      #    (대사 낱말 우선 → 배경 → 세 컷에 하나꼴 · 같은 소리 연달아 금지)
      #    몇 번을 돌려도 결과가 같다.
      - name: 효과음 깔기 (값 0원)
        run: |
          set -o pipefail
          python3 tools/add_sfx.py "data/scripts/${{ steps.pick.outputs.ep }}.json"

      - name: 대본 검사 (오류가 있으면 만들지 않는다)
        run: |
          set -o pipefail
          EP="${{ steps.pick.outputs.ep }}"
          if ! python3 src/validate_script.py "data/scripts/$EP.json" 2>&1 | tee check.log; then
            {
              echo "## 대본에 오류가 있어 영상을 만들지 않았습니다"
              echo ""
              echo "아래 오류를 고친 뒤 다시 실행하십시오."
              echo ""
              echo '```'
              grep -E "ERROR" check.log | head -20
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::대본 검사에서 오류가 나왔습니다. 요약 화면을 보십시오."
            exit 1
          fi

      # 제미나이로 만든 배경에는 오른쪽 아래에 로고가 박혀 나온다.
      # 렌더 전에 자동으로 지운다. 이미 지운 그림은 건너뛴다.
      - name: 배경 워터마크 지우기
        run: |
          python3 src/dewatermark.py assets/bg || true

      # ⚠️ 2026-08-12 — 인물 다듬기(despike)를 **껐다** (손님 선택).
      #    까닭: 다듬기가 그림을 크게 갉아먹었다. 실측 손실률 —
      #      F70 전신 78% · M50B 전신 76% · F50B 전신 72% · F50A 얼굴 35%
      #    F50A 는 시트 배치가 맞는데도 35% 가 깎였다. 즉 자르기를 고쳐도
      #    이것 자체가 과하다. '떨어져 나온 조각 제거' 가 머리·눈동자를
      #    조각으로 보고 지운 것이다.
      #    애니 그림은 선이 또렷해 어깨 삐죽이가 거의 안 생긴다(사진과 다르다).
      #    없애서 얻는 것보다 깎여서 잃는 것이 훨씬 크므로 아예 안 부른다.
      #    (되살리려면 src/despike.py 가 그대로 있다 — 지우지 않았다)

      # ⭐ 없는 그림을 **먼저 만든다** (2026-08-12 손님 지적)
      #
      #    손님: "등장인물 이미지 생성을 안 하고 그냥 만들면 어떡하냐.
      #           기존에 있던 거 활용하거나 없는 인물은 새로 생성을 해야지."
      #
      #    맞는 말이었다. 여기에는 그림을 **만드는 단계가 아예 없었다.**
      #    검사 한 줄이 전부였고 그마저 `|| true` 라 없어도 그냥 넘어갔다.
      #    실측: 인물 그림 81장이 빠진 채로 EP001·EP002 가 만들어졌다 —
      #    그 자리는 전부 회색 실루엣으로 나갔다.
      #
      #    이제 렌더 전에 **없는 것만** 만든다(있는 것은 건드리지 않는다).
      #    배경은 Pixabay·Pexels 라 0원, 인물은 한 장에 약 57원이다(애니+flash).
      - name: 없는 그림 만들기 (있는 것은 그대로 쓴다)
        if: inputs.art != '만들지 않는다 (있는 것으로)'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # ⭐ 사진 창고를 **둘** 걸어 둔다. 하나가 막혀도 배경 받기가 안 멈춘다.
          #    (2026-08-12 손님: 열쇠를 둘 다 넣어 뒀는데 한쪽만 쓰고 있었다)
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          set -o pipefail
          echo "── 만들기 전 상태 ──"
          python3 src/assets_gen.py check || true
          echo ""
          # ⭐ ① 있는 것부터 **반영한다** (값 0원 · 2026-08-12 손님 지적)
          #    "이미지 생성이 완료된 거는 그 영상에 반영을 하는 알고리즘이
          #     미리 구축이 되어 있었어야 되잖아."  맞는 말이었다.
          #    시트는 있는데 컷아웃이 없으면 무결성 검사가 영영 막는다 —
          #    손님이 제미나이에서 뽑아 직접 올린 시트가 딱 그 경우다.
          #    만들기 전에 이것부터 돌려 **돈 안 쓰고 되는 것부터** 채운다.
          echo "── 있는 시트를 컷아웃으로 반영 (0원) ──"
          python3 src/assets_gen.py sync || true
          echo ""
          # 배경 먼저 — 공짜다. 없는 것만 받는다(--force 를 주지 않는다).
          if [ -n "$PIXABAY_API_KEY" ] || [ -n "$PEXELS_API_KEY" ]; then
            python3 src/bg_fetch.py 2>&1 | tail -20 || echo "(배경 받기 실패 — 있는 것으로 간다)"
          else
            echo "(PIXABAY_API_KEY·PEXELS_API_KEY 가 둘 다 없어 배경은 건너뛴다)"
          fi
          if [ "${{ inputs.art }}" = "배경만 만든다 (0원)" ]; then
            echo "배경만 만들기로 했다 — 인물은 건너뛴다."
          else
            # ⭐ ② 그러고도 없는 것만 새로 만든다 (한 장 약 57원 · flash)
            #    --limit 을 주지 않는다 = 무제한. 상한을 걸면 배우가 말없이 빠진다.
            echo "── 그래도 없는 인물만 새로 만들기 ──"
            python3 src/assets_gen.py images --what char 2>&1 | tail -30 \
              || echo "(인물 그림 만들기 실패 — 아래 검사에서 걸린다)"
            # ③ 방금 만든 시트가 혹시 안 잘렸으면 여기서 마저 자른다.
            #    (만드는 중에 죽어도 다음 실행이 이어받을 수 있게 한 겹 더 둔다)
            python3 src/assets_gen.py sync || true
          fi
          echo ""
          echo "── 만든 뒤 상태 ──"
          python3 src/assets_gen.py check || true

      - name: 에셋 무결성 검사
        run: |
          # ⚠️ 예전에는 `|| true` 라 **없어도 그냥 넘어갔다.** 그래서 회색 실루엣이
          #    섞인 영상이 조용히 만들어졌다. 이제 인물 그림이 빠져 있으면 멈춘다.
          #    (소리·음악이 빠진 것은 무음으로 대체돼도 견딜 만하므로 알림만 한다)
          python3 src/assets_gen.py check > asset.log 2>&1 || true
          cat asset.log
          if grep -qE '^  char +[0-9]+개' asset.log; then
            N=$(grep -oE '^  char +[0-9]+' asset.log | grep -oE '[0-9]+')
            {
              echo "## 인물 그림이 ${N}장 빠져 있습니다 — 영상을 만들지 않았습니다"
              echo ""
              echo "이대로 만들면 그 자리에 **회색 실루엣**이 나갑니다."
              echo ""
              echo "**'없는 그림을 만들까요'** 를 **없는 것만 만든다** 로 놓고 다시 실행하십시오."
              echo "(인물 한 장에 약 57원입니다. 한 번 만들면 다음 회차부터는 그대로 씁니다)"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::인물 그림 ${N}장이 빠져 있습니다. 회색 실루엣이 나가므로 멈춥니다."
            exit 1
          fi

          # 인물 그림에 칸 선(인쇄된 검은 줄)이 남아 있는지 본다.
          # 발행하고 나서 발견하면 늦다 — 여기서 이름을 찍어 둔다.
          # ⚠️ 자동으로 지우지 않는다. 지우려다 옷을 갉아먹은 적이 여러 번 있다.
          #    걸리면 char_sheet.py --redo 로 그 포즈만 다시 만든다.
          python3 src/linecheck.py > line.log 2>&1 || true
          cat line.log

          # ⭐⭐ 목이 잘린 인물이 있으면 **영상을 만들지 않는다.** (2026-08-13)
          #    손님: "미친놈아 이건 목이 잘렸잖아" — 목 아래만 남은 인물 셋이
          #    그대로 방송에 나갔다. 사람이 눈으로 보기 전까지 아무도 몰랐다.
          #    빠진 그림은 위에서 막고 있었는데 **망가진 그림은 아무도 안 막았다.**
          #    빠진 것보다 망가진 것이 나쁘다 — 빠지면 멈추기라도 하는데
          #    망가진 것은 조용히 방송된다. 여기서 멈춘다.
          if ! python3 tools/head_test.py > head.log 2>&1; then
            cat head.log
            {
              echo "## 목이 잘린 인물이 있어 영상을 만들지 않았습니다"
              echo ""
              echo '```'
              head -n 20 head.log
              echo '```'
              echo ""
              echo "지금 걸리는 것은 전부 **옛 격자 시트를 쓰는 배우들**입니다."
              echo "**[0. 에셋 만들기] → [남은 배우 6명 (M70 빼고 · 12장 · 약 3,180원)]** 을"
              echo "한 번 돌리면 풀립니다 (M70 은 이미 새 시트로 확인 완료).""
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::목이 잘린 인물이 있습니다. 그대로 방송될 수 없어 멈춥니다."
            exit 1
          fi
          cat head.log

      # ⭐ **화면을 실제로 그려 보고 검사한다.** 대본 검사만으로는 못 잡는 것이 있다.
      #
      #    8월 4일에 손님이 캡처해 보낸 두 가지가 그랬다.
      #      · 아버지와 어머니가 **같은 자리에 포개져** 머리가 두 겹으로 나왔다
      #      · 오른쪽에 선 차남의 이름표가 **왼쪽 어머니 옆에** 붙어 나갔다
      #    둘 다 렌더링은 아무 오류 없이 성공한다. 영상을 눈으로 봐야만 드러나는데
      #    114컷 × 가로·세로 = 228장을 사람이 다 볼 수는 없다.
      #
      #    이제 렌더러가 스스로 겹침을 풀고 이름표를 주인 옆에 붙이지만,
      #    **고쳤다고 믿지 않고 매 회차 다시 잰다.** 1분이면 끝난다.
      - name: 화면 배치 검사 (겹침·잘림·이름표)
        run: |
          set -o pipefail
          EP="${{ steps.pick.outputs.ep }}"
          FAIL=0
          python3 src/graphics.py --check "data/scripts/$EP.json" 2>&1 | tee frame.log || FAIL=1
          python3 tools/check_place.py "$EP" 2>&1 | tee place.log || FAIL=1
          # ⚠️ despike --check 를 뺐다 — 다듬기를 끄기로 했으므로(2026-08-12 손님 선택)
          #    "삐죽이가 남았다" 는 이유로 영상을 막으면 영영 못 만든다.
          if [ "$FAIL" != "0" ]; then
            {
              echo "## 화면 배치에 문제가 있어 영상을 만들지 않았습니다"
              echo ""
              echo '```'
              tail -n 40 frame.log
              tail -n 40 place.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::화면 배치 검사에서 문제가 나왔습니다. 요약 화면을 보십시오."
            exit 1
          fi

      # ⭐ 만들어 둔 음성을 다시 쓴다 — 이 워크플로에서 돈이 드는 곳은 여기뿐이다.
      #
      #    실행할 때마다 작업 공간이 새것이라, 예전에는 렌더링에서 실패하고 다시 눌러도
      #    음성 113개를 처음부터 다시 만들었다. 재시도 한 번에 한 편 값이 통째로 또 나갔다.
      #    대본이 그대로면 음성도 그대로다 — 대본 내용으로 열쇠를 만들어 보관했다 재사용한다.
      #    대본을 고치면 열쇠가 달라져 자동으로 새로 만든다.
      #
      #    ⚠️ 열쇠에는 **대본 지문 + 음성 처리 지문(tts.py)** 두 가지가 들어간다.
      #       음성 처리 지문이 없으면 이런 구멍이 생긴다 —
      #         · 보관함 열쇠는 한 번 쓰면 덮어쓸 수 없다(깃허브 규칙).
      #         · 그래서 열쇠가 그대로면 아래 보관 단계를 건너뛴다.
      #         · 그러면 **이번 실행에서 고친 음성이 통째로 버려지고**, 다음 실행은
      #           안 고친 옛 음성을 다시 꺼내 또 고친다 → 같은 값이 매번 또 나간다.
      #       실제로 2026-08-06 에 이 구멍을 찾았다. 음높이 고치기가 매 실행 약 6원씩
      #       영원히 나갈 뻔했다. 이제 tts.py 를 고치면 열쇠가 바뀌어 **고친 음성이 남는다.**
      #       (열쇠가 바뀌어도 아래 restore-keys 로 옛 음성을 그대로 되살려 쓰므로,
      #        음성을 새로 만드는 값은 들지 않는다.)
      - name: 대본 지문 (음성 재사용 열쇠)
        id: fp
        run: |
          set -euo pipefail
          H=$(sha256sum "data/scripts/${{ steps.pick.outputs.ep }}.json" | cut -c1-16)
          V=$(sha256sum src/tts.py | cut -c1-8)
          echo "hash=$H" >> "$GITHUB_OUTPUT"
          echo "voice=$V" >> "$GITHUB_OUTPUT"
          echo "대본 지문: $H · 음성 처리 지문: $V"

      - name: 만들어 둔 음성 불러오기
        id: voicecache
        if: env.VOICE != '무음으로 시험'
        uses: actions/cache/restore@v4
        with:
          path: build/voice
          key: voice-${{ steps.pick.outputs.ep }}-${{ steps.fp.outputs.hash }}-${{ steps.fp.outputs.voice }}
          # 열쇠가 안 맞으면 아래 순서로 **가장 비슷한 것**을 가져온다.
          #   ① 같은 대본의 옛 음성 (음성 처리만 바뀐 경우 — 소리는 그대로 재사용)
          #   ② 그 회차의 아무 음성   (대본이 조금 바뀐 경우 — 바뀐 컷만 새로 만든다)
          # (어느 컷을 다시 만들지는 tts.py 의 prune_stale 이 '조리법'으로 판단한다)
          restore-keys: |
            voice-${{ steps.pick.outputs.ep }}-${{ steps.fp.outputs.hash }}-
            voice-${{ steps.pick.outputs.ep }}-

      - name: 나레이션 만들기
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # ⭐ 한도는 **모델 하나당 분당 10회** 다(429 본문으로 실측 확인:
          #    GenerateRequestsPerMinutePerProjectPerModel = 10).
          #    무료 등급 문제도, 하루 한도 문제도 아니다.
          #    예전에는 TTS_RPM=10 으로 한도에 딱 붙여 한 모델만 두들겼다. 여유가 0 이라
          #    조금만 흔들려도 넘고, 넘으면 재시도가 다음 분의 몫을 또 먹어 영영 안 풀렸다
          #    — 16컷 성공 뒤 30분 내내 429, 114컷 중 22컷에서 중단됐다.
          #    이제 tts.py 가 flash 모델을 번갈아 쓰므로 모델당 8 이면 넉넉하다.
          TTS_PER_MODEL_RPM: '8'
        run: |
          set -o pipefail
          ARGS=()
          SILENT=0
          [ "${{ env.VOICE }}" = "무음으로 시험" ] && SILENT=1
          # ⭐ **시험 실행(앞 N컷)은 자동으로 무음**으로 돌린다 (손님 선택 2026-08-04).
          #    시험은 화면을 보려고 누르는 것이라 소리가 필요 없는데, 예전에는
          #    누를 때마다 그만큼 음성 값이 나갔다. 소리까지 확인하고 싶으면
          #    나레이션에서 **'시험 실행에도 음성 만들기'** 를 고르면 된다.
          if [ "${{ env.LIMIT }}" != "0" ] \
             && [ "${{ env.VOICE }}" != "시험 실행에도 음성 만들기" ]; then
            SILENT=1
            echo "시험 실행이라 음성을 만들지 않습니다 (값 0원)."
            echo "  소리까지 보시려면 나레이션에서 '시험 실행에도 음성 만들기' 를 고르십시오."
          fi
          [ "$SILENT" = "1" ] && ARGS+=(--silent)
          # ⚠️ 앞 N컷만 렌더링할 때는 음성도 N컷만 만든다.
          #    예전에는 --limit 을 렌더링에만 줬다. 10컷만 보려는데 음성은 113컷을
          #    다 만들려 했고, 그래서 속도 제한(429)에 걸렸다. 돈도 11배로 나간다.
          if [ "${{ env.LIMIT }}" != "0" ]; then ARGS+=(--limit "${{ env.LIMIT }}"); fi
          python3 src/tts.py "data/scripts/${{ steps.pick.outputs.ep }}.json" \
            --out build/voice "${ARGS[@]}" 2>&1 | tee tts.log

          # 쇼츠는 세로 화면에 맞춰 **대사를 짧게 다시 쓴다.** 본편 음성을 그대로 붙이면
          # 자막과 소리가 어긋나고, 길이도 규격(35~50초)을 훌쩍 넘는다.
          # 시험 렌더링(--limit)일 때는 쇼츠를 안 만들므로 음성도 만들지 않는다.
          if [ "${{ env.LIMIT }}" = "0" ] && [ "${{ env.VOICE }}" != "무음으로 시험" ]; then
            python3 src/tts.py "data/scripts/${{ steps.pick.outputs.ep }}.json" \
              --out build/voice --shorts 2>&1 | tee -a tts.log
          fi

      # ⭐ 보관할지 말지를 **여기서 눈에 보이게** 정한다.
      #    예전에는 보관 단계의 조건 안에 hashFiles(...) 를 숨겨 놨다. 그런데 8월 2일
      #    실행에서 음성 144컷을 다 만들고도 보관 단계가 소리 없이 건너뛰어졌고,
      #    조건 안에서 일어난 일이라 **왜 건너뛰었는지 기록조차 남지 않았다.**
      #    하루치 음성 한도를 통째로 버린 셈이라, 다음 날까지 다시 만들 수 없었다.
      #    이제 개수를 세어 로그에 찍고, 그 값으로만 판단한다.
      - name: 음성이 몇 컷 만들어졌는지 세기
        if: always()
        id: voicecount
        run: |
          # _master_*.mp3 는 컷이 아니라 '한 통 원본' 보관본이다 — 컷 수에서 뺀다
          N=$(find build/voice -name '*.mp3' ! -name '_*' 2>/dev/null | wc -l | tr -d ' ')
          echo "n=$N" >> "$GITHUB_OUTPUT"
          echo "만들어진 음성: ${N}컷"
          if [ "$N" = "0" ]; then
            echo "::warning::음성이 하나도 없어 보관하지 않습니다."
          fi

      # 음성을 만들자마자 곧바로 보관한다. 잡이 끝날 때 저장하면, 뒤의 렌더링에서
      # 실패했을 때 방금 돈 주고 만든 음성이 통째로 날아간다 — 막으려던 바로 그 상황이다.
      #
      # ⚠️ 열쇠에 대본 지문 + 음성 처리 지문이 들어간다. 둘 중 하나라도 바뀌면 열쇠가
      #    바뀌므로 **새로 보관**한다. cache-hit 이 참일 때만 건너뛴다 — 그때는 꺼내 온
      #    음성이 이미 지금 방식으로 손본 것이라, 이번에 또 손볼 것이 없기 때문이다.
      #
      # ⭐ 여기서 보관하는 것은 **손을 다 본 음성**이다. tts.py 가 음높이를 고른 뒤에
      #    이 단계가 돈다. 그래서 다음 실행은 이미 고쳐진 소리를 꺼내 쓰고,
      #    같은 컷을 다시 읽히느라 값을 또 쓰지 않는다.
      #
      # ⭐ 컷 파일과 함께 **'한 통 원본'(_master_*.mp3)도 같이 보관된다.**
      #    묶어 읽힌 통을 자르기 전 그대로 남긴 것이다(tts.py _one_group).
      #    다음에 자르는 코드만 고칠 때는 이 원본을 다시 자르기만 하면 되므로
      #    음성 생성비가 0원이다 — 2026-08-08 g3→g4 수리 때 원본이 없어서
      #    한 편(약 650원)을 통째로 다시 만든 일의 재발 방지 장치다.
      #
      # ⭐⭐ **시험 실행(--limit)은 절대 보관하지 않는다.** 손님이 "영상을 몇 번
      #    다시 만드는지 모르겠다" 며 비용을 지적해 찾아낸 구멍이다.
      #      · 예전 열쇠는 `voice-EP001-{지문}-n{limit}` 이라 시험(n12)과 전체(n0)가
      #        **다른 칸**에 저장됐다.
      #      · 되살릴 때는 `restore-keys: voice-EP001-` 로 **가장 최근 것**을 가져온다.
      #      · 그래서 전체(144컷)를 만들어 둔 뒤 시험(12컷)을 한 번만 돌리면,
      #        시험 캐시가 더 최근이라 **다음 전체 실행이 12컷만 되살리고
      #        132컷을 다시 만든다.** 한 편 값이 통째로 또 나간다.
      #    이제 전체 실행(limit=0)만 보관한다. 시험은 되살려 쓰기만 하고 남기지 않는다.
      - name: 만든 음성 보관 (다음 실행에서 재사용)
        if: always() && env.VOICE != '무음으로 시험'
             && env.LIMIT == '0'
             && steps.voicecache.outputs.cache-hit != 'true'
             && steps.voicecount.outputs.n != '0'
        uses: actions/cache/save@v4
        with:
          path: build/voice
          key: voice-${{ steps.pick.outputs.ep }}-${{ steps.fp.outputs.hash }}-${{ steps.fp.outputs.voice }}

      # ⭐⭐ **목소리가 인물마다 한결같은지 기계가 듣는다. 여기서 막는다.**
      #
      #    왜 반드시 있어야 하나 — 손님 질문(2026-08-06): "다음 회차에도 생기면?"
      #      목소리 흩어짐을 세 번 고쳤는데 **세 번 다 손님이 귀로 먼저 발견**하셨다.
      #      그때는 이미 렌더링 50분과 음성 값을 다 쓴 뒤였다.
      #      고치는 장치를 아무리 잘 만들어도 **그 장치가 고장 났을 때 알려주는 것이
      #      없으면** 똑같은 일이 또 난다. 그래서 사람 귀 대신 여기서 먼저 듣는다.
      #
      #    ⚠️ 이 검사는 고치는 코드(tts.py 묶어 읽기)와 **따로** 돈다. 묶어 읽기가
      #       통째로 실패해 예전 방식으로 되돌아가도 여기서 잡힌다.
      #    ⚠️ 음성을 **보관한 뒤** 에 검사한다. 여기서 멈춰도 만든 음성은 안 날아간다 —
      #       다시 눌렀을 때 같은 값이 또 나가면 안 된다.
      - name: 목소리가 한결같은지 검사 (값 0원 · 흩어졌으면 여기서 멈춘다)
        if: env.VOICE != '무음으로 시험' && env.LIMIT == '0'
        run: |
          set -o pipefail
          EP="${{ steps.pick.outputs.ep }}"
          if ! python3 src/voiceguard.py "data/scripts/$EP.json" \
                 --voice build/voice --shorts 2>&1 | tee guard.log; then
            {
              echo "## 목소리가 흩어져서 영상을 만들지 않았습니다"
              echo ""
              echo "아래 컷들이 같은 인물인데 **다른 사람처럼** 들립니다."
              echo "(12반음이 한 옥타브입니다. 3반음만 넘어도 귀에 걸립니다)"
              echo ""
              echo '```'
              cat guard.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::목소리가 인물마다 한결같지 않습니다. 요약 화면을 보십시오."
            exit 1
          fi

      - name: 렌더링 (롱폼 16:9 + 쇼츠 9:16)
        run: |
          set -o pipefail
          ARGS=()
          if [ "${{ env.LIMIT }}" != "0" ]; then ARGS+=(--limit "${{ env.LIMIT }}"); fi
          # 하나만 다시 만들기 — 쇼츠 한 편이면 50분이 아니라 5분이면 끝난다
          if [ -n "${{ env.ONLY }}" ]; then ARGS+=(--only "${{ env.ONLY }}"); fi
          python3 src/render.py "data/scripts/${{ steps.pick.outputs.ep }}.json" \
            --out build --shorts --narration build/voice "${ARGS[@]}" 2>&1 | tee render.log
          ls -la build/*.mp4

      # ⭐ 썸네일을 만든다. 대본에서 금액·인물·제목을 뽑아 한 장 그린다.
      #    유튜브 기본 썸네일은 영상 한 프레임이라 글자가 없다 — 조회수가 여기서 갈린다.
      #    비용 0원(코드가 그린다). 실패해도 영상 제작은 계속한다.
      - name: 썸네일 만들기
        if: always() && hashFiles('build/longform.mp4') != ''
        run: |
          python3 src/thumb.py "data/scripts/${{ steps.pick.outputs.ep }}.json" \
            --out build/thumb.jpg 2>&1 | tee thumb.log || true

      # ⭐ 관리자 페이지에서 바로 보려면 영상이 어딘가에 남아 있어야 한다.
      #    실행이 끝나면 작업 공간은 통째로 사라지기 때문이다.
      #
      #    저장소에 **커밋**하는 것은 절대 안 된다 — 지워도 이력에 영구히 남아
      #    저장소가 되돌릴 수 없이 커진다(지침서 11번).
      #    릴리스 자산은 git 이력 **밖**에 있다. 커밋이 아니고, 지우면 그냥 사라진다.
      #    그래서 규칙을 어기지 않으면서 관리자 페이지가 스트리밍할 수 있다.
      #
      #    유튜브에 올리기 **전에** 한다. 업로드가 실패해도 영상은 남아야 한다.
      # ⭐ 유튜브에 올라갈 **제목·설명·목차·해시태그**를 영상과 같이 보관한다.
      #    나중에 관리자 페이지에서 올릴 때 이 파일을 그대로 쓴다 —
      #    목차 시각을 실제 영상 길이로 계산해 두므로 눌렀을 때 안 어긋난다.
      - name: 올라갈 내용 만들기 (제목·설명·목차·해시태그)
        if: hashFiles('build/*.mp4') != ''
        run: |
          set -o pipefail
          python3 src/upload.py meta "${{ steps.pick.outputs.ep }}" \
            --narration build/voice --out build/meta.json

      - name: 관리자 페이지에서 볼 수 있게 보관 (릴리스 자산)
        if: hashFiles('build/*.mp4') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          EP="${{ steps.pick.outputs.ep }}"
          TAG="video-$EP"

          # ⚠️ **하나만 다시 만들었으면 릴리스를 지우면 안 된다.**
          #    지우면 이번에 안 만든 나머지 영상까지 같이 사라진다.
          if [ -z "${{ env.ONLY }}" ]; then
            gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          fi
          # 썸네일도 같이 올린다 — 관리자 페이지가 여기서 가져다 보여주고 내려받게 한다.
          FILES=(build/*.mp4)
          [ -f build/thumb.jpg ] && FILES+=(build/thumb.jpg)
          [ -f build/meta.json ] && FILES+=(build/meta.json)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
            echo "보관함 갱신: $TAG (${#FILES[@]}개)"
          else
          gh release create "$TAG" \
            --title "$EP 영상" \
            --notes "관리자 페이지에서 보기 위한 파일입니다. 저장소 커밋이 아닙니다." \
            --prerelease \
            "${FILES[@]}"
          echo "보관함: $TAG (${#FILES[@]}개)"
          fi

          # 최근 3편만 남긴다. 편당 100MB 안팎이라 그냥 두면 계속 쌓인다.
          #
          # ⚠️ 여기는 **절대 실패하면 안 되는 자리**다. 바로 위에서 영상 보관은 이미
          #    끝났는데, 청소하다 죽으면 워크플로 전체가 빨간 X 가 된다.
          #    특히 `set -o pipefail` 에서 grep 은 찾은 게 없으면 1 을 돌려주므로
          #    (영상 릴리스가 아직 하나도 없는 첫 실행) 그것만으로 실패한다.
          #    한 시간짜리 제작이 청소 때문에 실패로 찍히는 일은 없어야 한다.
          KEEP=3
          OLD=$(gh release list --limit 100 --json tagName --jq '.[].tagName' 2>/dev/null \
                | grep '^video-' | sort -r | tail -n "+$((KEEP+1))" || true)
          for t in $OLD; do
            echo "오래된 영상 지움: $t"
            gh release delete "$t" --yes --cleanup-tag || true
          done

      - name: 유튜브 업로드 (비공개)
        if: startsWith(env.UPLOAD, '롱폼')
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          set -o pipefail
          # ⭐ 열쇠가 없으면 **여기서 먼저** 알려 준다.
          #    8월 2일 실행이 그랬다. 영상은 12분짜리까지 다 만들어졌는데
          #    유튜브 열쇠만 없어서 빨간 X 가 떴고, 화면만 봐서는 영상이
          #    안 만들어진 것처럼 보였다. 무엇이 되고 무엇이 안 됐는지 갈라서 적는다.
          if [ -z "$YOUTUBE_CLIENT_ID" ] || [ -z "$YOUTUBE_CLIENT_SECRET" ] \
             || [ -z "$YOUTUBE_REFRESH_TOKEN" ]; then
            {
              echo "## 영상은 다 만들어졌습니다 — 유튜브 업로드만 못 했습니다"
              echo ""
              echo "**영상 보기**: 위 관리자 페이지 또는 이 저장소의 Releases 에 들어 있습니다."
              echo ""
              echo "유튜브에 올리려면 열쇠 3개를 등록해야 합니다."
              echo "저장소 → Settings → Secrets and variables → Actions"
              echo ""
              echo "- \`YOUTUBE_CLIENT_ID\`"
              echo "- \`YOUTUBE_CLIENT_SECRET\`"
              echo "- \`YOUTUBE_REFRESH_TOKEN\`"
              echo ""
              echo "발급 절차는 STARTGUIDE.md 3-2 에 있습니다."
              echo "지금 당장 올릴 생각이 없으시면, 다음부터는 '유튜브 업로드' 를"
              echo "**올리지 않음** 으로 두고 실행하시면 빨간 X 가 뜨지 않습니다."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::영상은 만들어졌습니다. 유튜브 열쇠 3개가 없어 업로드만 못 했습니다."
            exit 1
          fi
          python3 src/upload.py private "${{ steps.pick.outputs.ep }}" \
            --video build/longform.mp4 --narration build/voice 2>&1 | tee upload.log
          if [ "${{ env.UPLOAD }}" = "롱폼 + 쇼츠" ]; then
            python3 src/upload.py shorts "${{ steps.pick.outputs.ep }}" --dir build 2>&1 | tee -a upload.log
          fi

      - name: 결과 화면
        if: always()
        run: |
          {
            echo "## ${{ steps.pick.outputs.ep }} 영상 제작"
            echo ""
            for f in asset.log line.log tts.log render.log upload.log; do
              [ -f "$f" ] || continue
              echo "### ${f%.log}"
              echo '```'
              tail -n 20 "$f"
              echo '```'
              echo ""
            done
            if ls build/*.mp4 >/dev/null 2>&1; then
              echo "### 만들어진 파일"
              echo ""
              echo "| 파일 | 크기 | 길이 |"
              echo "|---|---|---|"
              for v in build/*.mp4; do
                SZ=$(du -h "$v" | cut -f1)
                DU=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$v" 2>/dev/null | cut -d. -f1)
                echo "| $(basename "$v") | $SZ | ${DU}초 |"
              done
              echo ""
              echo "> 영상 파일은 저장소에 커밋하지 않습니다."
              echo "> **관리자 페이지에서 바로 보실 수 있습니다** — 회차 옆 \`영상 보기\` 버튼."
              if [ "${{ env.UPLOAD }}" != "올리지 않음" ]; then
                echo "> 유튜브에도 비공개로 올라갔습니다."
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 상태 커밋 (영상은 제외)
        if: always()
        run: |
          git config user.name  "verdict-theater-bot"
          git config user.email "actions@github.com"
          # data/scripts 와 state 만. build/ 는 .gitignore 가 막고 있다.
          git add state data/scripts 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "바뀐 것이 없다."
            exit 0
          fi
          git commit -m "제작: ${{ steps.pick.outputs.ep }} 상태 갱신 [skip ci]"
          # ⚠️ 직접 push 하지 않는다. 밀렸을 때 rebase 충돌이 나면 예전 방식은
          #    커밋을 조용히 버리고 "Everything up-to-date" 로 성공 처리했다.
          #    (2026-08-10 EP002 대본 실종) tools/push.sh 가 그 자리를 안전하게 처리한다.
          # ⚠️ assets 를 빠뜨리면 **방금 만든 그림이 통째로 버려진다.**
          #    (2026-08-12: 없는 그림 만들기 단계를 넣었는데 커밋 경로에 assets 가 없어,
          #     받아온 배경과 만든 인물 시트가 실행이 끝나면 사라질 뻔했다 —
          #     돈만 내고 아무것도 안 남는 구조였다)
          bash tools/push.sh "제작: ${{ steps.pick.outputs.ep }} 상태 갱신 [skip ci]" \
               state data/scripts assets

      - name: 영상이 저장소에 들어갔는지 확인
        if: always()
        run: |
          # 지침서 11번 — MP4 가 커밋되면 되돌릴 수 없다. 마지막에 반드시 확인한다.
          if git ls-files | grep -iE '\.(mp4|mov|mkv|webm)$'; then
            echo "::error::영상 파일이 저장소에 들어갔습니다. 즉시 제거해야 합니다."
            exit 1
          fi
          echo "영상 파일 없음 — 정상"

      - name: 텔레그램 알림 (성공·실패 둘 다)
        # ⚠️ 반드시 **맨 마지막** 이어야 한다. job.status 가 여기까지의 결과를 담는다.
        #    always() 라서 앞이 실패해도 이 단계는 돈다 — 그래야 실패를 알릴 수 있다.
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTIFY_WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK }}
        run: |
          # 알림 때문에 실행이 실패하는 일은 없어야 한다 — notify.py 는 늘 0 으로 끝난다.
          STATUS=ok
          [ "${{ job.status }}" = "success" ] || STATUS=fail
          python3 src/notify.py --kind produce --status "$STATUS" \
            --ep "${{ steps.pick.outputs.ep }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
