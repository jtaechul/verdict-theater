name: 3. 영상 만들기

# 대본 → 영상 → 유튜브 비공개 업로드.
#
# 아이폰 GitHub 앱에서 쓰는 법
#   Actions 탭 → "3. 영상 만들기" → Run workflow
#
# 끝나면 유튜브 앱에서 비공개 영상을 확인하고,
# "4. 공개하기" 버튼으로 공개 전환한다.
#
# ⚠️ 완성 영상(MP4)은 저장소에 절대 커밋하지 않는다.
#    편당 수백 MB이고, 지워도 이력에 영구히 남아 저장소가 되돌릴 수 없이 커진다.
#    실행이 끝나면 작업 공간이 통째로 사라진다.

on:
  workflow_dispatch:
    inputs:
      episode:
        description: '회차 (비우면 대본이 있는 가장 최근 회차)'
        required: false
        default: ''
      limit:
        description: '앞 N컷만 (시험용. 0이면 전체)'
        required: false
        default: '0'
      voice:
        description: '나레이션'
        required: true
        default: '음성 생성'
        type: choice
        options:
          - '음성 생성'
          - '무음으로 시험'
      upload:
        description: '유튜브 업로드'
        required: true
        default: '롱폼만'
        type: choice
        options:
          - '롱폼만'
          - '롱폼 + 쇼츠'
          - '올리지 않음'

permissions:
  contents: write

concurrency:
  group: produce
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 180


    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 도구 준비 (FFmpeg · 한글 폰트)
        run: |
          set -euo pipefail
          # ⚠️ 여기서 ffmpeg 를 실제로 **설치**한다.
          #    예전에는 'ffmpeg -version | head -1' 로 확인만 했다. 그런데
          #    ① ubuntu-latest 이미지에서 ffmpeg 가 빠졌고
          #    ② 파이프( | head )라서 exit status 가 head(0) 이 되어
          #    ffmpeg 가 없어도 이 단계가 "성공" 으로 찍혔다.
          #    그래서 한참 뒤 나레이션 단계에서 FileNotFoundError 로 죽었다.
          #    set -o pipefail 과 실제 설치, 둘 다 있어야 한다.
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-nanum
          python3 -m pip install --quiet Pillow

          # 있다고 믿지 않고 확인한다. 없으면 여기서 멈춘다 — 뒤에서 죽는 것보다 낫다.
          for cmd in ffmpeg ffprobe; do
            command -v "$cmd" >/dev/null || { echo "::error::$cmd 가 설치되지 않았습니다"; exit 1; }
            echo "$cmd: $($cmd -version 2>&1 | head -1)"
          done
          FONT=$(ls /usr/share/fonts/truetype/nanum/ 2>/dev/null | head -1 || true)
          [ -n "$FONT" ] || { echo "::error::한글 폰트가 설치되지 않았습니다"; exit 1; }
          echo "나눔 폰트: $FONT"

      - name: 회차 정하기
        id: pick
        run: |
          EP="${{ inputs.episode }}"
          if [ -z "$EP" ]; then
            EP=$(ls -1 data/scripts/EP*.json 2>/dev/null | grep -v '\.eval\.\|\.shorts\.' | sort | tail -1 | xargs -n1 basename | sed 's/\.json//')
          fi
          if [ -z "$EP" ]; then
            echo "## 만들 대본이 없습니다" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "먼저 **2. 대본 만들기** 를 실행하십시오." >> "$GITHUB_STEP_SUMMARY"
            echo "::error::대본이 없습니다."
            exit 1
          fi
          echo "ep=$EP" >> "$GITHUB_OUTPUT"
          echo "회차: $EP"

      # 제미나이로 만든 배경에는 오른쪽 아래에 로고가 박혀 나온다.
      # 렌더 전에 자동으로 지운다. 이미 지운 그림은 건너뛴다.
      - name: 배경 워터마크 지우기
        run: |
          python3 src/dewatermark.py assets/bg || true

      - name: 에셋 무결성 검사
        run: |
          # 렌더 전에 필요한 파일이 다 있는지 본다. 하나 없으면 대체물로 채워지므로
          # 발행 품질이 아니라는 것을 여기서 분명히 알려준다.
          python3 src/assets_gen.py check > asset.log 2>&1 || true
          cat asset.log

          # 인물 그림에 칸 선(인쇄된 검은 줄)이 남아 있는지 본다.
          # 발행하고 나서 발견하면 늦다 — 여기서 이름을 찍어 둔다.
          # ⚠️ 자동으로 지우지 않는다. 지우려다 옷을 갉아먹은 적이 여러 번 있다.
          #    걸리면 char_sheet.py --redo 로 그 포즈만 다시 만든다.
          python3 src/linecheck.py > line.log 2>&1 || true
          cat line.log

      # ⭐ 만들어 둔 음성을 다시 쓴다 — 이 워크플로에서 돈이 드는 곳은 여기뿐이다.
      #
      #    실행할 때마다 작업 공간이 새것이라, 예전에는 렌더링에서 실패하고 다시 눌러도
      #    음성 113개를 처음부터 다시 만들었다. 재시도 한 번에 한 편 값이 통째로 또 나갔다.
      #    대본이 그대로면 음성도 그대로다 — 대본 내용으로 열쇠를 만들어 보관했다 재사용한다.
      #    대본을 고치면 열쇠가 달라져 자동으로 새로 만든다.
      - name: 대본 지문 (음성 재사용 열쇠)
        id: fp
        run: |
          set -euo pipefail
          H=$(sha256sum "data/scripts/${{ steps.pick.outputs.ep }}.json" | cut -c1-16)
          echo "hash=$H" >> "$GITHUB_OUTPUT"
          echo "대본 지문: $H"

      - name: 만들어 둔 음성 불러오기
        id: voicecache
        if: inputs.voice != '무음으로 시험'
        uses: actions/cache/restore@v4
        with:
          path: build/voice
          key: voice-${{ steps.pick.outputs.ep }}-${{ steps.fp.outputs.hash }}-n${{ inputs.limit }}
          # 대본이 조금 바뀌었으면 예전 것이라도 가져와 바뀐 컷만 새로 만든다.
          restore-keys: |
            voice-${{ steps.pick.outputs.ep }}-

      - name: 나레이션 만들기
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # ⭐ 한도는 **모델 하나당 분당 10회** 다(429 본문으로 실측 확인:
          #    GenerateRequestsPerMinutePerProjectPerModel = 10).
          #    무료 등급 문제도, 하루 한도 문제도 아니다.
          #    예전에는 TTS_RPM=10 으로 한도에 딱 붙여 한 모델만 두들겼다. 여유가 0 이라
          #    조금만 흔들려도 넘고, 넘으면 재시도가 다음 분의 몫을 또 먹어 영영 안 풀렸다
          #    — 16컷 성공 뒤 30분 내내 429, 114컷 중 22컷에서 중단됐다.
          #    이제 tts.py 가 flash 모델을 번갈아 쓰므로 모델당 8 이면 넉넉하다.
          TTS_PER_MODEL_RPM: '8'
        run: |
          set -o pipefail
          ARGS=()
          if [ "${{ inputs.voice }}" = "무음으로 시험" ]; then ARGS+=(--silent); fi
          # ⚠️ 앞 N컷만 렌더링할 때는 음성도 N컷만 만든다.
          #    예전에는 --limit 을 렌더링에만 줬다. 10컷만 보려는데 음성은 113컷을
          #    다 만들려 했고, 그래서 속도 제한(429)에 걸렸다. 돈도 11배로 나간다.
          if [ "${{ inputs.limit }}" != "0" ]; then ARGS+=(--limit "${{ inputs.limit }}"); fi
          python3 src/tts.py "data/scripts/${{ steps.pick.outputs.ep }}.json" \
            --out build/voice "${ARGS[@]}" 2>&1 | tee tts.log

          # 쇼츠는 세로 화면에 맞춰 **대사를 짧게 다시 쓴다.** 본편 음성을 그대로 붙이면
          # 자막과 소리가 어긋나고, 길이도 규격(35~50초)을 훌쩍 넘는다.
          # 시험 렌더링(--limit)일 때는 쇼츠를 안 만들므로 음성도 만들지 않는다.
          if [ "${{ inputs.limit }}" = "0" ] && [ "${{ inputs.voice }}" != "무음으로 시험" ]; then
            python3 src/tts.py "data/scripts/${{ steps.pick.outputs.ep }}.json" \
              --out build/voice --shorts 2>&1 | tee -a tts.log
          fi

      # 음성을 만들자마자 곧바로 보관한다. 잡이 끝날 때 저장하면, 뒤의 렌더링에서
      # 실패했을 때 방금 돈 주고 만든 음성이 통째로 날아간다 — 막으려던 바로 그 상황이다.
      - name: 만든 음성 보관 (다음 실행에서 재사용)
        if: always() && inputs.voice != '무음으로 시험'
             && steps.voicecache.outputs.cache-hit != 'true'
             && hashFiles('build/voice/**') != ''
        uses: actions/cache/save@v4
        with:
          path: build/voice
          key: voice-${{ steps.pick.outputs.ep }}-${{ steps.fp.outputs.hash }}-n${{ inputs.limit }}

      - name: 렌더링 (롱폼 16:9 + 쇼츠 9:16)
        run: |
          set -o pipefail
          ARGS=()
          if [ "${{ inputs.limit }}" != "0" ]; then ARGS+=(--limit "${{ inputs.limit }}"); fi
          python3 src/render.py "data/scripts/${{ steps.pick.outputs.ep }}.json" \
            --out build --shorts --narration build/voice "${ARGS[@]}" 2>&1 | tee render.log
          ls -la build/*.mp4

      # ⭐ 관리자 페이지에서 바로 보려면 영상이 어딘가에 남아 있어야 한다.
      #    실행이 끝나면 작업 공간은 통째로 사라지기 때문이다.
      #
      #    저장소에 **커밋**하는 것은 절대 안 된다 — 지워도 이력에 영구히 남아
      #    저장소가 되돌릴 수 없이 커진다(지침서 11번).
      #    릴리스 자산은 git 이력 **밖**에 있다. 커밋이 아니고, 지우면 그냥 사라진다.
      #    그래서 규칙을 어기지 않으면서 관리자 페이지가 스트리밍할 수 있다.
      #
      #    유튜브에 올리기 **전에** 한다. 업로드가 실패해도 영상은 남아야 한다.
      - name: 관리자 페이지에서 볼 수 있게 보관 (릴리스 자산)
        if: hashFiles('build/*.mp4') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          EP="${{ steps.pick.outputs.ep }}"
          TAG="video-$EP"

          # 같은 회차를 다시 만들면 예전 것을 갈아끼운다
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            --title "$EP 영상" \
            --notes "관리자 페이지에서 보기 위한 파일입니다. 저장소 커밋이 아닙니다." \
            --prerelease \
            build/*.mp4
          echo "보관함: $TAG"

          # 최근 3편만 남긴다. 편당 100MB 안팎이라 그냥 두면 계속 쌓인다.
          #
          # ⚠️ 여기는 **절대 실패하면 안 되는 자리**다. 바로 위에서 영상 보관은 이미
          #    끝났는데, 청소하다 죽으면 워크플로 전체가 빨간 X 가 된다.
          #    특히 `set -o pipefail` 에서 grep 은 찾은 게 없으면 1 을 돌려주므로
          #    (영상 릴리스가 아직 하나도 없는 첫 실행) 그것만으로 실패한다.
          #    한 시간짜리 제작이 청소 때문에 실패로 찍히는 일은 없어야 한다.
          KEEP=3
          OLD=$(gh release list --limit 100 --json tagName --jq '.[].tagName' 2>/dev/null \
                | grep '^video-' | sort -r | tail -n "+$((KEEP+1))" || true)
          for t in $OLD; do
            echo "오래된 영상 지움: $t"
            gh release delete "$t" --yes --cleanup-tag || true
          done

      - name: 유튜브 업로드 (비공개)
        if: inputs.upload != '올리지 않음'
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          set -o pipefail
          python3 src/upload.py private "${{ steps.pick.outputs.ep }}" \
            --video build/longform.mp4 --narration build/voice 2>&1 | tee upload.log
          if [ "${{ inputs.upload }}" = "롱폼 + 쇼츠" ]; then
            python3 src/upload.py shorts "${{ steps.pick.outputs.ep }}" --dir build 2>&1 | tee -a upload.log
          fi

      - name: 결과 화면
        if: always()
        run: |
          {
            echo "## ${{ steps.pick.outputs.ep }} 영상 제작"
            echo ""
            for f in asset.log line.log tts.log render.log upload.log; do
              [ -f "$f" ] || continue
              echo "### ${f%.log}"
              echo '```'
              tail -n 20 "$f"
              echo '```'
              echo ""
            done
            if ls build/*.mp4 >/dev/null 2>&1; then
              echo "### 만들어진 파일"
              echo ""
              echo "| 파일 | 크기 | 길이 |"
              echo "|---|---|---|"
              for v in build/*.mp4; do
                SZ=$(du -h "$v" | cut -f1)
                DU=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$v" 2>/dev/null | cut -d. -f1)
                echo "| $(basename "$v") | $SZ | ${DU}초 |"
              done
              echo ""
              echo "> 영상 파일은 저장소에 커밋하지 않습니다."
              echo "> **관리자 페이지에서 바로 보실 수 있습니다** — 회차 옆 \`영상 보기\` 버튼."
              if [ "${{ inputs.upload }}" != "올리지 않음" ]; then
                echo "> 유튜브에도 비공개로 올라갔습니다."
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 상태 커밋 (영상은 제외)
        if: always()
        run: |
          git config user.name  "verdict-theater-bot"
          git config user.email "actions@github.com"
          # data/scripts 와 state 만. build/ 는 .gitignore 가 막고 있다.
          git add state data/scripts 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "바뀐 것이 없다."
            exit 0
          fi
          git commit -m "제작: ${{ steps.pick.outputs.ep }} 상태 갱신 [skip ci]"
          for i in 1 2 3 4; do
            git push origin HEAD:main && break
            sleep $((2**i)); git pull --rebase origin main || true
          done

      - name: 영상이 저장소에 들어갔는지 확인
        if: always()
        run: |
          # 지침서 11번 — MP4 가 커밋되면 되돌릴 수 없다. 마지막에 반드시 확인한다.
          if git ls-files | grep -iE '\.(mp4|mov|mkv|webm)$'; then
            echo "::error::영상 파일이 저장소에 들어갔습니다. 즉시 제거해야 합니다."
            exit 1
          fi
          echo "영상 파일 없음 — 정상"

      - name: 텔레그램 알림 (성공·실패 둘 다)
        # ⚠️ 반드시 **맨 마지막** 이어야 한다. job.status 가 여기까지의 결과를 담는다.
        #    always() 라서 앞이 실패해도 이 단계는 돈다 — 그래야 실패를 알릴 수 있다.
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTIFY_WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK }}
        run: |
          # 알림 때문에 실행이 실패하는 일은 없어야 한다 — notify.py 는 늘 0 으로 끝난다.
          STATUS=ok
          [ "${{ job.status }}" = "success" ] || STATUS=fail
          python3 src/notify.py --kind produce --status "$STATUS" \
            --ep "${{ steps.pick.outputs.ep }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
