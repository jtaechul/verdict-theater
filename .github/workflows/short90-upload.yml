name: 4-2. 쇼츠 유튜브에 올리기 (편마다)

# ⭐⭐ 2026-08-31 손님: "유튜브 업로드를 위한 제목 설명란, 그리고 해시태그
#    유튜브 업로드 버튼까지 생성해줘."
#
#   16화용(youtube-upload.yml)은 'video-EP001' 같은 이름과 회차를 쓴다.
#   90초 한 편은 이름도 모양도 달라서(short90-S90) 그 길로는 못 간다.
#
# ⚠️ 화면에서 본 글과 올라가는 글이 **반드시 같아야 한다.**
#    관리자 페이지에서 고친 글이 있으면 그것을 쓰고(meta 입력),
#    없으면 대본에서 만든다(src/short90.py meta · 0원).
#
# ⚠️ 되돌릴 수 없는 일이다. 기본값은 **비공개**다 — 공개는 손님이 골라야 한다.
# ⚠️ 단추로만 돈다 (tools/auto_spend_check.py 규칙).

on:
  workflow_dispatch:
    inputs:
      part:
        description: '몇 편을 올릴까요 (예: 1 · 세 편을 예약으로 한 번에 올리려면 all)'
        required: true
        default: '1'
      privacy:
        description: '어떻게 올릴까요'
        required: true
        default: '비공개 (나만 보기)'
        type: choice
        options:
          - '비공개 (나만 보기)'
          - '일부공개 (링크 아는 사람만)'
          - '공개 (모두에게)'
      mode:
        description: '연습이면 올리지 않고 되는지만 봅니다'
        required: true
        default: '진짜로 올리기'
        type: choice
        options:
          - '진짜로 올리기'
          - '연습 (올리지 않고 확인만)'
      every_hours:
        description: 'all 일 때 몇 시간 간격으로 예약 공개할까요 (24 = 하루)'
        required: false
        default: '24'
      sid:
        description: '어느 사건 (비우면 S90)'
        required: false
        default: ''
      meta:
        description: '관리자 페이지가 넣는다 · 손대지 마십시오'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: short90-upload
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # ⚠️⚠️ 2026-08-31 — **이 줄이 없어서 첫 실행이 401 로 죽었다.**
      #    관리자 페이지에서 고치신 글은 보관함에 있고, 보관함은 x-vt-pass 로
      #    암호를 받는다. 이틀 전 short90.yml 에서 똑같은 실수를 하고 고쳤는데,
      #    새 워크플로를 만들면서 **또 빠뜨렸다.** 검사가 fetch_cards/clips 만
      #    보고 있어서 못 잡았다 — 그 검사도 같이 넓힌다.
      ADMIN_PASS: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ⚠️ 열쇠는 셋 다 있어야 한다. 하나라도 없으면 한참 뒤에 알 수 없는
      #    오류로 죽어 원인을 못 찾는다 — 여기서 먼저 잡는다.
      - name: 유튜브 열쇠 확인
        env:
          CID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          CSEC: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          RTOK: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          set -uo pipefail
          MISS=""
          [ -n "${CID:-}"  ] || MISS="$MISS YOUTUBE_CLIENT_ID"
          [ -n "${CSEC:-}" ] || MISS="$MISS YOUTUBE_CLIENT_SECRET"
          [ -n "${RTOK:-}" ] || MISS="$MISS YOUTUBE_REFRESH_TOKEN"
          if [ -n "$MISS" ]; then
            {
              echo "## 유튜브 열쇠가 모자랍니다"
              echo ""
              for m in $MISS; do echo "- \`$m\`"; done
              echo ""
              echo "관리자 페이지의 [유튜브 연결] 을 돌리면 세 가지가 한 번에 나옵니다."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::유튜브 열쇠가 모자랍니다:$MISS"
            exit 1
          fi
          echo "유튜브 열쇠 3가지 모두 있습니다."

      - name: 보관해 둔 영상 꺼내기
        env:
          PART: ${{ inputs.part }}
          SID: ${{ inputs.sid }}
        run: |
          set -euo pipefail
          mkdir -p build/s90
          # ⭐ 2026-09-01 — 편마다 파일이 따로다. 올릴 편만 꺼낸다.
          if [ "$PART" = "all" ]; then WANT="1 2 3 4 5"; else WANT="$PART"; fi
          S="${SID:-S90}"
          N=0
          for K in $WANT; do
            python3 tools/release_file.py get "short90-$S" "part$K.mp4" \
              "build/s90/part$K.mp4" 2>/dev/null || continue
            [ -s "build/s90/part$K.mp4" ] || continue
            echo "  꺼냄: $K편"
            N=$((N+1))
          done
          ls -la build/s90/
          [ "$N" -gt 0 ] || {
            echo "::error::만든 영상이 없습니다. 먼저 [쇼츠 만들기] 를 누르십시오."
            exit 1
          }

      - name: 올릴 글 준비 (0원)
        env:
          META: ${{ inputs.meta }}
          VT_SID: ${{ inputs.sid }}
        run: |
          set -euo pipefail
          # ⚠️ 여기에 파이썬을 박았다가 YAML 이 깨졌다. 이 저장소에 이미 적혀
          #    있던 교훈이다(tools/voice_route.py 머리말) — **파일로 둔다.**
          #    손님이 관리자 페이지에서 고친 글이 있으면 그것이 이긴다.
          python3 tools/fetch_meta90.py "$META" build/s90/meta.json

      - name: 유튜브에 올리기
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          PART: ${{ inputs.part }}
          EVERY: ${{ inputs.every_hours }}
          SID: ${{ inputs.sid }}
        run: |
          set -o pipefail
          case "${{ inputs.privacy }}" in
            '공개 (모두에게)')          P=public ;;
            '일부공개 (링크 아는 사람만)') P=unlisted ;;
            *)                          P=private ;;
          esac
          DRY=""
          [ "${{ inputs.mode }}" = "연습 (올리지 않고 확인만)" ] && DRY="--dry"
          S="${SID:-S90}"
          # ⭐⭐ 2026-09-01 — 한 사건을 여러 편으로 나눠 올린다.
          #   · 한 편만: 그 편을 지금 올린다
          #   · all    : 첫 편은 지금, 나머지는 **예약 공개**로 하루씩 띄운다.
          #     손님이 사흘 동안 다시 안 들어오셔도 알아서 하루 간격으로 뜬다.
          #     (저장소 규칙에 이미 있다 — "쇼츠는 같은 날 한꺼번에 공개하지 않는다")
          # ⭐⭐⭐ 2026-09-06 손님: "한꺼번에 올리니까 1편은 매번 조회수가 0이잖아."
          #    실제 숫자를 뽑아 보니 원인은 "한꺼번에" 가 아니라 **1편만 예약
          #    없이 즉시 공개**되던 것이었다. 바로 여기가 그랬다 —
          #        if [ "$I" -eq 0 ]; then AT=""; else …
          #    1편은 업로드가 끝나는 그 순간 공개된다. 유튜브가 아직 고화질
          #    변환을 못 끝낸 때다. 그 상태로 공개되면 초기 노출에서 저화질로
          #    서빙되고 쇼츠 피드 진입이 나빠진다.
          #      실측 — 즉시 공개 2건 349회·0회 / 예약 공개 8건 1,212~2,946회
          #             (같은 사건인데 1편 349 vs 2편 2,946 — 여덟 배)
          #    → **1편도 예약 공개**로. 그리고 시각은 **한국 아침 8시**로 고정
          #      (실측: 아침 8시 4건 평균 1,849 · 오후 1시 3건 1,269 · 저녁 349)
          # ⚠️ '공개' 를 고르셨을 때만 예약을 건다. 비공개·일부공개를 고르셨는데
          #    저절로 공개되면 안 된다.
          RC=0
          SLOT() { [ "$P" = "public" ] && echo "--publish-at $(python3 tools/next_slot.py $1)"; }
          if [ "$PART" = "all" ]; then
            I=0
            for F in build/s90/part*.mp4; do
              [ -f "$F" ] || continue
              K=$(basename "$F" | sed 's/part\([0-9]*\)\.mp4/\1/')
              D=$(( I * ${EVERY:-24} / 24 ))
              python3 src/upload.py series "$S" --part "$K" \
                --video "$F" --meta build/s90/meta.json \
                --privacy "$P" $(SLOT $D) $DRY 2>&1 | tee -a up.log || RC=1
              I=$((I+1))
            done
          else
            # ⚠️ 한 편만 올릴 때도 예약을 건다. 여기가 비어 있어서 [1편만
            #    올리기] 도 즉시 공개됐다 — 같은 고장이 두 자리에 있었다.
            python3 src/upload.py series "$S" --part "$PART" \
              --video "build/s90/part$PART.mp4" \
              --meta build/s90/meta.json \
              --privacy "$P" $(SLOT 0) $DRY 2>&1 | tee up.log || RC=1
          fi
          exit $RC

      # ⚠️ 올린 사실을 저장소에 적어 둔다. 안 적으면 관리자 페이지가 계속
      #    '안 올림' 으로 보이고, 또 눌러서 같은 영상이 두 번 올라간다.
      - name: 올린 사실 적어 두기
        if: always()
        continue-on-error: true
        run: |
          git config user.name "verdict-theater-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state 2>/dev/null || true
          git diff --cached --quiet && { echo "적을 것이 없다."; exit 0; }
          git commit -m "90초 한 편 업로드 [skip ci]"
          bash tools/push.sh "90초 한 편 업로드 [skip ci]" state

      - name: 결과 화면
        if: always()
        run: |
          {
            echo "## 90초 한 편 — 유튜브 올리기"
            echo ""
            echo '```'
            cat up.log 2>/dev/null || echo "(못 올렸습니다)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
