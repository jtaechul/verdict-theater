name: 4-2. 90초 한 편 유튜브에 올리기

# ⭐⭐ 2026-08-31 손님: "유튜브 업로드를 위한 제목 설명란, 그리고 해시태그
#    유튜브 업로드 버튼까지 생성해줘."
#
#   16화용(youtube-upload.yml)은 'video-EP001' 같은 이름과 회차를 쓴다.
#   90초 한 편은 이름도 모양도 달라서(short90-S90) 그 길로는 못 간다.
#
# ⚠️ 화면에서 본 글과 올라가는 글이 **반드시 같아야 한다.**
#    관리자 페이지에서 고친 글이 있으면 그것을 쓰고(meta 입력),
#    없으면 대본에서 만든다(src/short90.py meta · 0원).
#
# ⚠️ 되돌릴 수 없는 일이다. 기본값은 **비공개**다 — 공개는 손님이 골라야 한다.
# ⚠️ 단추로만 돈다 (tools/auto_spend_check.py 규칙).

on:
  workflow_dispatch:
    inputs:
      privacy:
        description: '어떻게 올릴까요'
        required: true
        default: '비공개 (나만 보기)'
        type: choice
        options:
          - '비공개 (나만 보기)'
          - '일부공개 (링크 아는 사람만)'
          - '공개 (모두에게)'
      mode:
        description: '연습이면 올리지 않고 되는지만 봅니다'
        required: true
        default: '진짜로 올리기'
        type: choice
        options:
          - '진짜로 올리기'
          - '연습 (올리지 않고 확인만)'
      meta:
        description: '관리자 페이지가 넣는다 · 손대지 마십시오'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: short90-upload
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ⚠️ 열쇠는 셋 다 있어야 한다. 하나라도 없으면 한참 뒤에 알 수 없는
      #    오류로 죽어 원인을 못 찾는다 — 여기서 먼저 잡는다.
      - name: 유튜브 열쇠 확인
        env:
          CID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          CSEC: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          RTOK: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          set -uo pipefail
          MISS=""
          [ -n "${CID:-}"  ] || MISS="$MISS YOUTUBE_CLIENT_ID"
          [ -n "${CSEC:-}" ] || MISS="$MISS YOUTUBE_CLIENT_SECRET"
          [ -n "${RTOK:-}" ] || MISS="$MISS YOUTUBE_REFRESH_TOKEN"
          if [ -n "$MISS" ]; then
            {
              echo "## 유튜브 열쇠가 모자랍니다"
              echo ""
              for m in $MISS; do echo "- \`$m\`"; done
              echo ""
              echo "관리자 페이지의 [유튜브 연결] 을 돌리면 세 가지가 한 번에 나옵니다."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::유튜브 열쇠가 모자랍니다:$MISS"
            exit 1
          fi
          echo "유튜브 열쇠 3가지 모두 있습니다."

      - name: 보관해 둔 영상 꺼내기
        run: |
          set -euo pipefail
          mkdir -p build/s90
          python3 tools/release_file.py get short90-S90 short.mp4 build/s90/short.mp4
          ls -la build/s90/
          [ -s build/s90/short.mp4 ] || {
            echo "::error::만든 영상이 없습니다. 먼저 [90초 한 편 만들기] 를 누르십시오."
            exit 1
          }

      - name: 올릴 글 준비 (0원)
        env:
          META: ${{ inputs.meta }}
        run: |
          set -euo pipefail
          # ⚠️ 여기에 파이썬을 박았다가 YAML 이 깨졌다. 이 저장소에 이미 적혀
          #    있던 교훈이다(tools/voice_route.py 머리말) — **파일로 둔다.**
          #    손님이 관리자 페이지에서 고친 글이 있으면 그것이 이긴다.
          python3 tools/fetch_meta90.py "$META" build/s90/meta.json

      - name: 유튜브에 올리기
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          set -o pipefail
          case "${{ inputs.privacy }}" in
            '공개 (모두에게)')          P=public ;;
            '일부공개 (링크 아는 사람만)') P=unlisted ;;
            *)                          P=private ;;
          esac
          DRY=""
          [ "${{ inputs.mode }}" = "연습 (올리지 않고 확인만)" ] && DRY="--dry"
          python3 src/upload.py series S90 0 \
            --video build/s90/short.mp4 \
            --meta build/s90/meta.json \
            --privacy "$P" $DRY 2>&1 | tee up.log

      # ⚠️ 올린 사실을 저장소에 적어 둔다. 안 적으면 관리자 페이지가 계속
      #    '안 올림' 으로 보이고, 또 눌러서 같은 영상이 두 번 올라간다.
      - name: 올린 사실 적어 두기
        if: always()
        continue-on-error: true
        run: |
          git config user.name "verdict-theater-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state 2>/dev/null || true
          git diff --cached --quiet && { echo "적을 것이 없다."; exit 0; }
          git commit -m "90초 한 편 업로드 [skip ci]"
          bash tools/push.sh "90초 한 편 업로드 [skip ci]" state

      - name: 결과 화면
        if: always()
        run: |
          {
            echo "## 90초 한 편 — 유튜브 올리기"
            echo ""
            echo '```'
            cat up.log 2>/dev/null || echo "(못 올렸습니다)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
