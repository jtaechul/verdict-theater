name: 0. 자체 점검 (값 0원 — 진짜로 0원이다)

# 코드를 올릴 때마다 **자동으로** 돈다. 버튼을 누를 필요가 없다.
# 모델을 부르지 않으므로 **비용 0원**, 1분이면 끝난다.
#
# ⭐ 2026-08-18 대개편 — 영상 제작을 구글(옴니 플래시)에 맡기면서
#    그림 합성·음성 제작·인물 오려내기가 통째로 없어졌다. 그것들을 지키던
#    검사 27개도 함께 tools/off/ 로 치웠다. 여기 남은 것은 **지금도 도는 것**
#    (소재 모으기 · 대본 · 유튜브 올리기 · 관리자 페이지)을 지키는 검사뿐이다.

# ⚠️⚠️ 2026-08-22 — 여기에 **돈 드는 검사 두 개**가 들어 있었다.
#    (목소리 열쇠 확인 · 어느 길로 가는가) 자체 점검은 밀어 넣을 때마다 도는데,
#    하루에 열네 번을 밀었더니 그때마다 유료 호출이 두 번씩 나갔다.
#    운영자: "왜 이렇게 돈을 많이 쓰는 거야? 계속 빠져나가."
#    → 돈 드는 검사는 **여기서 뺀다.** 5. 목소리 상태 확인 으로 옮겼다
#      (주 1회 + 필요할 때 버튼). 자체 점검은 이름 그대로 0원이어야 한다.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tools/**'
      - 'admin/**'
      - '.github/workflows/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: selfcheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 파이썬 문법
        run: python3 -m py_compile src/*.py tools/*.py

      # ⭐ 2026-08-11 의 두 번 실패를 다 잡는 검사.
      #    모델을 부르는 자리와 받는 자리를 코드에서 맞춰 본다.
      - name: 모델 부르는 자리가 규격에 맞는가
        run: python3 tools/callsite_check.py

      - name: 모델 부르는 길이 끝까지 뚫려 있는가 (인터넷만 막고 진짜로 걸어 본다)
        run: python3 tools/call_path_test.py

      - name: 도중에 멈춰도 만든 대본이 남는가
        run: python3 tools/script_salvage_test.py

      - name: 멈춘 대본을 이어서 마저 만들 수 있는가
        run: python3 tools/script_resume_test.py

      - name: 돈 막는 장치가 진짜로 막는가
        run: python3 tools/money_guard_test.py

      # ⭐ 2026-08-18: 시리즈 대본이 규격(6초×5컷×16화 · 후킹 먼저 · 영상에 글자 금지)을
      #    지키는지 재는 검사기가, 그 자체로 맞는지 가짜 대본으로 시험한다.
      - name: 시리즈 대본 검사기가 진짜로 잡는가
        run: python3 tools/series_test.py

      # ⭐ 2026-08-20: 돈 주고 받은 대본이 두 번 사라졌다. 두 번째 원인은 저장
      #    단계의 `git add A B` 였다 — B 가 없으면 A 까지 안 올라간다.
      - name: 반려된 대본을 진짜로 살려 두는가
        run: python3 tools/save_step_test.py

      # ⭐ 2026-08-20 — 첫 영상에서 여자 손가락이 남자 옷 속으로 녹아들었다.
      #    닿는 동작을 우리가 바꾸게 했는데, 처음 만든 것이 **물건까지** 바꿔
      #    문장을 망가뜨렸다 (slams his hand on the table → 뜻 모를 문장).
      #    그리고 운영자: "제목이랑 후킹 좀 더 자극적으로 뽑아."
      - name: 닿는 동작·얼굴 못·후킹이 제대로 도는가
        run: python3 tools/touch_hook_test.py

      # ⭐ 2026-08-20 손님: "관리자페이지에서 못봐??"
      #    진짜 대본을 넣고 화면 코드를 그대로 돌려, 클립 프롬프트가
      #    한 줄도 안 빠지고 나오는지 본다 (그걸 그대로 플로우에 붙여 넣는다).
      - name: 시리즈 대본이 관리자 페이지에 실제로 그려지는가
        run: python3 tools/series_screen_test.py

      # ⭐ 2026-08-20 — 길이 상한에 걸린 것을 같은 상한으로 3번 더 불러
      #    15분 동안 3회분 값만 나갔다. 소용없는 재시도를 막는다.
      - name: 길이 상한에서 돈을 되풀이해 쓰지 않는가
        run: python3 tools/truncate_test.py

      # ⭐ 2026-08-20 운영자: "제미나이 워터마크는 자동으로 없애게끔 해줘.
      #    이걸 코드에 반드시 반영해." / "가로 4, 세로 3으로 크롭해서 쇼츠에"
      #    가짜 워터마크를 실제로 얹은 영상을 만들어, 지워졌는지 픽셀로 잰다.
      - name: 워터마크가 지워지고 4:3 으로 잘리는가
        run: |
          sudo apt-get install -y ffmpeg >/dev/null 2>&1 || true
          python3 tools/clip_test.py

      # ⭐ 2026-08-20 운영자: "상단 검은 빈 프레임에는 후킹 문구, 아래쪽
      #    검은 빈 프레임에는 자막" — 글자가 제자리에만 있는지 픽셀로 잰다.
      - name: 릴리스에 파일 올리고 내리는 도구가 성한가
        run: python3 -m py_compile tools/release_file.py src/shorts.py src/clip.py

      # ⭐ 2026-08-20 운영자: "제목·설명·해시태그 아무것도 안 들어가 있어."
      #    같은 계산이 파이썬과 관리자 페이지 두 곳에 있다 — 결과가 같은지 맞춘다.
      - name: 유튜브에 올릴 글이 두 곳에서 같은가
        run: python3 tools/ytmeta_test.py

      - name: 쇼츠 배치(후킹·영상·자막)가 제자리인가
        run: |
          python3 -m pip install --quiet pillow 2>/dev/null || true
          python3 tools/shorts_test.py

      # ⭐ 2026-08-21 — 영상 만드는 쪽의 한국어 발음을 프롬프트로 못 고쳐,
      #    목소리를 한국어 전용으로 **갈아 끼우기로** 했다. 그 일이
      #    원래 소리를 완전히 지우고 말하던 자리에 정확히 놓는지 잰다.
      #    (열쇠 없이도 도는 시험이다 — 가짜 목소리를 쓴다)
      - name: 목소리 갈아 끼우기가 제대로 되는가
        run: python3 tools/dub_test.py

      # ⭐ 2026-08-21 — 목소리를 제미나이로 갈아탔다. 갈아타면서 조용히 깨질 수
      #    있는 자리(열쇠 보는 곳·목소리 이름·연기 지시)를 인터넷 없이 먼저 밟고,
      #    그다음 진짜 열쇠로 한 마디를 만들어 본다.
      #    ⚠️ 한도(1분에 10번)에 걸린 것은 **고장이 아니다** — 그때는 건너뛴다.
      - name: 목소리 고르는 잣대가 제대로 재는가 (인터넷 없이)
        run: python3 tools/voice_judge_test.py

      - name: 목소리 엔진이 제미나이로 갈렸는가 (인터넷 없이)
        run: python3 tools/voice_engine_test.py

      - name: 관리자 페이지가 안 깨지는가
        run: |
          node tools/check_admin.mjs
          # ⚠️ 문법은 멀쩡한데 **없는 것을 워크플로에 넘기는** 실수를 잡는다
          node tools/check_scope.mjs
          node tools/check_fold.mjs

      - name: 워크플로 문법 + 관리자 버튼이 실제로 눌리는가
        run: |
          python3 -m pip install --quiet PyYAML
          # ⚠️ 2026-08-12 — 관리자 페이지가 보내는 글자와 워크플로의 목록이
          #    한 글자라도 다르면 깃허브가 거절한다. 눈으로는 못 잡는다.
          python3 tools/admin_choice_check.py
          # ⚠️ 2026-08-15 — 따옴표 하나가 남아 실행 칸 전체가 죽은 적이 있다.
          python3 tools/bash_check.py
          python3 - <<'PY'
          import pathlib, sys, yaml
          bad = 0
          for f in sorted(pathlib.Path(".github/workflows").glob("*.yml")):
              try:
                  yaml.safe_load(f.read_text(encoding="utf-8"))
                  print(f"  OK {f.name}")
              except Exception as e:
                  print(f"  X  {f.name}: {e}")
                  bad += 1
          sys.exit(1 if bad else 0)
          PY

      - name: 결과 적기
        if: always()
        run: |
          {
            if [ "${{ job.status }}" = "success" ]; then
              echo "## 자체 점검 통과 (값 0원)"
            else
              echo "## 자체 점검 실패 — 버튼을 누르지 마십시오"
              echo ""
              echo "위의 빨간 칸을 열어 어느 검사가 걸렸는지 보십시오."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
