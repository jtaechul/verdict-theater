name: 6. 관리자 페이지 배포

# 관리자 페이지를 Cloudflare Workers 에 올린다.
#
# 왜 Cloudflare 인가
#   이 저장소는 비공개다. 무료 요금제에서 비공개 저장소는 GitHub Pages 를 쓸 수 없다.
#   Cloudflare Workers 는 공개/비공개와 무관하고 무료다.
#   손님이 이미 book-carousel 에서 쓰고 있는 방식이기도 하다.
#
# 처음 한 번만 등록하면 되는 값 (Settings → Secrets and variables → Actions)
#   CLOUDFLARE_API_TOKEN   Cloudflare 대시보드 → My Profile → API Tokens
#                          → Edit Cloudflare Workers 템플릿
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare 대시보드 오른쪽에 있는 계정 ID
#   ADMIN_PASSWORD         관리자 페이지에 들어갈 비밀번호 (직접 정한다)
#   ADMIN_GH_TOKEN         GitHub 개인 토큰. 이 저장소만 접근하도록 좁게 만든다
#                          → Permissions: Contents = Read, Actions = Read and write
#                          ⭐ 2026-08-22 — 쓰기 권한은 **필요 없다.**
#                             영상 압축파일은 클라우드플레어 보관함(KV)에 두고
#                             워크플로가 자기 열쇠로 받아 간다.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'admin/**'
      - '.github/workflows/deploy-admin.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: 열쇠 확인
        env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACC: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PW: ${{ secrets.ADMIN_PASSWORD }}
          TK: ${{ secrets.ADMIN_GH_TOKEN }}
        run: |
          MISS=""
          [ -z "$CF" ]  && MISS="$MISS CLOUDFLARE_API_TOKEN"
          [ -z "$ACC" ] && MISS="$MISS CLOUDFLARE_ACCOUNT_ID"
          [ -z "$PW" ]  && MISS="$MISS ADMIN_PASSWORD"
          [ -z "$TK" ]  && MISS="$MISS ADMIN_GH_TOKEN"
          if [ -n "$MISS" ]; then
            {
              echo "## 열쇠가 부족합니다"
              echo ""
              echo "없는 것:$MISS"
              echo ""
              echo "저장소 → **Settings** → **Secrets and variables** → **Actions**"
              echo "→ **New repository secret** 에서 아래를 등록하십시오."
              echo ""
              echo "| 이름 | 어디서 받나 |"
              echo "|---|---|"
              echo "| \`CLOUDFLARE_API_TOKEN\` | Cloudflare → My Profile → API Tokens → **Edit Cloudflare Workers** 템플릿 |"
              echo "| \`CLOUDFLARE_ACCOUNT_ID\` | Cloudflare 대시보드 오른쪽 **Account ID** |"
              echo "| \`ADMIN_PASSWORD\` | 직접 정하십시오. 이 페이지에 들어갈 비밀번호 |"
              echo "| \`ADMIN_GH_TOKEN\` | [토큰 만들기](https://github.com/settings/personal-access-tokens/new) — Repository access는 **verdict-theater 하나만**, Permissions는 **Contents = Read**, **Actions = Read and write** |"
              echo ""
              echo "> \`ADMIN_GH_TOKEN\` 은 이 저장소 하나에만 닿도록 좁게 만드십시오."
              echo "> 새어 나가도 피해가 이 저장소로 한정됩니다."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::열쇠가 부족합니다:$MISS"
            exit 1
          fi
          echo "열쇠 4개 확인됨"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 문법 검사 (바깥 코드 + 브라우저 코드)
        run: |
          set -o pipefail
          node --check admin/worker.js
          # ⭐ 바깥 파일만 보면 안 된다.
          #    화면에 뜨는 코드는 worker.js 안의 **템플릿 문자열 속**에 들어 있어서
          #    node --check 는 그것을 그냥 글자로 볼 뿐이다.
          #    2026-08-07 에 그 안쪽이 깨진 채 초록불로 배포됐고, 관리자 페이지가
          #    '불러오는 중…' 에서 영영 멈췄다. 이제 안쪽까지 뽑아 검사하고 돌려 본다.
          node tools/check_admin.mjs
          node tools/check_fold.mjs

      # ⭐⭐ 2026-08-22 — 큰 파일 보관함(KV)
      #    왜: 관리자 페이지의 깃허브 열쇠는 읽기 전용이라, 브라우저에서 올린
      #        압축파일을 깃허브에 얹지 못한다(403). 예전에 되던 길은 원래
      #        "만드는 것도 올리는 것도 깃허브 안에서 워크플로가 한다" 였다.
      #        그 모양으로 되돌리려면 파일을 잠깐 둘 곳이 필요하다.
      #    어떻게: 이미 등록해 둔 CLOUDFLARE_API_TOKEN (Edit Cloudflare Workers
      #        템플릿) 안에 KV 권한이 들어 있다. 여기서 저절로 만들어 붙인다 —
      #        손님이 어디에 들어가 만들 것은 없다.
      - name: 큰 파일 보관함 준비 (KV)
        working-directory: admin
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npm i -g wrangler@4 --silent
          # ⚠️ 뽑아내는 글이 판마다 다르다. 짐작하지 말고 자기시험부터 돌린다.
          python3 ../tools/kv_id.py --selftest
          ID=$(npx wrangler kv namespace list 2>/dev/null | python3 ../tools/kv_id.py || true)
          if [ -z "$ID" ]; then
            echo "보관함이 없다 — 만든다"
            # ⚠️ 만든 **직후 글에서 바로** 번호를 읽는다. 목록을 다시 부르면
            #    이름 규칙이 달라 못 찾는 일이 생긴다 (2026-08-22 실제로 그랬다:
            #    wrangler 4.86 은 이름을 "BLOB" 으로 짓는데 나는 앞에 워커 이름이
            #    붙는 줄 알았다 → 만들어 놓고도 못 찾아 보관함 없이 배포됐다).
            ID=$(npx wrangler kv namespace create BLOB 2>&1 | tee /dev/stderr \
                 | python3 ../tools/kv_id.py || true)
          fi
          if [ -z "$ID" ]; then
            ID=$(npx wrangler kv namespace list 2>/dev/null | python3 ../tools/kv_id.py || true)
          fi
          if [ -z "$ID" ]; then
            # ⚠️ 여기서 조용히 넘어가면 관리자 페이지가 **영상을 못 올리는 채로**
            #    배포된다(403). 그건 지금 고치는 바로 그 사고다. 크게 멈춘다.
            echo "::error::보관함을 만들지 못했습니다. 이대로 배포하면 영상을 못 올립니다."
            exit 1
          fi
          echo "보관함 준비됨"
          printf '\n[[kv_namespaces]]\nbinding = "BLOB"\nid = "%s"\n' "$ID" >> wrangler.toml
          tail -n 4 wrangler.toml

      - name: 배포 + 비밀값 등록
        working-directory: admin
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npm i -g wrangler@4 --silent

          # ⭐ 이 판이 몇 번째 것인지 코드에 찍어 넣는다.
          #    운영자가 "또 뜬다" 고 하실 때, 그 화면이 고치기 전 것인지
          #    후의 것인지 한눈에 알기 위해서다.
          sed -i "s/^const BUILD = 'dev';/const BUILD = '${GITHUB_SHA:0:7}';/" worker.js
          grep -m1 '^const BUILD' worker.js

          # 배포가 먼저다. 비밀값은 이미 있는 Worker 에만 넣을 수 있어서,
          # 순서를 반대로 하면 맨 처음 배포가 "그런 Worker 가 없다"로 실패한다.
          npx wrangler deploy 2>&1 | tee deploy.log

          # 비밀값은 배포본 안에 들어가지 않는다. Cloudflare 쪽에 따로 저장된다.
          printf '%s' "${{ secrets.ADMIN_GH_TOKEN }}" | npx wrangler secret put GH_TOKEN
          printf '%s' "${{ secrets.ADMIN_PASSWORD }}" | npx wrangler secret put ADMIN_PASSWORD
          # 로그인 위조 방지용 서명키. github.sha 를 섞지 않는다 —
          # 섞으면 관리자 페이지를 고칠 때마다 로그인이 풀려 매번 다시 들어가야 한다.
          printf '%s' "${{ secrets.SESSION_SECRET || secrets.ADMIN_PASSWORD }}" \
            | npx wrangler secret put SESSION_SECRET

          # ⚠️⚠️ 배포가 성공해도 보관함이 **안 붙은 채로** 지나갈 수 있다.
          #    (2026-08-22 실제로 그랬다 — 번호를 못 찾아 그냥 배포됐다)
          #    wrangler 는 붙은 것을 배포 기록에 적는다. 그것으로 확인한다.
          if grep -qi 'kv namespace' deploy.log; then
            echo "보관함이 워커에 붙었다"
          else
            echo "::error::보관함이 워커에 안 붙었습니다 — 영상을 못 올립니다"
            exit 1
          fi

      - name: 주소 안내
        if: always()
        run: |
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+workers\.dev' admin/deploy.log 2>/dev/null | tail -1)
          {
            echo "## 관리자 페이지 배포"
            echo ""
            if [ -n "$URL" ]; then
              echo "### [$URL]($URL)"
              echo ""
              echo "이 주소를 **아이폰 사파리에서 열고 홈 화면에 추가**해 두십시오."
              echo "앱처럼 한 번에 열립니다."
              echo ""
              echo "처음 열면 비밀번호를 묻습니다. \`ADMIN_PASSWORD\` 에 넣은 값입니다."
            else
              echo "주소를 찾지 못했습니다. 아래 기록을 확인하십시오."
            fi
            echo ""
            echo '```'
            tail -n 20 admin/deploy.log 2>/dev/null || echo "기록 없음"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
