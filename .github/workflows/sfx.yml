name: 효과음 받아오기 (Freesound)

# 효과음을 Freesound 에서 받아 저장소에 넣는다. 값 0원 (CC0 — 마음대로 쓸 수 있는 소리만).
#
# 왜 (2026-08-08 손님: "법정에서 걸음소리 좆같아")
#   그때 발소리는 분당 131걸음 — 뛰다시피 하는 속도라 법정 장면에 안 맞았다.
#
# 왜 또 (2026-08-09 손님: 6분30초의 "삑 삑" 을 빼 달라)
#   clock·phone·heartbeat·monitor 는 **녹음이 아니라 기계가 만든 순수 전자음**이었다.
#   monitor 는 없앴고, 나머지 셋은 여기서 진짜 녹음으로 바꾼다.
#   받아온 것이 또 삑 소리면 tools/get_sfx.py 가 스스로 걸러 낸다.
#
# 필요한 열쇠: FREESOUND_TOKEN (저장소 Secrets)

on:
  # 표식 파일이 **바뀌면** 자동으로 돈다 (고친 사람이 직접 시동을 건다)
  #   ⚠️ '바뀌면' 이다. 내용이 지난번과 한 글자도 다르지 않으면 git 이 '바뀐 것 없음'
  #      으로 보아 **작업이 아예 시작되지 않는다**(2026-08-09 실제로 겪었다).
  #      그래서 표식 파일은 이렇게 적는다 —
  #        첫 줄: 받을 소리 이름 (아래 '표식 파일에 적힌 이름 읽기' 가 읽는 곳)
  #        둘째 줄: 지금 시각 (내용이 매번 달라지게 하는 용도)
  push:
    paths:
      - '.trigger/sfx'
  workflow_dispatch:
    inputs:
      name:
        description: "효과음 이름. 여러 개면 띄어쓰기 ('clock phone heartbeat'), 전부면 'all'"
        required: true
        default: 'clock phone heartbeat'
      query:
        description: '무엇을 찾을까요 (영어로). 비워 두면 소리마다 정해진 말을 씁니다'
        required: false
        default: ''
      install:
        description: "설치할 후보 — 'best' 면 기계가 고른 1순위, 안 넣으면 듣기만"
        required: false
        default: 'best'

permissions:
  contents: write

concurrency:
  group: sfx
  cancel-in-progress: false

jobs:
  sfx:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # ⚠️ 표식 파일(push)로 도는 경우 inputs 가 비어 있다 — 그때 쓸 기본값이다.
    env:
      NAME:    ${{ inputs.name    || 'clock phone heartbeat' }}
      QUERY:   ${{ inputs.query   || '' }}
      INSTALL: ${{ inputs.install || 'best' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 도구 준비
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python3 -m pip install --quiet numpy

      # ⚠️ 열쇠 이름을 짐작하지 않는다. 2026-08-08 에 PIXABAY_API_KEY 등 네 가지를
      #    찍어 놓고 찾았다가 "못 찾았다" 로 실패했다 — 손님은 분명히 등록해 두셨는데
      #    내가 정한 이름과 달랐던 것이다. 이제 **등록된 열쇠 이름을 전부 훑어**
      #    'pixabay' 가 들어간 것을 찾아 쓴다.
      #    ⚠️ 값은 절대 찍지 않는다. 이름만 본다(깃허브가 값은 자동으로 가려 주지만,
      #       애초에 찍지 않는 것이 맞다).
      - name: 소리 받아올 열쇠 찾기 (이름이 무엇이든)
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
          ALL_VARS: ${{ toJSON(vars) }}
        run: |
          set -o pipefail
          # ⚠️ 열쇠는 **두 군데**에 등록할 수 있다 (같은 화면의 다른 칸):
          #      Settings → Secrets and variables → Actions
          #        · Secrets 탭 (가려지는 값)   → secrets 로 읽는다
          #        · Variables 탭 (안 가려지는 값) → vars 로 읽는다
          #    2026-08-09: 손님이 "등록해 놨다" 하셨는데 secrets 에는 없었다.
          #    한쪽만 보고 "없다" 고 하면 안 된다 — 둘 다 본다.
          # ⚠️ 2026-08-09 실측: **Pixabay 소리 API 는 이 열쇠로 안 열린다**(403).
          #    같은 열쇠로 사진·영상은 정상인데 /api/audio/ 만 막힌다 — 웹사이트 내부용이다.
          #    그래서 **Freesound 를 먼저** 찾는다(소리를 공식 API 로 주는 곳).
          NAME=""; FROM=""; VARNAME=""
          for want in freesound pixabay; do
            for tab in Secrets Variables; do
              SRC="$ALL_SECRETS"; [ "$tab" = "Variables" ] && SRC="$ALL_VARS"
              HIT=$(printf '%s' "$SRC" | jq -r 'keys[]' | grep -i "$want" | head -1 || true)
              if [ -n "$HIT" ]; then
                NAME="$HIT"; FROM="$tab"
                VARNAME=$([ "$want" = "freesound" ] && echo FREESOUND_TOKEN || echo PIXABAY_API_KEY)
                break 2
              fi
            done
          done
          if [ -z "$NAME" ]; then
            {
              echo "## 소리를 받아올 열쇠를 못 찾았습니다"
              echo ""
              echo "이 저장소(jtaechul/verdict-theater)에 등록된 것 전부입니다 (값은 안 보입니다)."
              echo ""
              echo "**Secrets 탭**"
              echo '```'
              printf '%s' "$ALL_SECRETS" | jq -r 'keys[]'
              echo '```'
              echo "**Variables 탭**"
              echo '```'
              printf '%s' "$ALL_VARS" | jq -r 'keys[]' || echo "(없음)"
              echo '```'
              echo ""
              echo "소리를 받으려면 **Freesound** 열쇠가 필요합니다."
              echo "(Pixabay 소리 API 는 2026-08-09 실측 결과 403 으로 막혀 있습니다 —"
              echo " 같은 열쇠로 사진·영상은 되지만 소리만 안 열립니다)"
              echo ""
              echo "1. https://freesound.org 가입 → 로그인"
              echo "2. https://freesound.org/apiv2/apply/ 에서 API key 신청 (바로 나옵니다)"
              echo "3. 이 저장소 **Settings → Secrets and variables → Actions"
              echo "   → Secrets 탭 → New repository secret**"
              echo "   이름 \`FREESOUND_TOKEN\`, 값에 받은 key 붙여넣기"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Secrets 탭:"
            printf '%s' "$ALL_SECRETS" | jq -r 'keys[]'
            echo "Variables 탭:"
            printf '%s' "$ALL_VARS" | jq -r 'keys[]' || echo "(없음)"
            echo "::error::소리를 받아올 열쇠를 못 찾았습니다. 요약 화면에 등록된 이름을 적어 뒀습니다."
            exit 1
          fi
          echo "찾은 열쇠: $NAME ($FROM 탭) → $VARNAME 로 씁니다"
          SRC="$ALL_SECRETS"
          [ "$FROM" = "Variables" ] && SRC="$ALL_VARS"
          VAL=$(printf '%s' "$SRC" | jq -r --arg n "$NAME" '.[$n]')
          echo "::add-mask::$VAL"
          echo "$VARNAME=$VAL" >> "$GITHUB_ENV"

      # 표식 파일로 돌 때는 그 파일에 적힌 이름을 쓴다 — 고칠 소리 하나만 콕 집기 위해서.
      # (표식으로 돌면 inputs 가 비어 있어서, 없으면 위 기본값 전부를 다시 받게 된다.
      #  멀쩡한 소리까지 다른 것으로 바뀌어 버리므로 이 길을 열어 둔다)
      - name: 표식 파일에 적힌 이름 읽기
        if: github.event_name == 'push'
        run: |
          L=$(head -1 .trigger/sfx 2>/dev/null | tr -d '\r' | xargs || true)
          case "$L" in
            ''|*[!a-z\ ]*) echo "표식에 이름이 없습니다 — 기본값($NAME)을 씁니다" ;;
            *) echo "표식에 적힌 이름: $L"; echo "NAME=$L" >> "$GITHUB_ENV" ;;
          esac

      - name: 소리 받아서 고르기
        run: |
          set -o pipefail
          ARGS=()
          [ -n "$INSTALL" ] && ARGS+=(--install "$INSTALL")
          # 이름이 여러 개면 --query 를 주지 않는다 (소리마다 찾는 말이 다르다).
          # $NAME 을 일부러 따옴표 없이 둔다 — 띄어쓰기로 갈라 여러 이름이 되게.
          # shellcheck disable=SC2086
          if [ -n "$QUERY" ]; then
            python3 tools/get_sfx.py $NAME --query "$QUERY" "${ARGS[@]}" 2>&1 | tee sfx.log
          else
            python3 tools/get_sfx.py $NAME "${ARGS[@]}" 2>&1 | tee sfx.log
          fi

      # 받아 온 것이 진짜 소리인지 마지막으로 확인한다 (삑이면 위에서 이미 안 넣는다)
      - name: 삑 소리 확인
        if: always()
        run: python3 tools/sfx_quality.py 2>&1 | tee -a sfx.log

      - name: 결과 화면
        if: always()
        run: |
          {
            echo "## 효과음 받아오기 — $NAME"
            echo ""
            echo '```'
            tail -n 40 sfx.log 2>/dev/null || echo "(기록 없음)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 들어보기 파일을 보관함에 올린다 — 관리자 페이지에서 재생할 수 있다.
      - name: 들어보기 파일 보관
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 소리를 여러 개 받으면 들어보기 파일도 여러 개다 — 전부 올린다.
          # (예전에는 "${NAME}_listen.mp3" 한 개만 찾아서, 이름이 여럿이면
          #  파일을 못 찾고 조용히 넘어갔다)
          FILES=()
          while IFS= read -r f; do FILES+=("$f"); done \
            < <(find build/sfx -name '*_listen.mp3' 2>/dev/null || true)
          [ ${#FILES[@]} -gt 0 ] || { echo "들어보기 파일이 없습니다."; exit 0; }
          gh release view "sfx-preview" >/dev/null 2>&1 \
            && gh release upload "sfx-preview" "${FILES[@]}" --clobber \
            || gh release create "sfx-preview" --title "효과음 들어보기" \
                 --notes "후보를 번호 순서로 이어 붙인 파일입니다." --prerelease "${FILES[@]}"
          echo "보관함: sfx-preview (${#FILES[@]}개)"

      - name: 새 효과음 커밋
        run: |
          git config user.name  "verdict-theater-bot"
          git config user.email "actions@github.com"
          git add assets/sfx 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "바뀐 것이 없다 (듣기만 했거나 같은 소리)."
            exit 0
          fi
          git commit -m "효과음: ${NAME} 을 Freesound 에서 받은 진짜 소리로 교체 [skip ci]"
          for i in 1 2 3 4; do
            git push origin HEAD:main && break
            sleep $((2**i)); git pull --rebase origin main || true
          done
