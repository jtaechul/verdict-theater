name: 효과음 받아오기 (Pixabay)

# 효과음을 Pixabay 에서 받아 저장소에 넣는다.
#
# 왜 (2026-08-08 손님: "법정에서 걸음소리 좆같아")
#   지금 발소리는 분당 131걸음 — 뛰다시피 하는 속도라 법정 장면에 안 맞는다.
#   기계가 걸음 속도·묵직함을 재서 법정에 맞는 것을 고른다.
#
# 필요한 열쇠: PIXABAY_API_KEY (저장소 Secrets)

on:
  # 표식 파일이 바뀌면 자동으로 돈다 (고친 사람이 직접 시동을 건다)
  push:
    paths:
      - '.trigger/sfx'
  workflow_dispatch:
    inputs:
      name:
        description: '효과음 이름 (assets/sfx/{이름}.mp3 로 들어갑니다)'
        required: true
        default: 'footsteps'
      query:
        description: '무엇을 찾을까요 (영어로)'
        required: true
        default: 'footsteps hall'
      install:
        description: "설치할 후보 — 'best' 면 기계가 고른 1순위, 안 넣으면 듣기만"
        required: false
        default: 'best'

permissions:
  contents: write

concurrency:
  group: sfx
  cancel-in-progress: false

jobs:
  sfx:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NAME:    ${{ inputs.name    || 'footsteps' }}
      QUERY:   ${{ inputs.query   || 'footsteps hall' }}
      INSTALL: ${{ inputs.install || 'best' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 도구 준비
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python3 -m pip install --quiet numpy

      # ⚠️ 열쇠 이름을 짐작하지 않는다. 2026-08-08 에 PIXABAY_API_KEY 등 네 가지를
      #    찍어 놓고 찾았다가 "못 찾았다" 로 실패했다 — 손님은 분명히 등록해 두셨는데
      #    내가 정한 이름과 달랐던 것이다. 이제 **등록된 열쇠 이름을 전부 훑어**
      #    'pixabay' 가 들어간 것을 찾아 쓴다.
      #    ⚠️ 값은 절대 찍지 않는다. 이름만 본다(깃허브가 값은 자동으로 가려 주지만,
      #       애초에 찍지 않는 것이 맞다).
      - name: Pixabay 열쇠 찾기 (이름이 무엇이든)
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: |
          set -o pipefail
          NAME=$(printf '%s' "$ALL_SECRETS" | jq -r 'keys[]' | grep -i pixabay | head -1 || true)
          if [ -z "$NAME" ]; then
            {
              echo "## Pixabay 열쇠를 못 찾았습니다"
              echo ""
              echo "이 저장소에 등록된 열쇠 이름은 아래와 같습니다 (값은 안 보입니다):"
              echo ""
              echo '```'
              printf '%s' "$ALL_SECRETS" | jq -r 'keys[]'
              echo '```'
              echo ""
              echo "이 중에 Pixabay 것이 있으면 이름을 알려주시고,"
              echo "없으면 **Settings → Secrets and variables → Actions** 에서"
              echo "\`PIXABAY_API_KEY\` 로 등록해 주십시오."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "등록된 열쇠 이름:"
            printf '%s' "$ALL_SECRETS" | jq -r 'keys[]'
            echo "::error::Pixabay 열쇠를 못 찾았습니다. 요약 화면에 등록된 이름을 적어 뒀습니다."
            exit 1
          fi
          echo "찾은 열쇠 이름: $NAME"
          VAL=$(printf '%s' "$ALL_SECRETS" | jq -r --arg n "$NAME" '.[$n]')
          echo "::add-mask::$VAL"
          echo "PIXABAY_API_KEY=$VAL" >> "$GITHUB_ENV"

      - name: 소리 받아서 고르기
        run: |
          set -o pipefail
          ARGS=()
          [ -n "$INSTALL" ] && ARGS+=(--install "$INSTALL")
          python3 tools/get_sfx.py "$NAME" --query "$QUERY" "${ARGS[@]}" 2>&1 | tee sfx.log

      - name: 결과 화면
        if: always()
        run: |
          {
            echo "## 효과음 받아오기 — $NAME"
            echo ""
            echo '```'
            tail -n 40 sfx.log 2>/dev/null || echo "(기록 없음)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 들어보기 파일을 보관함에 올린다 — 관리자 페이지에서 재생할 수 있다.
      - name: 들어보기 파일 보관
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          F="build/sfx/${NAME}_listen.mp3"
          [ -f "$F" ] || exit 0
          gh release view "sfx-preview" >/dev/null 2>&1 \
            && gh release upload "sfx-preview" "$F" --clobber \
            || gh release create "sfx-preview" --title "효과음 들어보기" \
                 --notes "후보를 번호 순서로 이어 붙인 파일입니다." --prerelease "$F"
          echo "보관함: sfx-preview"

      - name: 새 효과음 커밋
        run: |
          git config user.name  "verdict-theater-bot"
          git config user.email "actions@github.com"
          git add assets/sfx 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "바뀐 것이 없다 (듣기만 했거나 같은 소리)."
            exit 0
          fi
          git commit -m "효과음: ${NAME} 을 Pixabay 에서 받은 것으로 교체 [skip ci]"
          for i in 1 2 3 4; do
            git push origin HEAD:main && break
            sleep $((2**i)); git pull --rebase origin main || true
          done
