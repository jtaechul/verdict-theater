name: 4. 한국어 목소리 들어보기 (값 0원)

# 대본의 대사 몇 마디를 **구글 한국어 목소리**로 만들어 들려준다.
#
# 왜 (2026-08-21)
#   쇼츠는 클립 5개가 다 있어야 만들어진다. 그래서 목소리가 어떤지 확인하려면
#   영상 다섯 개를 먼저 뽑아야 했다 — 되돌아오는 길이 너무 길다.
#   이 워크플로는 **영상 없이 소리만** 만든다. 버튼 한 번, 1분이면 끝난다.
#
# 어떻게 오나
#   관리자 페이지 [목소리 들어보기] → 워커가 이 워크플로를 부른다
#   → 결과는 릴리스 `voice-S001-ep01` 에 남고, 화면에서 바로 들린다.
#
# 값
#   대사 넉 줄이면 60자쯤이다. 구글 무료 한도(월 100만 자) 안이라 0원이다.

on:
  workflow_dispatch:
    inputs:
      sid:
        description: '시리즈 번호'
        required: true
        default: 'S001'
      ep:
        description: '몇 화'
        required: true
        default: '1'
      style:
        description: '말투 결 (비우면 정해 둔 것)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  voice:
    runs-on: ubuntu-latest
    # 무료 한도가 1분에 10번이라, 한도에 걸리면 구글이 알려 준 만큼 쉬었다
    # 간다. 넉넉히 잡아 둔다 (보통은 1~2분이면 끝난다).
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
      # ⚠️ 이 실행에서 목소리를 몇 번까지 부를 수 있는가.
      #    상한이 없으면 실패가 겹칠 때 조용히 수백 번을 부른다.
      TTS_CALL_CAP: '6'
      SID: ${{ inputs.sid }}
      EP: ${{ inputs.ep }}
      # ⭐ 비어 있으면 tts.py 가 정해 둔 결로 간다
      VOICE_STYLE: ${{ inputs.style }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ⚠️ 소리 토막을 이어 붙이는 데 ffmpeg 가 필요하다. 깃허브 실행기에는
      #    기본으로 안 깔려 있다 — 이것을 빠뜨려 세 번째 시도가 죽었다.
      # ⭐ 2026-08-22 — 운영자가 귀로 고른 목소리가 있으면 그것을 쓴다.
      #    없으면 (|| true) 정해 둔 것으로 간다.
      - name: 골라 둔 목소리 가져오기
        continue-on-error: true
        run: |
          mkdir -p state
          # ⚠️ 저장소에 이미 있으면 그것이 최신이다. 릴리스 것으로 덮지 않는다.
          if [ -s state/voice.json ]; then
            echo "저장소에 골라 둔 것이 있다: $(cat state/voice.json)"
          else
            python3 tools/release_file.py get voicepick chosen.json state/voice.json \
              || echo "골라 둔 것이 없다 — 정해 둔 목소리로 간다"
          fi

      - name: 준비물 (ffmpeg)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      # ⭐ 2026-08-21 — 목소리를 **제미나이**로 바꿨다. 이미 대본 만들 때 쓰는
      #    GEMINI_API_KEY 를 그대로 쓰므로 새로 넣을 열쇠가 없다.
      #    구글 클라우드 TTS(GOOGLE_TTS_KEY)는 되돌아갈 자리로 남겨 둔다.
      - name: 열쇠 확인
        run: |
          if [ -z "${GEMINI_API_KEY:-}" ] && [ -z "${GOOGLE_TTS_KEY:-}" ]; then
            echo "❌ 목소리 열쇠가 하나도 없습니다."
            echo "   GEMINI_API_KEY 나 GOOGLE_TTS_KEY 중 하나는 있어야 합니다."
            exit 1
          fi
          if [ -n "${GEMINI_API_KEY:-}" ]; then
            echo "✅ 제미나이 목소리를 씁니다"
          else
            echo "✅ 구글 클라우드 목소리를 씁니다 (되돌아갈 자리)"
          fi

      - name: 견본 소리 만들기
        run: |
          set -euo pipefail
          EPN=$(printf '%02d' "$EP")
          mkdir -p build
          # 까닭을 파일로도 남긴다 — 실패하면 화면에 그대로 보여 준다
          set +e
          python3 src/tts.py --sample "$SID" --ep "$EP" --out "build/voice.mp3" \
            2>&1 | tee build/why.txt
          rc=${PIPESTATUS[0]}
          set -e
          test "$rc" = "0" || { echo "❌ 만들지 못했습니다"; exit 1; }
          ls -la build/voice.mp3

      - name: 릴리스에 올리기 (저장소에는 안 넣는다)
        run: |
          set -euo pipefail
          EPN=$(printf '%02d' "$EP")
          python3 tools/release_file.py put "voice-${SID}-ep${EPN}" voice.mp3 build/voice.mp3
          # 어떤 목소리로 만들었는지도 같이 올린다 — 관리자 페이지가 보여 준다
          if [ -f build/voice.txt ]; then
            python3 tools/release_file.py put "voice-${SID}-ep${EPN}" voice.txt build/voice.txt
          fi

      # ⚠️⚠️ 2026-08-22 — 장부(state/spend.json)가 **한 번도 안 남고 있었다.**
      #    깃허브 안에서만 적히고 컨테이너와 함께 버려졌다. 그래서 8/18 이후
      #    쓴 돈이 장부에 하나도 없었다. 쓴 만큼은 반드시 남긴다.
      - name: 쓴 돈 장부 남기기
        if: always()
        continue-on-error: true
        run: |
          git config user.name "verdict-theater-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/spend.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "장부에 새로 적힌 것이 없다"
          else
            git commit -m "장부: 쓴 돈 [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}" || echo "못 밀었다"
          fi

      - name: 결과 화면
        if: always()
        run: |
          {
            if [ "${{ job.status }}" = "success" ]; then
              echo "## 목소리 견본이 만들어졌습니다 (값 0원)"
              echo ""
              echo "관리자 페이지에서 바로 들으실 수 있습니다."
            else
              echo "## 목소리 견본을 못 만들었습니다"
              echo ""
              if [ -f build/why.txt ]; then
                echo '```'
                tail -n 12 build/why.txt
                echo '```'
              else
                echo "위의 빨간 칸을 열어 까닭을 보십시오."
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"
