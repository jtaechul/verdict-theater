name: 5-1. 목소리 상태 확인 (주 1회 · 1원 미만)

# 목소리 열쇠가 살아 있는지, 어느 길로 가는지 확인한다.
#
# ⚠️⚠️ 2026-08-22 — 이 두 검사는 원래 **자체 점검** 안에 있었다. 자체 점검은
#    밀어 넣을 때마다 도는데, 하루 열네 번을 밀었더니 그때마다 유료 호출이
#    두 번씩 나갔다. 운영자가 "돈이 계속 빠져나간다" 고 했다.
#    → 밀 때마다가 아니라 **주 1회 + 필요할 때 버튼**으로 옮긴다.

# ⭐ 2026-08-23 — 주 1회 자동 실행을 **끈다.**
#    루미나 나레이션을 그대로 쓰기로 해서(KEEP_AUDIO 기본), 목소리 열쇠 검진은
#    이제 쓰지 않는 기능의 건강검진이다. 1원 미만이라도 매주 나가면 새는 돈이다.
#    필요하면 버튼으로만 돌린다.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
      TTS_CALL_CAP: '6'           # ⚠️ 확인만 하는 자리다. 여섯 번이면 넉넉하다
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 열쇠가 살아 있는가 (연기 지시까지 먹는지)
        run: python3 tools/tts_live_check.py
      - name: 하루 제한 없는 길로 가는가
        continue-on-error: true
        run: python3 tools/voice_route.py --strict

      # ⚠️⚠️⚠️ 2026-09-05 — 이 칸이 없어서 **쓴 돈이 장부 밖에 있었다.**
      #    손님: "이 정도 돈이면 전부 다 영상으로 만들 수도 있었잖아."
      #    장부에 안 적히면 한 달 한도(MONTH_KRW)도 그 돈을 못 본다.
      #    tools/ledger_check.py 가 이제 이 칸이 있는지 매번 본다.
      - name: 쓴 돈 장부 남기기
        if: always()
        continue-on-error: true
        run: |
          git config user.name "verdict-theater-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/spend.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "장부에 새로 적힌 것이 없다"
          else
            git commit -m "장부: 쓴 돈 [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}" || echo "못 밀었다"
          fi
