name: 유튜브 연결하기 (최초 1회)

# 유튜브 계정을 이 저장소에 연결한다. **한 번만 하면 된다.**
#
# 아이폰 GitHub 앱에서 쓰는 법
#   Actions 탭 → "유튜브 연결하기 (최초 1회)" → Run workflow
#   → 실행 화면에 주소와 8자리 코드가 뜬다 (텔레그램으로도 온다)
#   → 폰 브라우저로 그 주소에 들어가 코드를 넣고 '허용'
#   → 요약 화면에 나온 토큰을 시크릿에 넣으면 끝
#
# ⚠️ 미리 등록돼 있어야 하는 것: YOUTUBE_CLIENT_ID, YOUTUBE_CLIENT_SECRET
#    구글 클라우드에서 만들 때 애플리케이션 유형을 **'TV 및 제한된 입력 장치'** 로 고른다.
#    '웹 애플리케이션' 으로 만들면 이 방식이 통하지 않는다.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: connect-youtube
  cancel-in-progress: true

jobs:
  connect:
    runs-on: ubuntu-latest
    # 코드를 넣을 시간을 넉넉히 준다. 구글이 주는 코드는 보통 30분 동안 살아 있다.
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 유튜브 연결 (폰에서 코드 입력)
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          # 코드를 텔레그램으로도 보낸다 — 실행 화면을 지켜보지 않아도 된다.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 src/yt_connect.py
