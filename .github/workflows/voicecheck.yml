name: 음성 점검 (값 0원)

# 이미 만들어 둔 음성이 **얼마나 흔들리는지 숫자로 재기만** 한다.
#
# ⭐ 제미나이를 **한 번도 부르지 않는다.** 값이 0원이다.
#    보관해 둔 음성 파일을 꺼내 크기·높이·속도를 잴 뿐이다.
#    영상도 만들지 않는다 — 3분이면 끝난다.
#
# 왜 필요한가
#   "해설 목소리가 중간중간 바뀐다" 를 고치려면 **무엇이** 바뀌는지 알아야 한다.
#   기록을 보니 모델은 한 번도 안 바뀌었고 높이도 반음 안이었다. 그러면 남은 것은
#   크기와 속도다. 짐작으로 고치면 또 헛돈이 나가므로 먼저 잰다.

on:
  workflow_dispatch:
    inputs:
      episode:
        description: '회차 (비우면 가장 최근 회차)'
        required: false
        default: ''
      who:
        description: '누구를 잴까요'
        required: true
        default: '해설만'
        type: choice
        options:
          - '해설만'
          - '전부 (해설 + 등장인물)'
      cut:
        description: '반드시 볼 컷 (쉼표로 구분) — 목소리가 튀는 컷 이름'
        required: false
        default: 'H05,A1-15'

permissions:
  contents: read

jobs:
  voicecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 도구 준비
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python3 -m pip install --quiet numpy

      - name: 회차 정하기
        id: pick
        run: |
          set -euo pipefail
          EP="${{ inputs.episode }}"
          if [ -z "$EP" ]; then
            EP=$(ls -1 data/scripts/EP*.json 2>/dev/null \
                 | grep -v '\.eval\.\|\.shorts\.' | sort | tail -1 \
                 | xargs -r -n1 basename | sed 's/\.json//' || true)
          fi
          [ -n "$EP" ] || { echo "::error::대본이 없습니다."; exit 1; }
          echo "ep=$EP" >> "$GITHUB_OUTPUT"
          echo "hash=$(sha256sum "data/scripts/$EP.json" | cut -c1-16)" >> "$GITHUB_OUTPUT"
          echo "회차: $EP"

      # ⭐ 영상 만들기가 저장해 둔 음성을 그대로 꺼내 온다. 새로 만들지 않는다.
      - name: 만들어 둔 음성 꺼내기
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: build/voice
          key: voice-${{ steps.pick.outputs.ep }}-${{ steps.pick.outputs.hash }}
          restore-keys: |
            voice-${{ steps.pick.outputs.ep }}-

      - name: 재기
        run: |
          set -o pipefail
          EP="${{ steps.pick.outputs.ep }}"
          if [ ! -d build/voice ]; then
            {
              echo "## 보관해 둔 음성이 없습니다"
              echo ""
              echo "**3. 영상 만들기** 를 한 번 돌린 뒤에 다시 눌러 주십시오."
              echo "(보관함은 7일 동안 안 쓰면 저절로 지워집니다)"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::보관해 둔 음성이 없습니다."
            exit 1
          fi
          echo "음성 파일 $(ls build/voice/*.mp3 2>/dev/null | wc -l)개를 꺼냈습니다"
          WHO="--who narrator"
          [ "${{ inputs.who }}" != "해설만" ] && WHO="--who ''"
          python3 src/voicecheck.py "data/scripts/$EP.json" \
            --voice build/voice $WHO --cut "${{ inputs.cut }}" 2>&1 | tee voice.log

      - name: 결과 화면
        if: always()
        run: |
          {
            echo "## 음성 점검 — ${{ steps.pick.outputs.ep }}"
            echo ""
            echo "제미나이를 부르지 않았습니다. **값 0원**입니다."
            echo ""
            echo '```'
            cat voice.log 2>/dev/null || echo "(재지 못했습니다)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
