name: 2. 시리즈 대본 만들기

# 판례 1건 → 30초짜리 16화 시리즈 (구글 영상 제작용).
#
# ⭐ 2026-08-18 대개편 — 영상을 구글(옴니 플래시)이 만든다.
#    하루 무료 크레딧 50개 = 6초 클립 5개 = 30초. 그래서 12분짜리 한 회차 대신
#    **하루 30초 × 16화**로 쪼갠다. 16일이면 8분 롱폼이 공짜로 나온다.
#
# 값: 글만 쓴다 — 시리즈 하나(16화 전부)에 수백 원. 영상값은 여기서 안 나간다.

on:
  # ⭐ 표식 파일(.trigger/series)이 바뀌면 자동으로 돈다.
  #    까닭: 고친 사람이 **직접 돌려서 확인**할 수 있어야 한다. 여태 손님이
  #    버튼을 눌러 주기 전에는 진짜로 되는지 아무도 못 봤고, 그래서 실패가
  #    손님 화면에서만 드러났다. 이 저장소가 이미 쓰던 방식과 같다
  #    (.trigger/produce · .trigger/sfx).
  #    표식 파일 첫 줄에 판례 번호를 적는다. 비우면 자동으로 고른다.
  push:
    paths:
      - '.trigger/series'
  workflow_dispatch:
    inputs:
      case:
        description: '판례 번호 (비우면 점수가 가장 높은 것으로 자동)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: series
  cancel-in-progress: false

jobs:
  series:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 시리즈 대본 만들기
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -o pipefail
          CASE="${{ inputs.case }}"
          W=gemini   # 클로드는 꺼져 있다 (2026-08-23)
          # 표식 파일로 돌 때는 버튼 값이 비어 있으므로 파일에서 읽는다
          if [ "${{ github.event_name }}" = "push" ]; then
            CASE=$(head -1 .trigger/series 2>/dev/null | tr -d '\r' | xargs || true)
            case "$CASE" in
              ''|*[!0-9]*) echo "표식에 판례 번호가 없습니다 — 자동으로 고릅니다"; CASE="" ;;
              *) echo "표식에 적힌 판례: $CASE" ;;
            esac
          fi
          python3 src/series.py --case "$CASE" --writer "$W" 2>&1 | tee series.log

      - name: 결과 화면
        if: always()
        run: |
          {
            echo "## 시리즈 대본"
            echo ""
            echo '```'
            tail -n 30 series.log 2>/dev/null || echo "기록 없음"
            echo '```'
            echo ""
            echo "> 규격에 안 맞으면 **저장하지 않습니다.** 그 경우 위 목록을 보고 다시 실행하십시오."
          } >> "$GITHUB_STEP_SUMMARY"

      # ⚠️ 2026-08-19 — 첫 실행이 규격에 걸렸을 때 **받아 둔 대본이 사라졌다.**
      #    실행이 끝나면 그 컴퓨터가 없어지기 때문이다. 값은 이미 나갔는데
      #    다시 사야 하는 구조였다. 걸린 것도 저장한다 — 기준만 손보면
      #    그대로 통과시킬 수 있다(0원).
      - name: 저장소에 올리기 (걸린 것도 남긴다)
        if: always()
        run: |
          git config user.name  "verdict-theater-bot"
          git config user.email "actions@github.com"
          # ⚠️ 2026-08-20 — 여기서 **또 대본을 잃었다.**
          #    `git add A B` 는 B 가 없으면 A 까지 통째로 안 올린다.
          #    state/series.json 은 '통과했을 때만' 생기는 파일이라, 반려된
          #    바로 그 순간에는 항상 없다. 그래서 살려 두려던 대본이 매번
          #    사라졌다. 경로를 **하나씩 따로** 올린다.
          git add data/series 2>/dev/null || true
          git add state/series.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          bash tools/push.sh "시리즈: 대본 추가 [skip ci]" data/series state
