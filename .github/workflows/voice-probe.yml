name: 9. 목소리 길 확인 (값 1원 미만)

# 어느 길로 목소리를 부르는 것이 실제로 되는지 확인한다.
#
# 왜 (2026-08-21)
#   제미나이 목소리(AI 스튜디오 열쇠)는 소리가 좋은데 무료 등급이 **하루 10번**이다.
#   한 화가 대사 15줄쯤이라 무료로는 한 화도 못 만든다.
#   같은 목소리를 구글 클라우드 쪽(GOOGLE_TTS_KEY, 결제 붙어 있음)으로도 부를 수
#   있으면 운영자가 새로 할 일이 하나도 없다. 추측하지 말고 여기서 걸어 본다.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 걸어 보기
        run: |
          set +e
          python3 tools/tts_route_probe.py 2>&1 | tee build_probe.txt
          exit 0
      - name: 결과 화면
        if: always()
        run: |
          {
            echo "## 목소리 길 확인 결과"
            echo ""
            echo '```'
            cat build_probe.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ⚠️⚠️⚠️ 2026-09-05 — 이 칸이 없어서 **쓴 돈이 장부 밖에 있었다.**
      #    손님: "이 정도 돈이면 전부 다 영상으로 만들 수도 있었잖아."
      #    장부에 안 적히면 한 달 한도(MONTH_KRW)도 그 돈을 못 본다.
      #    tools/ledger_check.py 가 이제 이 칸이 있는지 매번 본다.
      - name: 쓴 돈 장부 남기기
        if: always()
        continue-on-error: true
        run: |
          git config user.name "verdict-theater-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/spend.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "장부에 새로 적힌 것이 없다"
          else
            git commit -m "장부: 쓴 돈 [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}" || echo "못 밀었다"
          fi
