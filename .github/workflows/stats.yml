name: 5. 성과 보기

# 조회수·시청 지속률·구독 전환을 모아 판단 기준(KPI)을 점검한다.
#
# 왜 필요한가 (지침서 10번)
#   이 사업의 최대 실패 원인은 3개월 내 포기다.
#   수익은 3개월 동안 0원이므로 수익이 아니라 선행지표로 판단한다.
#   8주차 시청 지속률이 핵심 분기점이다.

on:
  workflow_dispatch:
  # ⚠️ 2026-08-27 — 지금 절차에서 안 쓰므로 자동 실행을 껐다
  #    (매주 성과 보기 · 값은 0원이지만 저장소에 저절로 커밋한다)
  # schedule:
    # 매주 월요일 한국시간 오전 8시 (UTC 23:00 일요일)
    # - cron: '0 23 * * 0'

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      HOOK: ${{ secrets.NOTIFY_WEBHOOK }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # src/stats.py → upload.py → render.py 가 Pillow 를 읽는다 (2026-08-14 확인)
      - name: 도구 준비
        run: python3 -m pip install --quiet Pillow

      - name: 성과 수집
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          set -o pipefail
          python3 src/stats.py 2>&1 | tee stats.log

      - name: 결과 화면
        if: always()
        run: |
          {
            echo "## 성과"
            echo ""
            echo '```'
            cat stats.log 2>/dev/null || echo "기록 없음"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 기록 커밋
        if: always()
        run: |
          git config user.name  "verdict-theater-bot"
          git config user.email "actions@github.com"
          git add state 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "성과: 주간 집계 [skip ci]"
          # ⚠️ 직접 push 하지 않는다. 밀렸을 때 rebase 충돌이 나면 예전 방식은
          #    커밋을 조용히 버리고 "Everything up-to-date" 로 성공 처리했다.
          #    (2026-08-10 EP002 대본 실종) tools/push.sh 가 그 자리를 안전하게 처리한다.
          bash tools/push.sh "성과: 주간 집계 [skip ci]" state

      - name: 실패 알림
        if: failure() && env.HOOK != ''
        run: |
          curl -sS -X POST -H 'Content-Type: application/json' \
            -d "{\"text\":\"판결극장 · 성과 수집 실패\\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$HOOK" || true
