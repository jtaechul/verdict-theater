name: 1. 판례 수집

# 판례를 받아와 기계가 1·2차로 걸러낸다.
#
# 아이폰 GitHub 앱에서 쓰는 법
#   Actions 탭 → 왼쪽 목록에서 "1. 판례 수집" → Run workflow 버튼
#
# 법제처 하루 호출 상한이 200회라 한 번에 다 못 받는다.
# state/collect_state.json 에 어디까지 받았는지 남기므로,
# 다음 실행이 이어서 받는다. 백필은 3일에 나눠 끝난다.

on:
  workflow_dispatch:
    inputs:
      max_calls:
        description: '이번에 쓸 최대 호출 수 (하루 상한 200회)'
        required: false
        default: '180'
      topic:
        description: '어떤 갈래를 모을지'
        required: false
        default: '전부'
        type: choice
        options: ['전부', '불륜', '상속', '재산', '부양', '노년', '가업', '혼외자', '제사', '빚']
      queries:
        description: '찾을 낱말을 직접 적을 때만 (쉼표 구분). 비우면 위 갈래를 따른다'
        required: false
        default: ''
      pages:
        description: '낱말 하나당 몇 쪽까지 (한 쪽 100건)'
        required: false
        default: '3'
  schedule:
    # 매주 월요일 한국시간 오전 6시 (UTC 21:00 일요일)
    - cron: '0 21 * * 0'

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    # ⚠️ 알림 주소를 여기(잡 단위)에 둔다. 단계 안의 env 는 그 단계의 if 조건에서
    #    읽히지 않아, 단계에만 두면 실패 알림이 영원히 안 울린다.
    env:
      HOOK: ${{ secrets.NOTIFY_WEBHOOK }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 법제처 인증키는 비밀이 아니라 공개 API의 식별자다(CLAUDE.md 5번에 평문으로 적혀 있다).
      # 등록돼 있으면 그걸 쓰고, 없으면 코드의 기본값으로 그냥 돌아간다.
      # 열쇠 하나 때문에 파이프라인이 멈추는 일이 없게 한다.
      - name: 인증키 확인 (없어도 진행)
        env:
          LAW_OC: ${{ secrets.LAW_OC }}
        run: |
          if [ -n "$LAW_OC" ]; then
            echo "LAW_OC 가 등록되어 있습니다. 그 값을 씁니다."
          else
            echo "LAW_OC 가 없습니다. 코드의 기본값(panryetheater)으로 진행합니다."
            echo "법제처 공개 API의 식별자라 감출 필요가 없는 값입니다."
          fi

      - name: 판례 수집 + 1·2차 선정
        id: run
        env:
          LAW_OC: ${{ secrets.LAW_OC }}
        run: |
          set -o pipefail
          # '전부' 를 고르면 갈래를 안 넘긴다(= 모든 낱말). 그 밖에는 그 갈래만 훑는다.
          T="${{ inputs.topic }}"
          if [ "$T" = "전부" ] || [ -z "$T" ]; then T=""; fi
          python3 src/collect.py \
            --max-calls "${{ inputs.max_calls || '180' }}" \
            --pages "${{ inputs.pages || '3' }}" \
            --topic "$T" \
            --queries "${{ inputs.queries }}" 2>&1 | tee collect.log

      # 쓰지 않기로 한 판례를 대기열에서 딴 곳으로 옮긴다 (화면이 깨끗해진다).
      # 지우지 않고 옮기는 이유 — 대기열이 '이미 본 것' 기억을 겸하기 때문이다.
      # 지우면 다음에 다시 받아 **다시 평가하느라 값이 나간다.**
      - name: 쓰지 않기로 한 것 치우기 (값 0원)
        run: python3 tools/queue_clean.py 2>&1 | tee -a collect.log

      # 걸러내는 기준을 고쳐도, 예전에 받아 둔 것은 옛 기준 그대로 남는다.
      # 판결문은 이미 저장소에 있으므로 다시 받을 필요 없이 다시 채점만 한다. 값 0원.
      - name: 갈래 다시 매기기 (값 0원)
        run: python3 tools/queue_retopic.py 2>&1 | tee -a collect.log

      - name: 결과 요약 (아이폰에서 읽는 화면)
        if: always()
        run: |
          {
            echo "## 판례 수집 결과"
            echo ""
            echo '```'
            tail -n 40 collect.log 2>/dev/null || echo "로그 없음"
            echo '```'
            echo ""
            if [ -f state/queue.json ]; then
              echo "**대기열: $(python3 -c "import json;print(len(json.load(open('state/queue.json'))))")건**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 저장소 용량 감시
        if: always()
        run: |
          MB=$(du -sm --exclude=.git . | cut -f1)
          echo "저장소 크기: ${MB}MB"
          if [ "$MB" -gt 500 ]; then
            echo "::warning::저장소가 ${MB}MB 입니다. 500MB를 넘었습니다. 영상이 잘못 커밋됐는지 확인하십시오."
          fi

      - name: 결과 커밋
        if: always()
        run: |
          git config user.name  "verdict-theater-bot"
          git config user.email "actions@github.com"
          # ⚠️ state/collect_last.json 이 빠지면 관리자 페이지의 '지난 수집 결과' 가
          #    영영 안 바뀐다. 새 상태 파일을 만들면 반드시 여기에도 넣는다.
          FILES="data/cases state/queue.json state/collect_state.json state/rejected.json state/collect_last.json"
          # 몇 건인지 세려고 미리 담아 둔다 (push.sh 가 다시 담아도 결과는 같다)
          git add $FILES 2>/dev/null || true
          N=$(git diff --cached --name-only | grep -c '^data/cases/' || true)

          # ⚠️ 직접 push 하지 않는다 — 밀렸을 때 커밋을 조용히 버리는 사고가 있었다.
          if bash tools/push.sh "수집: 판례 ${N}건 갱신 [skip ci]" $FILES; then
            exit 0
          fi

          # 받아온 판례를 잃지 않게 첨부파일로라도 남긴다
          echo "PUSH_FAILED=1" >> "$GITHUB_ENV"
          {
            echo ""
            echo "### ⚠️ 결과를 저장소에 올리지 못했습니다"
            echo ""
            echo "판례는 정상적으로 받아왔지만 저장 단계에서 막혔습니다."
            echo "쓰기 권한이 꺼져 있을 때 생기는 일입니다. 한 번만 켜주시면 됩니다."
            echo ""
            echo "저장소 → **Settings** → **Actions** → **General**"
            echo "→ 맨 아래 **Workflow permissions**"
            echo "→ **Read and write permissions** 선택 → **Save**"
            echo ""
            echo "받아온 판례는 이번 실행의 **Artifacts** 에 첨부해 두었습니다."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::저장소 쓰기 권한이 없어 결과를 커밋하지 못했습니다."

      - name: 못 올린 결과를 첨부파일로 보관
        if: always() && env.PUSH_FAILED == '1'
        uses: actions/upload-artifact@v4
        with:
          name: collected-cases
          path: |
            data/cases
            state/queue.json
            state/collect_state.json
          retention-days: 7

      - name: 실패 알림
        if: failure() && env.HOOK != ''
        run: |
          curl -sS -X POST -H 'Content-Type: application/json' \
            -d "{\"text\":\"판결극장 · 판례 수집 실패\\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$HOOK" || true
