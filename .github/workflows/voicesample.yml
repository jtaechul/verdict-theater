name: 목소리 들어보기 (값 0원)

# 등장인물 목소리를 **mp3 한 개**로 묶어 준다. 관리자 페이지에서 눌러 들으실 수 있다.
#
# 왜 (2026-08-09 손님: "장남 목소리 한번 다시 들려줄래?
#                      여기다가 mp3파일이나 wav 파일로 하나만 올려줘봐.")
#   영상을 통째로 넘겨 가며 장남 대사만 찾아 듣는 것은 번거롭다.
#   그 사람 대사만 뽑아 한 파일로 이어 붙인다.
#
# ⭐ 제미나이를 **한 번도 부르지 않는다. 값 0원.**
#   '영상 만들기' 가 보관해 둔 음성을 꺼내 붙일 뿐이다.
#   (보관함은 7일 동안 안 쓰면 저절로 지워진다 — 그때는 영상을 한 번 만들어야 한다)

on:
  push:
    paths:
      - '.trigger/voicesample'
  workflow_dispatch:
    inputs:
      episode:
        description: '회차 (비우면 가장 최근 회차)'
        required: false
        default: ''
      who:
        description: '누구 목소리를 들으실까요'
        required: true
        default: 'v_M50A'
        type: choice
        options:
          - 'v_M50A'
          - 'v_M50B'
          - 'v_F50A'
          - 'v_F50B'
          - 'v_M70'
          - 'v_F70'
          - 'v_JUDGE'
          - 'narrator'
          - 'all'

permissions:
  contents: read

concurrency:
  group: voicesample
  cancel-in-progress: false

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # ⚠️ 표식 파일(push)로 도는 경우 inputs 가 비어 있다 — 그때 쓸 기본값이다.
    env:
      WHO: ${{ inputs.who || 'all' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 도구 준비
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          # Pillow 는 '영상과 같은 음량 보정' 을 계산하는 render 를 부르는 데 쓴다.
          python3 -m pip install --quiet Pillow numpy

      - name: 회차 정하기
        id: pick
        run: |
          set -euo pipefail
          EP="${{ inputs.episode }}"
          if [ -z "$EP" ]; then
            EP=$(ls -1 data/scripts/EP*.json 2>/dev/null \
                 | grep -v '\.eval\.\|\.shorts\.' | sort | tail -1 \
                 | xargs -r -n1 basename | sed 's/\.json//' || true)
          fi
          [ -n "$EP" ] || { echo "::error::대본이 없습니다."; exit 1; }
          echo "ep=$EP" >> "$GITHUB_OUTPUT"
          echo "hash=$(sha256sum "data/scripts/$EP.json" | cut -c1-16)" >> "$GITHUB_OUTPUT"
          echo "voice=$(sha256sum src/tts.py | cut -c1-8)" >> "$GITHUB_OUTPUT"
          echo "회차: $EP"

      # ⭐ '영상 만들기' 가 저장해 둔 음성을 그대로 꺼내 온다. 새로 만들지 않는다.
      #    열쇠 규칙은 영상 만들기와 **똑같아야** 한다.
      - name: 만들어 둔 음성 꺼내기
        uses: actions/cache/restore@v4
        with:
          path: build/voice
          key: voice-${{ steps.pick.outputs.ep }}-${{ steps.pick.outputs.hash }}-${{ steps.pick.outputs.voice }}
          restore-keys: |
            voice-${{ steps.pick.outputs.ep }}-${{ steps.pick.outputs.hash }}-
            voice-${{ steps.pick.outputs.ep }}-

      - name: 목소리 묶기
        run: |
          set -o pipefail
          EP="${{ steps.pick.outputs.ep }}"
          if [ ! -d build/voice ]; then
            {
              echo "## 보관해 둔 음성이 없습니다"
              echo ""
              echo "**영상 만들기** 를 한 번 돌린 뒤에 다시 눌러 주십시오."
              echo "(보관함은 7일 동안 안 쓰면 저절로 지워집니다)"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::보관해 둔 음성이 없습니다."
            exit 1
          fi
          echo "음성 파일 $(ls build/voice/*.mp3 2>/dev/null | wc -l)개를 꺼냈습니다"
          python3 tools/voice_sample.py "data/scripts/$EP.json" \
            --voice build/voice --who "$WHO" --out build/sample 2>&1 | tee vs.log

      - name: 결과 화면
        if: always()
        run: |
          {
            echo "## 목소리 들어보기 — ${{ steps.pick.outputs.ep }}"
            echo ""
            echo "제미나이를 부르지 않았습니다. **값 0원**입니다."
            echo ""
            echo '```'
            cat vs.log 2>/dev/null || echo "(만들지 못했습니다)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 보관함에 올린다 — 관리자 페이지 [목소리 들어보기] 에서 바로 재생된다.
      - name: 보관함에 올리기
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FILES=()
          while IFS= read -r f; do FILES+=("$f"); done \
            < <(find build/sample -maxdepth 1 -name '*.mp3' 2>/dev/null || true)
          [ ${#FILES[@]} -gt 0 ] || { echo "올릴 파일이 없습니다."; exit 0; }
          TAG="voice-sample-${{ steps.pick.outputs.ep }}"
          gh release view "$TAG" >/dev/null 2>&1 \
            && gh release upload "$TAG" "${FILES[@]}" --clobber \
            || gh release create "$TAG" --title "${{ steps.pick.outputs.ep }} 목소리 들어보기" \
                 --notes "등장인물별로 대사를 이어 붙인 파일입니다. 값 0원." \
                 --prerelease "${FILES[@]}"
          echo "보관함: $TAG (${#FILES[@]}개)"
