name: 3. 올린 영상으로 쇼츠 만들기

# 플로우에서 받은 클립 5개(압축파일)로 30초 쇼츠 한 편을 만든다.
#
# 어떻게 오나
#   관리자 페이지에서 압축파일을 고르면 → 워커가 릴리스 `clips-S001-ep01` 에
#   올리고 → 이 워크플로를 부른다 → 결과는 릴리스 `short-S001-ep01` 에 남는다.
#
# ⚠️ 완성 영상은 **저장소에 커밋하지 않는다** (지침). 릴리스에만 올린다.

on:
  workflow_dispatch:
    inputs:
      sid:
        description: '시리즈 번호'
        required: true
        default: 'S001'
      ep:
        description: '몇 화'
        required: true
        default: '1'
      cut:
        description: '몇 컷만 시험 (비우면 5컷 전체)'
        required: false
        default: ''
      blob:
        description: '올린 압축파일 주소 (관리자 페이지가 채웁니다 · 비우면 릴리스에서 찾습니다)'
        required: false
        default: ''
      voice:
        description: '골라 둔 목소리 주소 (관리자 페이지가 채웁니다)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: shorts
  cancel-in-progress: false

jobs:
  shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # ⭐ 한국어 목소리 (2026-08-21). 없으면 원래 소리를 그대로 쓴다 —
      #    영상은 계속 나오되 발음이 어눌한 채로 나간다.
      # ⭐ 2026-08-21 — 목소리를 제미나이로 바꿨다. 이 열쇠를 안 넘기면
      #    조용히 옛날(외국인 같은) 소리로 되돌아간다.
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
      # ⚠️ 이 실행에서 목소리를 몇 번까지 부를 수 있는가.
      #    상한이 없으면 실패가 겹칠 때 조용히 수백 번을 부른다.
      TTS_CALL_CAP: '40'   # 한 화 대사 9줄 + 재시도 여유
      SID: ${{ inputs.sid }}
      EPNO: ${{ inputs.ep }}
      CUT: ${{ inputs.cut }}
      # ⭐ 2026-08-22 — 관리자 페이지가 올린 압축파일은 이제 깃허브가 아니라
      #    클라우드플레어 보관함에 있다. 주소만 여기로 넘어온다.
      #    받아 갈 때 쓰는 암호는 이미 등록해 둔 ADMIN_PASSWORD 그대로다.
      BLOB: ${{ inputs.blob }}
      VOICE: ${{ inputs.voice }}
      ADMIN_PASS: ${{ secrets.ADMIN_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 준비물 (ffmpeg · 글자 그리기)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg unzip
          python3 -m pip install --quiet pillow

      # ⭐ 2026-08-22 — 운영자가 귀로 고른 목소리가 있으면 그것을 쓴다.
      #    없으면 (|| true) 정해 둔 것으로 간다.
      - name: 골라 둔 목소리 가져오기
        continue-on-error: true
        run: |
          mkdir -p state
          # ⚠️ 저장소에 이미 있으면 그것이 최신이다. 릴리스 것으로 덮지 않는다.
          if [ -s state/voice.json ]; then
            echo "저장소에 골라 둔 것이 있다: $(cat state/voice.json)"
          elif [ -n "${VOICE:-}" ]; then
            curl -fsSL -H "x-vt-pass: ${ADMIN_PASS}" "$VOICE" -o state/voice.json \
              && echo "관리자 페이지에서 골라 둔 것을 받았다: $(cat state/voice.json)"
          else
            python3 tools/release_file.py get voicepick chosen.json state/voice.json \
              || echo "골라 둔 것이 없다 — 정해 둔 목소리로 간다"
          fi

      - name: 올린 압축파일 받기
        run: |
          set -euo pipefail
          EP=$(printf '%02d' "$EPNO")
          echo "EP=$EP" >> "$GITHUB_ENV"
          # ⭐ 한 컷만 시험할 때는 딴 이름으로 두고 받는다. 그래야 힘들게 만든
          #    5컷짜리 완성본을 시험 한 번으로 덮어쓰지 않는다.
          SUF=""
          if [ -n "$CUT" ]; then SUF="-cut${CUT}"; fi
          echo "SUF=$SUF" >> "$GITHUB_ENV"
          mkdir -p build/in
          # ⭐ 관리자 페이지에서 올렸으면 주소가 넘어온다. 거기서 받는다.
          #    ⚠️ 아무 주소나 받지 않는다 — 우리 보관함(workers.dev)만 받는다.
          if [ -n "${BLOB:-}" ]; then
            case "$BLOB" in
              https://*.workers.dev/*) : ;;
              *) echo "❌ 모르는 주소입니다. 받지 않습니다."; exit 1 ;;
            esac
            echo "관리자 페이지 보관함에서 받는다"
            curl -fsSL --retry 3 --retry-delay 2 \
              -H "x-vt-pass: ${ADMIN_PASS}" "$BLOB" -o build/clips.zip
          else
            python3 tools/release_file.py get "clips-${SID}-ep${EP}${SUF}" clips.zip build/clips.zip
          fi
          unzip -q -o build/clips.zip -d build/in
          echo "받은 영상:"
          find build/in -type f \( -iname '*.mp4' -o -iname '*.mov' -o -iname '*.m4v' \) \
            -printf '  %f\n' | sort

      - name: 쇼츠 만들기
        run: |
          set -o pipefail
          if [ -n "$CUT" ]; then
            # 클립 하나로 시험한다 — 만드는 차례는 5컷짜리와 똑같다
            CLIP=$(find build/in -type f \( -iname '*.mp4' -o -iname '*.mov' \
              -o -iname '*.m4v' \) | sort | head -1)
            test -n "$CLIP" || { echo "❌ 압축파일 안에 영상이 없습니다"; exit 1; }
            echo "시험할 클립: $CLIP (${CUT}컷)"
            python3 src/shorts.py "$SID" "$EPNO" --demo "$CLIP" --cut "$CUT" \
              --out build/shorts 2>&1 | tee shorts.log
          else
            python3 src/shorts.py "$SID" "$EPNO" --clips build/in --out build/shorts \
              2>&1 | tee shorts.log
          fi

      - name: 릴리스에 올리기 (저장소에는 안 넣는다)
        run: |
          set -euo pipefail
          if [ -n "$CUT" ]; then
            OUT=$(find build/shorts -maxdepth 1 -name '*_short.mp4' | sort | head -1)
          else
            OUT="build/shorts/${SID}_ep${EP}_short.mp4"
          fi
          test -n "$OUT" && test -f "$OUT" || { echo "❌ 만들어진 영상이 없습니다"; exit 1; }
          python3 tools/release_file.py put "short-${SID}-ep${EP}${SUF}" short.mp4 "$OUT"

      # ⚠️⚠️ 2026-08-22 — 장부(state/spend.json)가 **한 번도 안 남고 있었다.**
      #    깃허브 안에서만 적히고 컨테이너와 함께 버려졌다. 그래서 8/18 이후
      #    쓴 돈이 장부에 하나도 없었다. 쓴 만큼은 반드시 남긴다.
      - name: 쓴 돈 장부 남기기
        if: always()
        continue-on-error: true
        run: |
          git config user.name "verdict-theater-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/spend.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "장부에 새로 적힌 것이 없다"
          else
            git commit -m "장부: 쓴 돈 [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}" || echo "못 밀었다"
          fi

      - name: 결과 화면
        if: always()
        run: |
          {
            echo "## 쇼츠 만들기"
            echo ""
            echo '```'
            tail -n 25 shorts.log 2>/dev/null || echo "기록 없음"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
