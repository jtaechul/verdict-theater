name: 4. 쇼츠 만들기 (사건 하나 · 편마다)

# ⭐ 2026-08-27 운영자 확정 — "90초로 만들어."
#
#   ① 대본 짓기 (0원)            data/series/S90.json — 19컷
#   ② 인물 카드 (5장 · 0원)      ⭐ assets/cards/s90/ 에 넣어 둔 손님 그림을 쓴다.
#      (2026-08-30 손님: "무조건 등장인물은 첨부 등장인물 이미지를 참고하도록 해")
#      관리자 페이지에서 새로 올리면 그것이 이긴다. 어느 쪽이든 시스템은
#      그 사람을 **다시 안 그린다** (.hand 표시) — 카드값 661원이 안 나간다.
#   ③ 컷 그림 19장 (약 2,514원)   세로 9:16 · 카드를 참조로 넣어 얼굴을 묶는다
#   ④ 나레이션·대사 소리 19줄     구글 TTS (약 100원)
#   ⑤ 한 편으로 조립             자막·이름표·아주 느린 줌 → 약 130초
#
# 값: 처음 한 번 약 2,614원. 두 번째부터는 **바뀐 것만** 다시 만든다(대개 0원).
#
# ⚠️ 만든 것은 릴리스에 보관한다. 중간에 죽어도 돈이 날아가지 않는다.
# ⚠️ 완성 영상은 저장소에 커밋하지 않는다 (지침). 릴리스에만 올린다.
#
# ⭐⭐ 컷 영상 — 관리자 페이지 [컷별 영상] 에서 컷마다 올린다.
#   올린 컷은 영상, 안 올린 컷은 그림. 둘이 섞인다.
#   · 대사 컷 + 올린 영상 → 그 영상 안에서 사람이 말한다 (영상 소리를 쓴다)
#   · 나레이션 컷        → 화면에서 아무도 말하지 않고 우리 나레이션이 깔린다

on:
  # ⚠️⚠️ 2026-08-27 — **표식 파일로 자동 실행되던 길을 막았다.**
  #    손님: "우리가 안 쓰는 기능인데 돈이 세면 안 되잖아."
  #    맞다. 여기는 그림·소리 값이 나가는 워크플로인데, .trigger/ 파일이
  #    커밋에 딸려 들어가기만 해도 저절로 돌아 돈이 나갔다.
  #    이제 **단추를 눌러야만** 돈다 (workflow_dispatch).
  workflow_dispatch:
    inputs:
      step:
        description: '어디까지 (all / stills / voice / build)'
        required: true
        default: 'all'
      sid:
        description: '어느 사건 (비우면 S90)'
        required: false
        default: ''
      part:
        description: '어느 편만 다시 만들까요 (예: 2 · 비우면 전부)'
        required: false
        default: ''
      cards:
        description: '손님이 올린 인물 그림 (관리자 페이지가 넣는다 · 손대지 마십시오)'
        required: false
        default: ''
      clips:
        description: '손님이 올린 컷 영상 (관리자 페이지가 넣는다 · 손대지 마십시오)'
        required: false
        default: ''
      open_video:
        description: '편 첫 장면을 진짜 영상으로 (+약 1,400원)'
        required: false
        default: '아니요'
        type: choice
        options: ['아니요', '예']

permissions:
  contents: write

concurrency:
  group: short90
  cancel-in-progress: false

jobs:
  short90:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
      # ⭐ 2026-09-01 — 어느 사건을 만드는가. 비우면 S90.
      #    src/short90.py 가 이 값으로 대본을 고른다.
      VT_SID: ${{ inputs.sid }}
      # ⚠️⚠️ 2026-08-30 — **이 줄이 없어서 첫 실행이 실패했다.**
      #    관리자 페이지 보관함(/api/blob)은 x-vt-pass 로 암호를 받는다.
      #    shorts.yml 은 보내는데 여기만 안 보내서, 손님이 올리신 인물 그림을
      #    받아 갈 때 튕겼고 90초 편 만들기가 통째로 멈췄다.
      ADMIN_PASS: ${{ secrets.ADMIN_PASSWORD }}
      # ⚠️ 상한이 없으면 실패가 겹칠 때 조용히 수십 번을 부른다
      STILL_CALL_CAP: '24'     # 컷 19 + 재시도 여유 (카드는 안 그린다)
      TTS_CALL_CAP: '40'
      # ⭐ 한 번 눌렀을 때 나갈 돈의 뚜껑. 실제로 드는 값(약 2,614원) **바로 위**에
      #    둔다 — 한도가 실제보다 훨씬 높으면 막는 시늉만 하는 것이다.
      # ⚠️ 편 첫 장면 영상을 켜면 1,411원이 더 든다(4초 × 3편). 그때만 뚜껑을
      #    올린다 — 늘 올려 두면 안 켠 날에도 막는 시늉만 하게 된다.
      VT_RUN_KRW: ${{ inputs.open_video == '예' && '4300' || '2800' }}
      # ⭐⭐ 2026-09-04 손님: "각 편당 첫번째 씬만 영상으로."
      #    켰을 때만 Veo 를 부른다. 안 켜면 지금까지처럼 전부 그림이다.
      VT_OPEN_VIDEO: ${{ inputs.open_video == '예' && '1' || '' }}
      # 편이 넷이어도 넉넉하다. 실패가 겹쳐도 조용히 수십 번 부르지 못하게.
      VEO_CALL_CAP: '6'
      STEP: ${{ inputs.step || 'all' }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 준비물 (ffmpeg · 글자 그리기)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python3 -m pip install --quiet pillow

      - name: 돈 쓰기 전 점검 (값 0원)
        run: |
          python3 tools/build_short90.py
          python3 tools/short90_test.py

      - name: 1) 인물 카드 (손님이 고른 다섯 사람의 얼굴)
        if: env.STEP == 'all' || env.STEP == 'stills'
        env:
          CARDS: ${{ inputs.cards }}
        run: |
          set -o pipefail
          mkdir -p build/s90/cards
          S="${VT_SID:-S90}"
          # ⚠️⚠️ 2026-09-05 — 보관 이름이 **cards90-S90 으로 고정**이었다.
          #    사건이 둘이 되는 순간 앞 사건 얼굴을 받아 와 섞이고, 이 사건
          #    얼굴을 그 이름으로 덮어써 앞 사건까지 바뀐다.
          #    (손님: "전혀 다른 얼굴이 생성되도록" — 그러려면 사건마다 따로여야 한다)
          python3 tools/release_file.py get "cards90-$S" cards.zip build/cards90.zip \
            && unzip -q -o build/cards90.zip -d build/s90/cards \
            || echo "보관된 $S 카드가 없다"
          # ⭐⭐ 저장소에 넣어 둔 손님 그림으로 덮어쓴다 — 손님이 아무것도 안
          #    올려도 늘 그 얼굴이 쓰인다 (2026-08-30 확정 · 0원)
          #    ⭐ 사건 전용 폴더(assets/cards/<sid>)가 있으면 그것을, 없으면 s90.
          python3 tools/repo_cards.py build/s90/cards "$S" 2>&1 | tee -a make.log
          # ⭐ 관리자 페이지에서 새로 올리신 그림이 있으면 그것이 이긴다.
          #    옆에 .hand 표시가 남아, 아래 단계가 그 사람은 다시 안 그린다.
          python3 tools/fetch_cards.py "$CARDS" build/s90/cards 2>&1 | tee -a make.log
          # 아직 얼굴이 없는 사람만 시스템이 그린다
          FAIL=0
          python3 src/still.py cards S001 --out build/s90/cards 2>&1 | tee -a make.log || FAIL=1
          python3 -c "import shutil;shutil.make_archive('build/cards90','zip','build/s90/cards')" || true
          python3 tools/release_file.py put "cards90-$S" cards.zip build/cards90.zip || true
          [ "$FAIL" = 0 ] || { echo "❌ 인물 카드 단계 실패 — 만든 데까지는 보관했습니다"; exit 1; }

      - name: 2) 컷 그림 19장 (세로 9:16)
        if: env.STEP == 'all' || env.STEP == 'stills'
        run: |
          set -o pipefail
          python3 tools/release_file.py get stills-S90 stills.zip build/stills.zip \
            && unzip -q -o build/stills.zip -d build/s90/stills \
            || echo "받아 둔 컷 그림이 없다 — 새로 만든다"
          # ⚠️⚠️ 2026-08-31 — 여기서 죽으면 **이미 돈 주고 만든 것이 날아갔다.**
          #    중간에 실패하면 아래 보관 두 줄까지 통째로 건너뛰기 때문이다.
          #    ("중간에 죽어도 돈이 날아가지 않는다" 고 위에 적어 놓고 안 지켰다)
          #    → 실패해도 **만든 데까지는 반드시 보관**하고, 그다음에 실패시킨다.
          FAIL=0
          python3 src/short90.py stills 2>&1 | tee -a make.log || FAIL=1
          python3 -c "import shutil;shutil.make_archive('build/stills','zip','build/s90/stills')" || true
          python3 tools/release_file.py put stills-S90 stills.zip build/stills.zip || true
          [ "$FAIL" = 0 ] || { echo "❌ 컷 그림 단계 실패 — 만든 데까지는 보관했습니다"; exit 1; }

      - name: 3) 나레이션·대사 소리
        if: env.STEP == 'all' || env.STEP == 'voice'
        run: |
          set -o pipefail
          python3 tools/release_file.py get voice-S90 voice.zip build/voice.zip \
            && unzip -q -o build/voice.zip -d build/s90/voice \
            || echo "받아 둔 소리가 없다 — 새로 만든다"
          # ⚠️ 그림과 같은 까닭 — 만든 데까지는 반드시 보관하고 나서 실패시킨다
          FAIL=0
          python3 src/short90.py voice 2>&1 | tee -a make.log || FAIL=1
          python3 -c "import shutil;shutil.make_archive('build/voice','zip','build/s90/voice')" || true
          python3 tools/release_file.py put voice-S90 voice.zip build/voice.zip || true
          [ "$FAIL" = 0 ] || { echo "❌ 소리 단계 실패 — 만든 데까지는 보관했습니다"; exit 1; }

      - name: 4) 한 편으로 조립
        env:
          CLIPS: ${{ inputs.clips }}
        run: |
          set -o pipefail
          # 앞 단계를 건너뛴 실행에서도 만들어 둔 것을 받아 온다
          for T in stills voice; do
            [ -d "build/s90/$T" ] || { \
              python3 tools/release_file.py get "$T-S90" "$T.zip" "build/$T.zip" \
              && unzip -q -o "build/$T.zip" -d "build/s90/$T" || true; }
          done
          # ⭐⭐ 손으로 만든 컷 영상 — 있는 컷만 영상이 되고 나머지는 그림이다
          #    (2026-08-27 손님: "이미지는 중간중간 섞여 있고 동영상도 있어야 돼")
          mkdir -p build/s90/clips
          python3 tools/release_file.py get clips90-S90 clips.zip build/clips90.zip \
            && unzip -q -o build/clips90.zip -d build/s90/clips \
            || echo "보관된 컷 영상이 없다"
          python3 tools/fetch_clips.py "$CLIPS" build/s90/clips 2>&1 | tee -a make.log
          if [ -n "$(ls -A build/s90/clips 2>/dev/null)" ]; then
            python3 -c "import shutil;shutil.make_archive('build/clips90','zip','build/s90/clips')"
            python3 tools/release_file.py put clips90-S90 clips.zip build/clips90.zip || true
          fi
          # ⭐ 2026-09-01 — 편마다 따로 만들 수 있다. 비우면 전부.
          #   그림·목소리는 편이 함께 쓰므로 늘 통째로 본다(나눠도 값이 같다).
          python3 src/short90.py build --part "${{ inputs.part }}" 2>&1 | tee -a make.log

      - name: 릴리스에 올리기 (저장소에는 안 넣는다)
        run: |
          set -euo pipefail
          # ⭐ 2026-09-01 — 편마다 파일이 하나씩 나온다. 있는 것만 올린다
          #   (한 편만 다시 만들었으면 그 편만 새로 올라간다).
          # ⚠️ 보관함 이름에 **사건 번호**가 들어가야 한다. 안 넣으면 두 번째
          #    사건이 첫 사건 영상을 덮어써 버린다.
          S="${VT_SID:-S90}"
          N=0
          for F in build/s90/*_part*.mp4; do
            [ -f "$F" ] || continue
            K=$(basename "$F" | sed 's/.*_part\([0-9]*\)\.mp4/\1/')
            python3 tools/release_file.py put "short90-$S" "part$K.mp4" "$F"
            echo "  보관: $K편 ($F)"
            N=$((N+1))
          done
          [ "$N" -gt 0 ] || { echo "❌ 만들어진 영상이 없습니다"; exit 1; }
          # ⭐ 유튜브에 올릴 제목·설명·해시태그도 같이 보관한다 (0원).
          #    관리자 페이지가 이것을 읽어 보여 주고, 올릴 때도 이것을 쓴다 —
          #    화면에서 본 글과 올라가는 글이 갈라지지 않게 **한 곳**에 둔다.
          test -f build/s90/meta.json && \
            python3 tools/release_file.py put "short90-${VT_SID:-S90}" meta.json \
              build/s90/meta.json || true

          # ⚠️⚠️⚠️ 2026-09-02 — **여기서 1편·2편을 지워 먹었다.**
          #    prune 은 "남길 것만 두고 나머지를 전부 지운다" 는 명령인데,
          #    그것을 위 반복문 **안에서 편마다** 돌렸다. 그래서
          #      part1 올림 → part1만 남기고 지움
          #      part2 올림 → part2만 남기고 지움 (part1 사라짐)
          #      part3 올림 → part3만 남기고 지움 (part2 사라짐)
          #    세 편을 다 만들어 놓고 마지막 한 편만 남았다. 손님 화면에서
          #    1·2편이 재생되지 않은 원인이 이것이다.
          #
          #    → prune 은 **반복문 밖에서 딱 한 번**, 그리고 **편 파일은 전부
          #      남긴다**. 한 편만 다시 만들었을 때도 나머지 편이 안 지워진다.
          #      치우는 것은 옛 한 편짜리(short.mp4) 같은 남은 것들뿐이다.
          python3 tools/release_file.py prune "short90-${VT_SID:-S90}" \
            meta.json part1.mp4 part2.mp4 part3.mp4 part4.mp4 part5.mp4 \
            part6.mp4 part7.mp4 part8.mp4 part9.mp4 || true

          # ⭐⭐⭐ 2026-09-02 — **올렸다는 것과 남아 있다는 것은 다르다.**
          #    위 사고 때 워크플로는 초록불이었다 — 올리는 것도 지우는 것도
          #    각각은 성공했으니까. 그런데 손님 화면에서는 재생이 안 됐다.
          #    마지막에 한 번 더 물어보고, 없으면 여기서 빨간불을 낸다.
          echo "■ 보관함에 진짜로 들어갔는지 확인"
          WANT=""
          for F in build/s90/*_part*.mp4; do
            [ -f "$F" ] || continue
            K=$(basename "$F" | sed 's/.*_part\([0-9]*\)\.mp4/\1/')
            WANT="$WANT part$K.mp4"
          done
          python3 tools/release_verify.py "short90-${VT_SID:-S90}" $WANT

      - name: 만든 사실 적어 두기
        if: always()
        continue-on-error: true
        run: |
          # ⭐ 관리자 페이지는 state/shorts.json 만 읽고 화면을 그린다.
          #    여기서 안 적으면 만들어 놓고도 화면에 '아직' 으로 남는다.
          git config user.name "verdict-theater-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/shorts.json data/series 2>/dev/null || true
          git diff --cached --quiet && { echo "적을 것이 없다."; exit 0; }
          git commit -m "쇼츠: 만든 사실 적기 [skip ci]"
          bash tools/push.sh "쇼츠: 만든 사실 적기 [skip ci]" state data/series

      - name: 쓴 돈 장부 남기기
        if: always()
        continue-on-error: true
        run: |
          git config user.name "verdict-theater-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/spend.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "장부에 새로 적힌 것이 없다"
          else
            git commit -m "장부: 쓴 돈 [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}" || echo "못 밀었다"
          fi

      - name: 결과 화면
        if: always()
        run: |
          {
            echo "## 90초 한 편"
            echo ""
            echo '```'
            tail -n 40 make.log 2>/dev/null || echo "기록 없음"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
