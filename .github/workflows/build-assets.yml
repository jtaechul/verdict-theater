name: 0. 에셋 만들기

# 캐릭터 컷아웃 · 배경 · 소리를 만든다. **한 번만 하면 되는 작업이다.**
#
# 회차마다 돈이 드는 게 아니라, 처음에 한 번 만들어 두고 계속 재사용한다.
# ⭐ 그림 모델은 종류마다 다르다 (assets_gen.IMAGE_MODEL_ORDER)
#      배경 gemini-3.1-flash-image   ← 어차피 블러 처리해 쓰므로 싼 것으로 (값 약 1/3)
#      인물 gemini-3-pro-image       ← 얼굴이 화면을 크게 차지하므로 품질 유지
# 고정 배우 7명을 회차마다 다른 역으로 돌려 쓴다 — 극단 개념이며 의도된 설계다.
#
# 순서 권장
#   1) 소리 (비용 0원) → 2) 캐릭터 한 명 시험 → 결과 확인 → 3) 나머지 전부

on:
  workflow_dispatch:
    inputs:
      what:
        description: '무엇을 만들까요'
        required: true
        default: '소리 (비용 0원)'
        type: choice
        options:
          - '소리 (비용 0원)'
          - '캐릭터 한 명 시험'
          - '캐릭터 전부'
          - '배경 받아오기 (Pexels · 0원)'
          - '배경 전부 (AI 로 그림 · 값 나감)'
          - '빠진 것 확인만'
      code:
        description: "캐릭터 코드 (F50A F50B M50A M50B F70 M70 JUDGE)"
        required: false
        default: 'F50B'
      limit:
        description: '최대 생성 개수 (비용 상한)'
        required: false
        default: '6'

permissions:
  contents: write

concurrency:
  group: assets
  cancel-in-progress: false

jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      HOOK: ${{ secrets.NOTIFY_WEBHOOK }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 도구 준비
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-nanum
          python3 -m pip install --quiet Pillow

      - name: 만들기
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # 배경은 Pexels 에서 공짜로 받아온다 (AI 로 그리면 값이 나간다)
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          set -o pipefail
          case "${{ inputs.what }}" in
            "소리"*)
              python3 src/assets_gen.py audio 2>&1 | tee build.log ;;
            "캐릭터 한 명 시험")
              python3 src/assets_gen.py images --what char --code "${{ inputs.code }}" 2>&1 | tee build.log ;;
            "캐릭터 전부")
              python3 src/assets_gen.py images --what char --limit "${{ inputs.limit }}" 2>&1 | tee build.log ;;
            "배경 받아오기 (Pexels · 0원)")
              # ⭐ 배경은 **공짜로 받아올 수 있다.** Pexels 는 상업적 사용이 자유롭고
              #    출처 표기도 의무가 아니다. AI 로 그리면 값이 나가는데 그럴 까닭이 없다.
              #    (2026-08-12 손님: "팩셀스 키가 있잖아. API 가 있는데 왜 활용을 안 해")
              if [ -z "$PEXELS_API_KEY" ]; then
                echo "::error::PEXELS_API_KEY 가 등록되어 있지 않습니다."
                exit 1
              fi
              python3 src/bg_fetch.py 2>&1 | tee build.log ;;
            "배경 전부 (AI 로 그림 · 값 나감)")
              python3 src/assets_gen.py images --what bg --limit "${{ inputs.limit }}" 2>&1 | tee build.log ;;
            *)
              python3 src/assets_gen.py check 2>&1 | tee build.log || true ;;
          esac

      # ⭐ 인물 그림을 만든 **직후, 커밋하기 전에** 실루엣을 다듬는다.
      #    AI 가 만든 상반신 그림은 아래를 둥글게 마무리해 놓아서, 어깨가 제일
      #    넓어졌다가 다시 좁아진다. 거기에 흰 테두리가 둘러지면 좌우 맨 끝이
      #    **뾰족한 삼각형**으로 튀어나와 보인다 (실측: 38장 중 26장이 그랬다).
      #
      #    ⚠️ despike.py 는 예전부터 있었는데 **아무 데서도 부르지 않고 있었다.**
      #       그래서 삐죽이가 그대로 영상까지 나갔다. 여기서 부른다.
      #    몇 번을 돌려도 결과가 같게 만들어 두었으므로 매번 돌려도 안전하다.
      - name: 인물 실루엣 다듬기 (어깨 삐죽이 제거)
        if: always()
        run: python3 src/despike.py 2>&1 | tee despike.log || true

      - name: 남은 것 확인
        if: always()
        run: python3 src/assets_gen.py check 2>&1 | tee check.log || true

      - name: 결과 화면
        if: always()
        run: |
          {
            echo "## 에셋 만들기 — ${{ inputs.what }}"
            echo ""
            echo '```'
            tail -n 30 build.log 2>/dev/null || echo "기록 없음"
            echo '```'
            echo ""
            echo "### 지금 상태"
            echo ""
            echo '```'
            tail -n 15 check.log 2>/dev/null || true
            echo '```'
            echo ""
            echo "> 캐릭터 시트는 만든 즉시 컷아웃 17개로 잘립니다."
            echo "> 결과가 이상하면 \`assets/sheets/\` 의 원본을 보고 다시 만드십시오."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 저장소 용량 감시
        if: always()
        run: |
          MB=$(du -sm --exclude=.git . | cut -f1)
          echo "저장소 크기: ${MB}MB"
          [ "$MB" -gt 500 ] && echo "::warning::저장소가 ${MB}MB 입니다." || true

      - name: 커밋
        if: always()
        run: |
          git config user.name  "verdict-theater-bot"
          git config user.email "actions@github.com"
          git add assets 2>/dev/null || true
          git diff --cached --quiet && exit 0
          N=$(git diff --cached --name-only | wc -l)
          git commit -m "에셋: ${{ inputs.what }} — 파일 ${N}개 [skip ci]"
          # ⚠️ 직접 push 하지 않는다. 밀렸을 때 rebase 충돌이 나면 예전 방식은
          #    커밋을 조용히 버리고 "Everything up-to-date" 로 성공 처리했다.
          #    (2026-08-10 EP002 대본 실종) tools/push.sh 가 그 자리를 안전하게 처리한다.
          bash tools/push.sh "에셋: ${{ inputs.what }} — 파일 ${N}개 [skip ci]" assets

      - name: 실패 알림
        if: failure() && env.HOOK != ''
        run: |
          curl -sS -X POST -H 'Content-Type: application/json' \
            -d "{\"text\":\"판결극장 · 에셋 생성 실패\\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$HOOK" || true
