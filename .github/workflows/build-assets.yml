name: 0. 에셋 만들기

# 캐릭터 컷아웃 · 배경 · 소리를 만든다. **한 번만 하면 되는 작업이다.**
#
# 회차마다 돈이 드는 게 아니라, 처음에 한 번 만들어 두고 계속 재사용한다.
# ⭐ 그림 모델은 종류마다 다르다 (assets_gen.IMAGE_MODEL_ORDER)
#      배경 gemini-3.1-flash-image   ← 어차피 블러 처리해 쓰므로 싼 것으로 (값 약 1/3)
#      인물 gemini-3-pro-image       ← 얼굴이 화면을 크게 차지하므로 품질 유지
# 고정 배우 7명을 회차마다 다른 역으로 돌려 쓴다 — 극단 개념이며 의도된 설계다.
#
# 순서 권장
#   1) 소리 (비용 0원) → 2) 캐릭터 한 명 시험 → 결과 확인 → 3) 나머지 전부

on:
  workflow_dispatch:
    inputs:
      what:
        description: '무엇을 만들까요'
        required: true
        default: '기본 3가지 (효과음 + 등장인물 + 배경사진 · 약 399원)'
        type: choice
        options:
          # ⭐ 2026-08-12 손님: "효과음 0원짜리, 등장인물 전부, 배경 사진 받아오기
          #    이렇게 세 개만 먼저 하는 게 기본값으로 적용되면 될 거 같거든?"
          #    맞다. 지금 실제로 필요한 것이 정확히 그 셋이다. **기본값으로 둔다.**
          #    ⚠️ 값이 드는 것(인물)을 **맨 뒤**에 둔다. 공짜인 것부터 다 끝내고
          #       마지막에 돈을 쓴다 — 앞에서 실패하면 돈이 안 나간다.
          #    ⚠️ 배경음악은 여기 안 넣는다. 8곡이 다 차 있고, 필요하면
          #       [소리·음악 받아오기] 에 따로 버튼이 있다. '세 개만' 이 손님 뜻이다.
          - '기본 3가지 (효과음 + 등장인물 + 배경사진 · 약 399원)'
          # ⭐ 2026-08-13 — 구글이 그림을 막아 둔 동안 쓰는 버튼.
          #    [기본 3가지] 를 누르면 인물에서 반드시 실패 문구가 뜬다.
          #    돈이 나가는 것도 아닌데 실패를 보실 까닭이 없다.
          #    공짜인 둘만 한 번에 끝내고 **깨끗하게 초록불**로 끝난다.
          - '소리 + 배경 사진만 (0원)'
          - '소리 (비용 0원)'
          - '캐릭터 한 명 시험'
          - '캐릭터 전부'
          # ⭐ 2026-08-13 — '캐릭터 전부' 는 **없는 것만** 만든다. 그래서 흐린 옛
          #    시트가 남아 있으면 영원히 안 바뀐다. 화질을 올리려면 있는 것까지
          #    갈아엎어야 하므로 그 버튼을 따로 둔다(값이 두 번 나가지 않게 구분).
          # ⭐ 2026-08-14 — **딱 한 장만** 뽑아 새 프롬프트가 맞는지 본다.
          #    어제 7장을 한꺼번에 뽑았다가 7장 다 못 쓰게 됐다(1,855원).
          #    새 방식은 반드시 1장으로 먼저 확인하고, 합격해야 나머지로 간다.
          - '시범 1장만 (M70 얼굴+상반신 · 약 265원)'
          # ⭐ 2026-08-14 — 얼굴 시트가 합격했으므로 같은 방식으로 전신도 한 장.
          #    얼굴 시트가 이미 있으면 손대지 않고 전신만 새로 뽑는다 (1장 = 265원).
          - '시범 1장만 (M70 전신 · 약 265원)'
          - '캐릭터 전부 다시 만들기 (흐린 옛 시트 교체 · 값 나감)'
          - '배경 받아오기 (Pixabay + Pexels · 0원)'
          - '배경 창고 열쇠 확인만 (0원)'
          - '배경 전부 (AI 로 그림 · 값 나감)'
          # ⭐ 2026-08-13 — 값이 나가기 **전에** 먼저 물어보는 버튼.
          #    구글이 그림 만들기를 막아 두면 [기본 3가지] 는 소리·배경을 다 끝내고
          #    맨 마지막 인물에서만 실패하는데, 그마저 초록 체크로 보였다.
          #    이 버튼은 그림 한 장만 두드려 본다 — 막혀 있으면 거절이라 **0원**이다.
          - '그림 만들기 되는지 확인 (막혀 있으면 0원)'
          - '빠진 것 확인만'
      code:
        description: "캐릭터 코드 (F50A F50B M50A M50B F70 M70 JUDGE)"
        required: false
        default: 'F50B'
      limit:
        description: '최대 생성 개수 (비용 상한). 0 이면 무제한'
        required: false
        # ⚠️ 2026-08-12 — 여기가 6이었다. 그런데 인물은 **7명**이라
        #    [등장인물 전부] 를 눌러도 한 명이 말없이 빠졌다.
        #    (tools/limit_test.py 가 이 숫자를 CHAR_LOOK 과 맞춰 본다)
        #    애니 화풍 + flash 모델이라 7장에 약 399원이다.
        default: '7'

permissions:
  contents: write

concurrency:
  group: assets
  cancel-in-progress: false

jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      HOOK: ${{ secrets.NOTIFY_WEBHOOK }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 도구 준비
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-nanum
          # ⚠️ 2026-08-14 — 여기에 numpy 가 빠져 있어서 시범 1장이 **다 그려진 뒤에**
          #    넘어졌다(그림값 265원은 이미 나간 뒤). 시트 검사기(sheet_gate)와
          #    자르는 코드(char_sheet)가 numpy 로 픽셀을 센다.
          #    같은 일이 다시 없도록 tools/deps_test.py 가 **워크플로가 부르는 파일이
          #    실제로 쓰는 꾸러미를 읽어** 여기 적힌 것과 맞는지 스스로 검사한다.
          python3 -m pip install --quiet Pillow numpy

      - name: 만들기
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # 배경은 공짜로 받아온다 (AI 로 그리면 값이 나간다).
          # ⭐ 창고를 **둘** 걸어 둔다 — 하나가 막혀도 배경 받기가 안 멈춘다.
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          # 배경음악은 Freesound 에서 받는다 (효과음과 같은 열쇠)
          FREESOUND_TOKEN: ${{ secrets.FREESOUND_TOKEN }}
        run: |
          set -o pipefail
          case "${{ inputs.what }}" in
            "기본 3가지"*)
              # ⭐ 빠진 것을 **한 번에** 채운다. 순서에 뜻이 있다 —
              #    공짜인 것부터 다 하고, 값이 드는 인물을 맨 뒤에 둔다.
              #    앞 단계가 실패해도 돈은 안 나간 상태로 멈춘다.
              #    각 단계는 `|| true` 로 감싼다. 하나가 안 돼도 나머지는 채운다
              #    (무엇이 빠졌는지는 맨 끝 '남은 것 확인' 이 알려 준다).
              {
                echo "──① 있는 시트를 컷아웃으로 반영 (0원)"
                python3 src/assets_gen.py sync || true

                echo ""
                echo "──② 효과음·방 소리 만들기 (0원)"
                python3 src/assets_gen.py audio || true

                echo ""
                echo "──③ 배경 사진 받아오기 (0원)"
                if [ -n "$PIXABAY_API_KEY" ] || [ -n "$PEXELS_API_KEY" ]; then
                  python3 src/bg_fetch.py || true
                else
                  echo "(사진 창고 열쇠가 둘 다 없어 건너뜁니다)"
                fi

                echo ""
                echo "──④ 등장인물 그림 (여기서만 값이 납니다 · 한 명 약 57원)"
                # ⚠️ 2026-08-13 — 여기가 `|| true` 로 **통째로 삼켜지고 있었다.**
                #    구글이 그림을 막아 놓으면 인물이 한 장도 안 만들어지는데
                #    깃허브에는 초록 체크가 떠서 다 된 줄 알게 된다.
                #    이제 결과값을 받아 두었다가 맨 끝에 크게 알린다.
                #    (그래도 멈추지는 않는다 — 앞의 공짜 결과물은 살려야 하므로)
                python3 src/assets_gen.py images --what char && CHAR=0 || CHAR=$?
                echo "$CHAR" > char.rc

                echo ""
                echo "──⑤ 새로 만든 시트도 컷아웃으로 반영 (0원)"
                python3 src/assets_gen.py sync || true

                if [ "$CHAR" = "3" ]; then
                  echo ""
                  echo "════════════════════════════════════════════════════"
                  echo "⚠️ 소리와 배경은 잘 만들어졌습니다. 그런데 **등장인물 그림은"
                  echo "   한 장도 만들어지지 않았습니다** — 구글이 막아 놓았습니다."
                  echo "   위 ④ 의 안내를 보십시오. 기다린다고 풀리지 않습니다."
                  echo "════════════════════════════════════════════════════"
                fi
              } 2>&1 | tee build.log ;;
            "소리 + 배경 사진만"*)
              # 값이 드는 것은 **하나도 부르지 않는다.** 그림 만들기가 막혀 있어도
              # 초록불로 깨끗하게 끝난다 (실패 문구를 보실 까닭이 없다).
              {
                echo "──① 있는 시트를 컷아웃으로 반영 (0원)"
                python3 src/assets_gen.py sync || true

                echo ""
                echo "──② 효과음·방 소리 만들기 (0원)"
                python3 src/assets_gen.py audio || true

                echo ""
                echo "──③ 배경 사진 받아오기 (0원)"
                if [ -n "$PIXABAY_API_KEY" ] || [ -n "$PEXELS_API_KEY" ]; then
                  python3 src/bg_fetch.py || true
                else
                  echo "(사진 창고 열쇠가 둘 다 없어 건너뜁니다)"
                fi

                echo ""
                echo "※ 등장인물 그림은 **일부러 부르지 않았습니다.** 값이 드는 것은"
                echo "  하나도 부르지 않는 버튼입니다. 인물은 [기본 3가지] 로 만듭니다."
              } 2>&1 | tee build.log ;;
            "소리"*)
              python3 src/assets_gen.py audio 2>&1 | tee build.log ;;
            "캐릭터 한 명 시험")
              python3 src/assets_gen.py images --what char --code "${{ inputs.code }}" 2>&1 | tee build.log ;;
            "시범 1장만"*)
              # ⭐ 새 프롬프트로 **한 장만** 뽑고 그 자리에서 잰다.
              #    검사에 걸리면 컷아웃을 안 만들고 assets/sheets/bad/ 로 치운다.
              #
              # ⚠️ 2026-08-14 — '얼굴+상반신' 과 '전신' 두 버튼이 이 한 갈래를 같이
              #    쓴다. 고르신 것에 따라 어느 시트를 뽑을지 정한다. **이미 있는
              #    시트는 지우지 않는다** — 얼굴 시트를 통과시켜 놓고 전신을 뽑는데
              #    얼굴까지 지우면 265원을 또 쓰게 된다.
              case "${{ inputs.what }}" in
                *전신*) KIND=full; SHEET=assets/sheets/M70_full.png ;;
                *)      KIND=face; SHEET=assets/sheets/M70.png ;;
              esac
              echo "뽑을 시트: $KIND ($SHEET)"
              rm -f "$SHEET"
              python3 src/assets_gen.py images --what char --code M70 --kind "$KIND" \
                2>&1 | tee build.log
              echo ""
              echo "──── 시트 판정 (0원) ────"
              if [ -f "$SHEET" ]; then
                python3 src/sheet_gate.py "$SHEET" --kind "$KIND" 2>&1 | tee -a build.log
              else
                echo "시트가 검사에 걸려 assets/sheets/bad/ 로 치워졌습니다." | tee -a build.log
                python3 src/sheet_gate.py "assets/sheets/bad/$(basename "$SHEET")" \
                  --kind "$KIND" 2>&1 | tee -a build.log || true
              fi ;;
            "캐릭터 전부 다시 만들기"*)
              # 있는 시트까지 **덮어쓴다.** 화질을 올릴 때만 쓰는 버튼이다.
              # 옛 시트는 지우지 않고 sheets/old/ 로 옮겨 둔다 — 새로 만든 것이
              # 마음에 안 들면 되돌릴 수 있어야 한다(그림값을 두 번 쓰지 않게).
              mkdir -p assets/sheets/old
              cp -f assets/sheets/*.png assets/sheets/old/ 2>/dev/null || true
              cp -f assets/sheets/bad/*.png assets/sheets/old/ 2>/dev/null || true
              # 못 쓰던 시트는 old/ 로 챙겨 뒀으니 bad/ 는 비운다.
              # 안 비우면 새로 잘 만들어져도 '흐린 시트' 목록에 계속 남아 헷갈린다.
              rm -f assets/sheets/bad/*.png 2>/dev/null || true
              python3 src/assets_gen.py images --what char --force \
                --limit "${{ inputs.limit }}" 2>&1 | tee build.log ;;
            "캐릭터 전부")
              python3 src/assets_gen.py images --what char --limit "${{ inputs.limit }}" 2>&1 | tee build.log ;;
            "배경 받아오기"*)
              # ⭐ 배경은 **공짜로 받아올 수 있다.** 두 곳 다 상업적 사용이 자유롭고
              #    출처 표기도 의무가 아니다. AI 로 그리면 값이 나가는데 그럴 까닭이 없다.
              #    (2026-08-12 손님: "팩셀스 키가 있잖아. API 가 있는데 왜 활용을 안 해")
              #
              # ⭐ 열쇠는 **둘 중 하나만 있어도** 돌아간다. 둘 다 있으면 두 곳에서
              #    같이 찾아 후보가 두 배가 된다 (사람 없는 사진 고를 확률이 올라간다).
              #    (2026-08-12 손님: "PIXABAY_API_KEY 랑 PEXELS_API_KEY 까지 넣어놨다")
              if [ -z "$PIXABAY_API_KEY" ] && [ -z "$PEXELS_API_KEY" ]; then
                echo "::error::PIXABAY_API_KEY 와 PEXELS_API_KEY 가 둘 다 없습니다. 하나는 있어야 합니다."
                exit 1
              fi
              python3 src/bg_fetch.py 2>&1 | tee build.log ;;
            "배경 창고 열쇠 확인만 (0원)")
              # 사진을 받지 않고 **열쇠가 열리는지만** 두드려 본다. 몇 초, 0원.
              # 열쇠를 새로 넣었거나 바꿨을 때 이것부터 눌러 보면 된다.
              python3 src/bg_fetch.py --probe 2>&1 | tee build.log ;;
            "배경 전부 (AI 로 그림 · 값 나감)")
              python3 src/assets_gen.py images --what bg --limit "${{ inputs.limit }}" 2>&1 | tee build.log ;;
            "그림 만들기 되는지 확인"*)
              # 그림 한 장만 두드려 본다. 막혀 있으면 거절이라 **0원**,
              # 열려 있으면 시험용 한 장 값(약 57원)이 나가고 **크기가 몇 픽셀로
              # 오는지**까지 찍힌다 (요청한 4K 가 먹히는지 눈으로 확인하는 자리).
              python3 src/assets_gen.py probe 2>&1 | tee build.log ;;
            *)
              # 빠진 것 확인 전에 **있는 시트부터 반영한다** (값 0원).
              # 손님이 시트를 직접 올렸는데 컷아웃이 없으면 계속 '빠졌다' 고 나온다.
              python3 src/assets_gen.py sync 2>&1 | tee build.log || true
              python3 src/assets_gen.py check 2>&1 | tee -a build.log || true ;;
          esac

      # ⚠️ 2026-08-12 — 인물 다듬기(despike)를 **껐다** (손님 선택).
      #    까닭: 다듬기가 그림을 크게 갉아먹었다. 실측 손실률 —
      #      F70 전신 78% · M50B 전신 76% · F50B 전신 72% · F50A 얼굴 35%
      #    F50A 는 시트 배치가 맞는데도 35% 가 깎였다. 즉 자르기를 고쳐도
      #    이것 자체가 과하다. '떨어져 나온 조각 제거' 가 머리·눈동자를
      #    조각으로 보고 지운 것이다.
      #    애니 그림은 선이 또렷해 어깨 삐죽이가 거의 안 생긴다(사진과 다르다).
      #    없애서 얻는 것보다 깎여서 잃는 것이 훨씬 크므로 아예 안 부른다.
      #    (되살리려면 src/despike.py 가 그대로 있다 — 지우지 않았다)

      - name: 남은 것 확인
        if: always()
        run: python3 src/assets_gen.py check 2>&1 | tee check.log || true

      - name: 결과 화면
        if: always()
        run: |
          {
            echo "## 에셋 만들기 — ${{ inputs.what }}"
            echo ""
            # ⭐ 2026-08-13 — 인물 그림이 막혔다는 사실을 **맨 위에** 크게 적는다.
            #    로그 맨 아래에만 적으면 손님이 못 보고 다 된 줄 안다.
            if [ "$(cat char.rc 2>/dev/null)" = "3" ]; then
              echo "> ### ⚠️ 등장인물 그림은 한 장도 만들어지지 않았습니다"
              echo "> 구글이 그림 만들기를 막아 놓았습니다(하루 한도 0)."
              echo "> **기다린다고 풀리지 않습니다.** 아래 로그의 안내를 보십시오."
              echo "> 소리와 배경 사진은 정상적으로 만들어졌습니다(0원)."
              echo ""
            fi
            echo '```'
            tail -n 30 build.log 2>/dev/null || echo "기록 없음"
            echo '```'
            echo ""
            echo "### 지금 상태"
            echo ""
            echo '```'
            tail -n 15 check.log 2>/dev/null || true
            echo '```'
            echo ""
            echo "> 캐릭터 시트는 만든 즉시 컷아웃 17개로 잘립니다."
            echo "> 결과가 이상하면 \`assets/sheets/\` 의 원본을 보고 다시 만드십시오."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 저장소 용량 감시
        if: always()
        run: |
          MB=$(du -sm --exclude=.git . | cut -f1)
          echo "저장소 크기: ${MB}MB"
          [ "$MB" -gt 500 ] && echo "::warning::저장소가 ${MB}MB 입니다." || true

      - name: 커밋
        if: always()
        run: |
          git config user.name  "verdict-theater-bot"
          git config user.email "actions@github.com"
          git add assets 2>/dev/null || true
          git diff --cached --quiet && exit 0
          N=$(git diff --cached --name-only | wc -l)
          git commit -m "에셋: ${{ inputs.what }} — 파일 ${N}개 [skip ci]"
          # ⚠️ 직접 push 하지 않는다. 밀렸을 때 rebase 충돌이 나면 예전 방식은
          #    커밋을 조용히 버리고 "Everything up-to-date" 로 성공 처리했다.
          #    (2026-08-10 EP002 대본 실종) tools/push.sh 가 그 자리를 안전하게 처리한다.
          bash tools/push.sh "에셋: ${{ inputs.what }} — 파일 ${N}개 [skip ci]" assets

      - name: 실패 알림
        if: failure() && env.HOOK != ''
        run: |
          curl -sS -X POST -H 'Content-Type: application/json' \
            -d "{\"text\":\"판결극장 · 에셋 생성 실패\\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$HOOK" || true
