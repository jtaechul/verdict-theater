name: 4-2b. 작업 칸의 올리기 요청 → 올리기 단추 (자동)

# ⭐ 2026-10-03 손님: "유튜브에 올리는 것까지 마무리해줘" · "공개(지금당장)"
#
#   작업 칸(Claude 세션)은 워크플로 단추를 직접 못 누른다
#   (403 "Resource not accessible by integration"). 그래서 작업 칸이 요청 파일을
#   임시 가지 upload/<사건> 에 실어 밀어 넣으면 (python3 tools/upload_request.py),
#   여기서 저장소 열쇠로 [4-2. 쇼츠 유튜브에 올리기] 를 **관리자 페이지 단추와
#   똑같은 값**으로 누르고 임시 가지를 지운다.
#
# ⚠️ 올리는 일 자체는 4-2 가 한다 — 60초 벽 · 덜 된 편 · 두 번 올리기 · #shorts 문지기가
#    그대로 걸린다. 여기는 요청이 4-2 가 받는 값인지만 보고 누른다.
# ⚠️ 올리기는 되돌릴 수 없다 — 손님이 그 자리에서 올리라고 하신 것만 요청한다
#    (CLAUDE.md 0-1-1 「올릴 준비」).

on:
  push:
    branches:
      - 'upload/S*'

permissions:
  actions: write
  contents: write

concurrency:
  group: upload-request-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  ask:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 준비
        run: pip install pyyaml

      - name: 올리기 단추 누르기 (요청 그대로)
        run: python3 tools/upload_request.py --dispatch "$GITHUB_REF_NAME"

      - name: 임시 가지 지우기
        if: always()
        run: git push origin --delete "$GITHUB_REF_NAME" || true

      - name: 결과 화면
        if: always()
        run: |
          {
            echo "## 작업 칸의 올리기 요청"
            echo ""
            echo '```'
            cat upload/request.json 2>/dev/null || echo "(요청 파일이 없다)"
            echo '```'
            echo "[4-2. 쇼츠 유튜브에 올리기] 실행 기록에서 올라간 주소를 봅니다."
          } >> "$GITHUB_STEP_SUMMARY"
