name: 2. 대본 만들기

# 판례를 골라 12분 대본과 쇼츠 3편을 만든다.
#
# 아이폰 GitHub 앱에서 쓰는 법
#   Actions 탭 → "2. 대본 만들기" → Run workflow
#
# 끝나면 요약 화면에 **대본을 사람이 읽는 모양으로** 찍어준다.
# JSON 을 열어볼 필요 없이 그 화면에서 검수하면 된다.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '무엇을 할까요'
        required: true
        default: '둘다'
        type: choice
        options:
          - '둘다'
          - '소재 심사만'
          - '대본 생성만'
      case:
        description: '판례일련번호 (비우면 대기열에서 가장 좋은 소재를 고름)'
        required: false
        default: ''
      gate_limit:
        description: '소재 심사할 판례 수'
        required: false
        default: '10'
      writer:
        description: '대본을 쓸 곳'
        required: false
        default: '자동 (Claude 우선)'
        type: choice
        options:
          - '자동 (Claude 우선)'
          - 'Claude'
          - 'Gemini'

permissions:
  contents: write

concurrency:
  group: script
  cancel-in-progress: false

jobs:
  script:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # 단계 안의 env 는 그 단계의 if 조건에서 읽히지 않는다. 잡 단위에 둔다.
    env:
      HOOK: ${{ secrets.NOTIFY_WEBHOOK }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 대본은 Claude 나 Gemini 중 하나만 있어도 된다. 둘 다 없으면 아무것도 못 한다.
      - name: 열쇠 확인
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: |
          if [ -n "$CLAUDE_API_KEY" ]; then
            echo "CLAUDE_API_KEY 확인됨 — 대본은 Claude 가 쓴다"
          fi
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY 확인됨"
          fi
          if [ -n "$CLAUDE_API_KEY" ] || [ -n "$GEMINI_API_KEY" ]; then
            exit 0
          fi
          if [ -z "$GEMINI_API_KEY" ]; then
            {
              echo "## 열쇠가 없습니다"
              echo ""
              echo "대본 생성에는 **Gemini API 키**가 필요합니다."
              echo "이건 진짜 비밀이라 반드시 Secrets 에 넣어야 합니다."
              echo ""
              echo "**1.** [aistudio.google.com](https://aistudio.google.com) 에서"
              echo "**Get API key** → **Create API key** → 나온 문자열 복사"
              echo ""
              echo "**2.** 이 저장소 → **Settings** → **Secrets and variables**"
              echo "→ **Actions** → **New repository secret**"
              echo ""
              echo "| 칸 | 넣을 값 |"
              echo "|---|---|"
              echo '| Name | `GEMINI_API_KEY` |'
              echo "| Secret | 1번에서 복사한 키 |"
              echo ""
              echo "**3.** **Add secret** 을 누른 뒤 이 워크플로를 다시 실행하십시오."
              echo ""
              echo "> 유료 결제 설정이 되어 있어야 합니다. 무료 등급은 한도가 낮습니다."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::GEMINI_API_KEY 가 등록되어 있지 않습니다. 요약 화면의 안내를 따르십시오."
            exit 1
          fi
          echo "GEMINI_API_KEY 확인됨"

      - name: 소재 심사 (3차 드라마성 평가)
        if: inputs.mode != '대본 생성만'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: |
          set -o pipefail
          # 심사도 모델을 쓴다. 버튼에서 고른 곳이 심사에도 그대로 적용돼야 한다.
          case "${{ inputs.writer }}" in
            "Claude") W="--writer claude" ;;
            "Gemini") W="--writer gemini" ;;
            *) W="" ;;
          esac
          python3 src/gate.py --limit "${{ inputs.gate_limit || '10' }}" $W 2>&1 | tee gate.log

      - name: 대본 생성 + 채점 + 보강 + 쇼츠
        if: inputs.mode != '소재 심사만'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: |
          set -o pipefail
          case "${{ inputs.writer }}" in
            "Claude") W="--writer claude" ;;
            "Gemini") W="--writer gemini" ;;
            *) W="" ;;
          esac
          python3 src/script.py --case "${{ inputs.case }}" $W 2>&1 | tee script.log

      - name: 검수 화면 만들기 (아이폰에서 바로 읽는 곳)
        if: always()
        run: |
          # 로그를 한 덩어리로 합쳐 무슨 일이 있었는지 먼저 판단한다.
          cat gate.log script.log > all.log 2>/dev/null || true
          {
            # ── 무슨 일이 있었나 (맨 위) ──────────────────────────
            # 운영자는 로그를 열어보지 않는다. 아이폰 요약 화면 첫 줄에 한국말로 적는다.
            if grep -q 'invalid x-api-key\|authentication_error\|HTTP 401' all.log 2>/dev/null; then
              echo "## 열쇠가 잘못됐습니다"
              echo ""
              echo "등록된 API 키를 서버가 거절했습니다. 키를 다시 발급해 등록하십시오."
              echo ""
              echo "저장소 → **Settings** → **Secrets and variables** → **Actions**"
              echo "→ 해당 키 옆 연필 모양 → 새 값 붙여넣기 → **Update secret**"
              echo ""
            elif grep -q 'credit balance\|billing\|quota' all.log 2>/dev/null; then
              echo "## 결제 잔액이나 사용 한도에 걸렸습니다"
              echo ""
              echo "API 제공사 화면에서 잔액과 한도를 확인하십시오."
              echo "- Claude: [console.anthropic.com](https://console.anthropic.com/settings/billing)"
              echo "- Gemini: [aistudio.google.com](https://aistudio.google.com)"
              echo ""
            elif grep -q '한 건도 평가하지 못했다' all.log 2>/dev/null; then
              echo "## 소재 심사가 한 건도 되지 않았습니다"
              echo ""
              echo "아래 **소재 심사** 칸의 오류 내용을 보십시오."
              echo "판례는 그대로 남아 있으니, 원인을 고치고 다시 실행하면 처음부터 다시 심사합니다."
              echo ""
            elif grep -q '제작할 소재가 없다' all.log 2>/dev/null; then
              echo "## 대본을 만들지 않았습니다"
              echo ""
              echo "쓸 수 있는 소재가 없었습니다. 아래 **생성 기록** 칸에 이유가 적혀 있습니다."
              echo ""
            fi

            if [ -f gate.log ]; then
              echo "## 소재 심사"
              echo ""
              echo '```'
              tail -n 25 gate.log
              echo '```'
              echo ""
            fi
            if [ -f script.log ]; then
              echo "## 생성 기록"
              echo ""
              echo '```'
              tail -n 30 script.log
              echo '```'
              echo ""
            fi
            LATEST=$(ls -1 data/scripts/EP*.json 2>/dev/null | grep -v '\.eval\.\|\.shorts\.' | sort | tail -1)
            if [ -n "$LATEST" ]; then
              echo "---"
              echo ""
              python3 src/preview.py "$LATEST" --short
              echo ""
              echo "---"
              echo ""
              echo "<details><summary>대본 전문 펼치기</summary>"
              echo ""
              python3 src/preview.py "$LATEST"
              echo ""
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 저장소 용량 감시
        if: always()
        run: |
          MB=$(du -sm --exclude=.git . | cut -f1)
          echo "저장소 크기: ${MB}MB"
          [ "$MB" -gt 500 ] && echo "::warning::저장소가 ${MB}MB 입니다. 영상이 잘못 커밋됐는지 확인하십시오." || true

      - name: 결과 커밋
        if: always()
        run: |
          git config user.name  "verdict-theater-bot"
          git config user.email "actions@github.com"
          git add data/scripts state/queue.json state/episodes.json state/rejected.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "바뀐 것이 없다. 커밋하지 않는다."
            exit 0
          fi
          git commit -m "대본: ${{ inputs.mode }} 결과 갱신 [skip ci]"
          OK=0
          for i in 1 2 3 4; do
            if git push origin HEAD:main; then OK=1; break; fi
            echo "푸시 실패. $((2**i))초 뒤 재시도"
            sleep $((2**i))
            git pull --rebase origin main || true
          done
          if [ "$OK" = "0" ]; then
            echo "PUSH_FAILED=1" >> "$GITHUB_ENV"
            {
              echo ""
              echo "### 결과를 저장소에 올리지 못했습니다"
              echo ""
              echo "대본은 정상적으로 만들어졌지만 저장 단계에서 막혔습니다."
              echo "쓰기 권한이 꺼져 있을 때 생기는 일입니다."
              echo ""
              echo "저장소 → **Settings** → **Actions** → **General**"
              echo "→ 맨 아래 **Workflow permissions**"
              echo "→ **Read and write permissions** 선택 → **Save**"
              echo ""
              echo "만든 대본은 이번 실행의 **Artifacts** 에 첨부해 두었습니다."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::쓰기 권한이 없어 대본을 커밋하지 못했습니다."
          fi

      - name: 못 올린 대본을 첨부파일로 보관
        if: always() && env.PUSH_FAILED == '1'
        uses: actions/upload-artifact@v4
        with:
          name: scripts
          path: |
            data/scripts
            state/episodes.json
            state/queue.json
          retention-days: 7

      - name: 실패 알림
        if: failure() && env.HOOK != ''
        run: |
          curl -sS -X POST -H 'Content-Type: application/json' \
            -d "{\"text\":\"판결극장 · 대본 생성 실패\\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$HOOK" || true
