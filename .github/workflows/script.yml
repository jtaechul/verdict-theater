name: 2. 대본 만들기

# 판례를 골라 12분 대본과 쇼츠 3편을 만든다.
#
# 아이폰 GitHub 앱에서 쓰는 법
#   Actions 탭 → "2. 대본 만들기" → Run workflow
#
# 끝나면 요약 화면에 **대본을 사람이 읽는 모양으로** 찍어준다.
# JSON 을 열어볼 필요 없이 그 화면에서 검수하면 된다.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '무엇을 할까요'
        required: true
        default: '둘다'
        type: choice
        options:
          - '둘다'
          - '소재 심사만'
          - '대본 생성만'
          - '이어서 마저 만들기'
          - '쇼츠만 다시'
          # ⭐ 2026-08-14 운영자: "오프닝 훅 부분은 대사가 전혀 무슨 내용인지
          #    파악도 안 된다. 대사랑 음성 다 변경할 수 있도록 해."
          #    12분을 다시 만들면 3,000원인데 훅은 다섯 컷이라 한 번 부르면 끝난다.
          - '도입 훅만 다시 쓰기 (앞 22초 · 약 150원)'
      case:
        description: '판례일련번호 (비우면 대기열에서 가장 좋은 소재를 고름)'
        required: false
        default: ''
      episode:
        description: "회차 ('쇼츠만 다시' · '이어서 마저 만들기' 일 때 씀. 예: EP001)"
        required: false
        default: ''
      gate_limit:
        description: '소재 심사할 판례 수'
        required: false
        default: '10'
      budget:
        description: '한 번에 쓸 수 있는 돈 (원). 넘으면 멈추고 만든 대본은 저장'
        required: false
        default: '3000'
      writer:
        description: '대본을 쓸 곳'
        required: false
        default: '자동 (Claude 우선)'
        type: choice
        options:
          - '자동 (Claude 우선)'
          - 'Claude'
          - 'Gemini'

permissions:
  contents: write

concurrency:
  group: script
  cancel-in-progress: false

jobs:
  script:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # 단계 안의 env 는 그 단계의 if 조건에서 읽히지 않는다. 잡 단위에 둔다.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ⚠️ 2026-08-14 — 여기엔 아무것도 안 깔고 있었다. src/script.py 는 자기 갈래를
      #    따라 들어가면 render.py(Pillow) 를 읽고, 돈 검사기는 numpy 를 읽는다.
      #    **대본값(3,000원)이 나간 뒤에** 넘어질 수 있는 자리라 미리 깔아 둔다.
      #    (tools/deps_test.py 가 이 줄과 코드가 맞는지 매번 대조한다)
      - name: 도구 준비
        run: python3 -m pip install --quiet Pillow numpy

      # 대본은 Claude 나 Gemini 중 하나만 있어도 된다. 둘 다 없으면 아무것도 못 한다.
      - name: 열쇠 확인
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: |
          if [ -n "$CLAUDE_API_KEY" ]; then
            echo "CLAUDE_API_KEY 확인됨 — 대본은 Claude 가 쓴다"
          fi
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY 확인됨"
          fi
          if [ -n "$CLAUDE_API_KEY" ] || [ -n "$GEMINI_API_KEY" ]; then
            exit 0
          fi
          if [ -z "$GEMINI_API_KEY" ]; then
            {
              echo "## 열쇠가 없습니다"
              echo ""
              echo "대본 생성에는 **Gemini API 키**가 필요합니다."
              echo "이건 진짜 비밀이라 반드시 Secrets 에 넣어야 합니다."
              echo ""
              echo "**1.** [aistudio.google.com](https://aistudio.google.com) 에서"
              echo "**Get API key** → **Create API key** → 나온 문자열 복사"
              echo ""
              echo "**2.** 이 저장소 → **Settings** → **Secrets and variables**"
              echo "→ **Actions** → **New repository secret**"
              echo ""
              echo "| 칸 | 넣을 값 |"
              echo "|---|---|"
              echo '| Name | `GEMINI_API_KEY` |'
              echo "| Secret | 1번에서 복사한 키 |"
              echo ""
              echo "**3.** **Add secret** 을 누른 뒤 이 워크플로를 다시 실행하십시오."
              echo ""
              echo "> 유료 결제 설정이 되어 있어야 합니다. 무료 등급은 한도가 낮습니다."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::GEMINI_API_KEY 가 등록되어 있지 않습니다. 요약 화면의 안내를 따르십시오."
            exit 1
          fi
          echo "GEMINI_API_KEY 확인됨"

      # 돈을 쓰기 전에 확인한다. 1초면 끝나고 비용은 0원이다.
      # 2026-08-10 에 컷 120개(Opus 19분치)를 다 만들어 놓고 마지막에 잃었다.
      # "도중에 멈춰도 만든 것은 남는가" 를 매번 먼저 검사해 그 사고를 막는다.
      #
      # ⚠️ call_path_test 는 **가짜 모델을 쓰지 않는다.** 2026-08-11 에 위의 세
      #    검사가 전부 초록불인 채로 첫 호출에서 NameError 로 죽어, 소재 심사
      #    565원만 나가고 대본은 0줄이 나왔다. 가짜는 `json()` 을 흉내만 낼 뿐
      #    진짜 호출 코드 안으로는 들어가지 않기 때문이다.
      #    이 검사는 진짜 객체를 만들고 '인터넷으로 나가는 한 줄'만 막는다.
      - name: 안전장치 점검 — 멈춰도 남는가 · 이어서 만들 수 있는가 · 호출이 뚫려 있는가 (값 0원)
        run: |
          python3 tools/callsite_check.py
          python3 tools/script_salvage_test.py
          python3 tools/script_resume_test.py
          python3 tools/money_guard_test.py
          python3 tools/call_path_test.py

      # 도중에 멈춘 대본을 **이어서** 마저 만든다.
      # 컷을 만드는 1·2단계가 전체 값의 8할이고 20분을 먹는다. 이미 만들어 둔
      # 컷이 있는데 처음부터 다시 쓰는 것은 그냥 돈을 두 번 내는 것이다.
      - name: 이어서 마저 만들기 (컷은 그대로, 뒷단계만)
        if: inputs.mode == '이어서 마저 만들기'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          # 한 번에 쓸 수 있는 돈. 버튼 화면에서 고칠 수 있다 (GitHub 설정에 들어갈 일 없다).
          VT_RUN_KRW: ${{ inputs.budget || '3000' }}
        run: |
          set -o pipefail
          EP="${{ inputs.episode }}"
          if [ -z "$EP" ]; then
            # 회차를 안 적었으면 만들다 만 것을 알아서 찾는다 (초벌이 있는 것 우선)
            EP=$(ls -1 data/scripts/EP*.draft.json 2>/dev/null | sort | tail -1 \
                 | xargs -r basename | sed 's/\.draft\.json$//')
          fi
          if [ -z "$EP" ]; then
            # ⭐ 이어서 만들 것이 없다 = **이미 다 만들어져 있다** 는 뜻이다.
            #    이건 잘못된 상태가 아니므로 빨간 X 를 내면 안 된다.
            #    2026-08-11 에 여기서 빨간 X 가 나서, 손님이 같은 버튼을
            #    되풀이해 누르게 됐다(누를 때마다 실패). 초록불로 끝낸다.
            DONE=$(ls -1 data/scripts/EP*.json 2>/dev/null \
                   | grep -v '\.eval\.\|\.shorts\.\|\.draft\.' | sort | tail -1 \
                   | xargs -r basename | sed 's/\.json$//')
            {
              echo "## 이어서 만들 것이 없습니다 — 이미 다 만들어져 있습니다"
              echo ""
              echo "만들다 만 대본이 하나도 없습니다. 그건 문제가 아니라 **다 됐다는 뜻**입니다."
              if [ -n "$DONE" ]; then
                echo ""
                echo "가장 최근에 만든 대본은 **$DONE** 입니다."
                echo "다음은 **3. 영상 만들기** 를 누르시면 됩니다."
              fi
              echo ""
              echo "> 값은 한 푼도 나가지 않았습니다 (모델을 부르기 전에 끝났습니다)."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "이어서 만들 대본이 없다 — 이미 다 만들어져 있다. 값 0원."
            exit 0
          fi
          echo "이어서 만들 회차: $EP"
          case "${{ inputs.writer }}" in
            "Claude") W="--writer claude" ;;
            "Gemini") W="--writer gemini" ;;
            *) W="" ;;
          esac
          python3 src/script.py --resume "$EP" $W 2>&1 | tee script.log

      # 대본은 이미 있고 쇼츠만 실패했을 때. 26분짜리 생성을 되풀이하지 않는다.
      # ⭐ 도입 훅(앞 22초) 대사만 다시 쓴다. 나머지 막은 손대지 않는다.
      #    음성은 따로 만들 것이 없다 — tts 가 **대사 글자로 이름을 짓기 때문에**
      #    글자가 바뀐 다섯 컷만 저절로 다시 녹음되고 나머지 114컷은 그대로 쓰인다.
      - name: 도입 훅만 다시 쓰기
        if: startsWith(inputs.mode, '도입 훅만')
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          VT_RUN_KRW: ${{ inputs.budget || '3000' }}
        run: |
          set -o pipefail
          EP="${{ inputs.episode }}"
          if [ -z "$EP" ]; then
            EP=$(ls -1 data/scripts/EP*.json 2>/dev/null \
                 | grep -v '\.eval\.\|\.shorts\.\|\.draft\.' | sort | tail -1 \
                 | xargs -r basename | sed 's/\.json$//')
          fi
          if [ -z "$EP" ]; then
            echo "::error::만들어진 회차가 없습니다."
            exit 1
          fi
          echo "대상 회차: $EP"
          case "${{ inputs.writer }}" in
            "Claude") W="--writer claude" ;;
            "Gemini") W="--writer gemini" ;;
            *) W="" ;;
          esac
          python3 src/script.py --hook-only "$EP" $W 2>&1 | tee script.log
          echo ""
          echo "──── 훅이 알아들을 수 있는 말인가 (0원) ────"
          python3 tools/hook_test.py "$EP" 2>&1 | tee -a script.log || true

      - name: 쇼츠만 다시 만들기
        if: inputs.mode == '쇼츠만 다시'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          # 한 번에 쓸 수 있는 돈. 버튼 화면에서 고칠 수 있다 (GitHub 설정에 들어갈 일 없다).
          VT_RUN_KRW: ${{ inputs.budget || '3000' }}
        run: |
          set -o pipefail
          EP="${{ inputs.episode }}"
          if [ -z "$EP" ]; then
            EP=$(ls -1 data/scripts/EP*.json 2>/dev/null \
                 | grep -v '\.eval\.\|\.shorts\.\|\.draft\.' | sort | tail -1 \
                 | xargs -r basename | sed 's/\.json$//')
          fi
          if [ -z "$EP" ]; then
            echo "::error::만들어진 회차가 없습니다."
            exit 1
          fi
          echo "대상 회차: $EP"
          case "${{ inputs.writer }}" in
            "Claude") W="--writer claude" ;;
            "Gemini") W="--writer gemini" ;;
            *) W="" ;;
          esac
          python3 src/script.py --shorts-only "$EP" $W 2>&1 | tee script.log

      # ⭐ 쓸 소재가 이미 쌓여 있으면 심사하지 않는다.
      #
      #    손님 지적 (2026-08-11): "대본 만들기를 눌렀는데 왜 소재를 또 심사하고
      #    돈을 낭비하느냐. 대본이나 만들라고."  맞는 말이다.
      #    그날 통과한 소재가 13건이나 남아 있는데 판례 10건을 또 심사해
      #    그 자리에서만 361원이 나갔다. 한 편 값의 8분의 1이 순수한 낭비였다.
      #
      #    이제 '둘다' 는 "심사부터 하고 대본" 이 아니라
      #    **"소재가 떨어졌을 때만 심사하고, 아니면 바로 대본"** 이다.
      - name: 쓸 소재가 남아 있는지 세기 (값 0원)
        id: stock
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          p = pathlib.Path("state/queue.json")
          q = json.loads(p.read_text(encoding="utf-8")) if p.exists() else []
          n = len([c for c in q if c.get("gate_pass")])
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"ready={n}\n")
          if n >= 3:
              print(f"쓸 수 있는 소재가 {n}건 남아 있다 → 소재 심사는 건너뛴다 (약 361원 아낀다).")
          else:
              print(f"쓸 수 있는 소재가 {n}건뿐이다 → 소재 심사부터 한다.")
          PY

      - name: 소재 심사 (3차 드라마성 평가)
        # '소재 심사만' 을 직접 고른 경우에는 재고와 상관없이 무조건 심사한다.
        # 그 밖의 경우에는 쓸 소재가 3건 미만일 때만 심사한다 (3건은 여유분이다 —
        # 0 이 될 때까지 기다리면 대본을 만들려는 순간 소재가 없어 멈춘다).
        if: inputs.mode != '대본 생성만' && inputs.mode != '쇼츠만 다시'
            && inputs.mode != '이어서 마저 만들기'
            && (inputs.mode == '소재 심사만'
                || fromJSON(steps.stock.outputs.ready) < 3)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          # 한 번에 쓸 수 있는 돈. 버튼 화면에서 고칠 수 있다 (GitHub 설정에 들어갈 일 없다).
          VT_RUN_KRW: ${{ inputs.budget || '3000' }}
        run: |
          set -o pipefail
          # 심사도 모델을 쓴다. 버튼에서 고른 곳이 심사에도 그대로 적용돼야 한다.
          case "${{ inputs.writer }}" in
            "Claude") W="--writer claude" ;;
            "Gemini") W="--writer gemini" ;;
            *) W="" ;;
          esac
          python3 src/gate.py --limit "${{ inputs.gate_limit || '10' }}" $W 2>&1 | tee gate.log

      - name: 대본 생성 + 채점 + 보강 + 쇼츠
        # success() 를 적어두는 이유: 심사가 죽었으면 대본도 만들면 안 된다.
        # 안 적어도 같게 동작하지만(기본값), 돈이 걸린 조건이라 눈에 보이게 둔다.
        if: success() && inputs.mode != '소재 심사만' && inputs.mode != '쇼츠만 다시'
            && inputs.mode != '이어서 마저 만들기'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          # 한 번에 쓸 수 있는 돈. 버튼 화면에서 고칠 수 있다 (GitHub 설정에 들어갈 일 없다).
          VT_RUN_KRW: ${{ inputs.budget || '3000' }}
        run: |
          set -o pipefail
          case "${{ inputs.writer }}" in
            "Claude") W="--writer claude" ;;
            "Gemini") W="--writer gemini" ;;
            *) W="" ;;
          esac
          python3 src/script.py --case "${{ inputs.case }}" $W 2>&1 | tee script.log

      # 방금 심사에서 '쓰지 않기로 한' 것을 바로 화면에서 치운다.
      # 여기서 안 치우면 다음 '재판 기록 모으기' 때까지 대기열에 남아 눈에 거슬린다.
      # 지우는 게 아니라 state/rejected.json 으로 옮기는 것이라 다시 받지 않는다. 값 0원.
      # ⚠️ 자리를 여기로 잡은 이유 — 돈이 나가는 윗 단계의 `if: success()` 앞에
      #    `if: always()` 단계를 끼우지 않으려는 것이다. 조건이 헷갈릴 여지를 아예 없앤다.
      - name: 쓰지 않기로 한 것 치우기 (값 0원)
        if: always()
        run: python3 tools/queue_clean.py 2>&1 | tee -a gate.log

      - name: 검수 화면 만들기 (아이폰에서 바로 읽는 곳)
        if: always()
        run: |
          # 로그를 한 덩어리로 합쳐 무슨 일이 있었는지 먼저 판단한다.
          cat gate.log script.log > all.log 2>/dev/null || true
          {
            # ── 무슨 일이 있었나 (맨 위) ──────────────────────────
            # 운영자는 로그를 열어보지 않는다. 아이폰 요약 화면 첫 줄에 한국말로 적는다.
            if grep -q 'invalid x-api-key\|authentication_error\|HTTP 401' all.log 2>/dev/null; then
              echo "## 열쇠가 잘못됐습니다"
              echo ""
              echo "등록된 API 키를 서버가 거절했습니다. 키를 다시 발급해 등록하십시오."
              echo ""
              echo "저장소 → **Settings** → **Secrets and variables** → **Actions**"
              echo "→ 해당 키 옆 연필 모양 → 새 값 붙여넣기 → **Update secret**"
              echo ""
            elif grep -q 'credit balance\|billing\|quota' all.log 2>/dev/null; then
              echo "## 결제 잔액이나 사용 한도에 걸렸습니다"
              echo ""
              echo "API 제공사 화면에서 잔액과 한도를 확인하십시오."
              echo "- Claude: [console.anthropic.com](https://console.anthropic.com/settings/billing)"
              echo "- Gemini: [aistudio.google.com](https://aistudio.google.com)"
              echo ""
            elif grep -q '안전상의 이유로 답변을 거절' all.log 2>/dev/null; then
              echo "## 일부 판례를 모델이 거절했습니다"
              echo ""
              echo "판례 내용이 안전 기준에 걸린 것입니다. 잘못한 것이 아니니 그냥 두십시오."
              echo "거절된 판례는 건너뛰고, 나머지로 계속 진행하면 됩니다."
              echo ""
            elif grep -q '한 건도 평가하지 못했다' all.log 2>/dev/null; then
              echo "## 소재 심사가 한 건도 되지 않았습니다"
              echo ""
              echo "아래 **소재 심사** 칸의 오류 내용을 보십시오."
              echo "판례는 그대로 남아 있으니, 원인을 고치고 다시 실행하면 처음부터 다시 심사합니다."
              echo ""
            elif grep -q '제작할 소재가 없다' all.log 2>/dev/null; then
              echo "## 대본을 만들지 않았습니다"
              echo ""
              echo "쓸 수 있는 소재가 없었습니다. 아래 **생성 기록** 칸에 이유가 적혀 있습니다."
              echo ""
            elif grep -q '대본은 저장했지만 도중에 멈춘 것이다' all.log 2>/dev/null; then
              echo "## 대본은 남아 있습니다 (도중에 멈춤)"
              echo ""
              echo "만들던 도중에 멈췄지만, **거기까지 만든 대본은 저장했습니다.**"
              echo "처음부터 다시 만들 필요는 없습니다 — 그러면 모델 값만 두 번 나갑니다."
              echo ""
              echo "아래 **생성 기록** 칸의 \`⚠️ 중단:\` 줄에 멈춘 이유가 적혀 있습니다."
              echo ""
            fi

            # 심사를 안 했으면 안 했다고 적는다 — 안 나간 돈도 눈에 보여야 한다.
            if [ ! -f gate.log ] && [ "${{ inputs.mode }}" != '대본 생성만' ] \
               && [ "${{ inputs.mode }}" != '쇼츠만 다시' ] \
               && [ "${{ inputs.mode }}" != '이어서 마저 만들기' ]; then
              echo "> **소재 심사는 건너뛰었습니다.** 이미 통과한 소재가"
              echo "> ${{ steps.stock.outputs.ready }}건 남아 있어서 또 심사할 까닭이 없습니다."
              echo "> 이것만으로 약 361원을 아꼈습니다."
              echo ""
            fi

            if [ -f gate.log ]; then
              echo "## 소재 심사"
              echo ""
              echo '```'
              tail -n 25 gate.log
              echo '```'
              echo ""
            fi
            if [ -f script.log ]; then
              echo "## 생성 기록"
              echo ""
              echo '```'
              tail -n 30 script.log
              echo '```'
              echo ""
            fi
            LATEST=$(ls -1 data/scripts/EP*.json 2>/dev/null | grep -v '\.eval\.\|\.shorts\.\|\.draft\.' | sort | tail -1)
            if [ -n "$LATEST" ]; then
              echo "---"
              echo ""
              python3 src/preview.py "$LATEST" --short
              echo ""
              echo "---"
              echo ""
              echo "<details><summary>대본 전문 펼치기</summary>"
              echo ""
              python3 src/preview.py "$LATEST"
              echo ""
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 저장소 용량 감시
        if: always()
        run: |
          MB=$(du -sm --exclude=.git . | cut -f1)
          echo "저장소 크기: ${MB}MB"
          [ "$MB" -gt 500 ] && echo "::warning::저장소가 ${MB}MB 입니다. 영상이 잘못 커밋됐는지 확인하십시오." || true

      - name: 결과 커밋
        if: always()
        run: |
          # ⚠️ 여기서 직접 push 하지 않는다. tools/push.sh 가 '밀렸을 때'를 안전하게 처리한다.
          #    예전 방식(git pull --rebase … || true)은 state/queue.json 이 충돌하면
          #    커밋을 조용히 버리고 "Everything up-to-date" 로 성공 처리했다.
          #    그렇게 EP002 대본(컷 120개, Opus 19분치)이 통째로 사라졌다.
          if bash tools/push.sh "대본: ${{ inputs.mode }} 결과 갱신 [skip ci]" \
               data/scripts state/queue.json state/episodes.json state/rejected.json state/spend.json; then
            exit 0
          fi
          echo "PUSH_FAILED=1" >> "$GITHUB_ENV"
          {
            echo ""
            echo "### 결과를 저장소에 올리지 못했습니다"
            echo ""
            echo "대본은 정상적으로 만들어졌지만 저장 단계에서 막혔습니다."
            echo "쓰기 권한이 꺼져 있을 때 생기는 일입니다."
            echo ""
            echo "저장소 → **Settings** → **Actions** → **General**"
            echo "→ 맨 아래 **Workflow permissions**"
            echo "→ **Read and write permissions** 선택 → **Save**"
            echo ""
            echo "만든 대본은 이번 실행의 **Artifacts** 에 첨부해 두었습니다."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::쓰기 권한이 없어 대본을 커밋하지 못했습니다."

      - name: 못 올린 대본을 첨부파일로 보관
        if: always() && env.PUSH_FAILED == '1'
        uses: actions/upload-artifact@v4
        with:
          name: scripts
          path: |
            data/scripts
            state/episodes.json
            state/queue.json
          retention-days: 7

      - name: 텔레그램 알림 (성공·실패 둘 다)
        # ⚠️ 반드시 **맨 마지막** 이어야 한다. job.status 가 여기까지의 결과를 담는다.
        #    always() 라서 앞이 실패해도 이 단계는 돈다 — 그래야 실패를 알릴 수 있다.
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTIFY_WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK }}
        run: |
          # 알림 때문에 실행이 실패하는 일은 없어야 한다 — notify.py 는 늘 0 으로 끝난다.
          STATUS=ok
          [ "${{ job.status }}" = "success" ] || STATUS=fail
          python3 src/notify.py --kind script --status "$STATUS" \
            --ep "${{ inputs.episode }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
