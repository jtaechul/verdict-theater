name: 5. 목소리 고르기 (인물별 추천 견본)

# 쓸 수 있는 목소리 **전부**로 같은 대사를 한 번씩 만들어 들려준다.
#
# 왜 (2026-08-22)
#   운영자: "얘 안 돼요. 목소리네 그냥."
#   말투를 아무리 손봐도 안 되면 남은 것은 목소리 그 자체다. 그런데 우리는
#   26개 중 **두 개(Kore·Orus)만** 써 보고 "제미나이 목소리는 이렇다" 고
#   단정하고 있었다. 나머지 24개를 한 번도 안 들어 봤다.
#
# 어떻게 오나
#   관리자 페이지 [목소리 고르기] → 이 워크플로 → 릴리스 `voicepick`
#   → 화면에 목소리마다 재생 단추가 하나씩 뜬다.

on:
  workflow_dispatch:
    inputs:
      only:
        description: '이 목소리들만 (쉼표로, 비우면 전부)'
        required: false
        default: ''
      sid:
        description: '어느 시리즈 인물로 추천할까 (타입캐스트일 때)'
        required: false
        default: 'S001'
  # ⚠️⚠️ 2026-08-22 — 표식 파일만 건드리면 도는 길이 있었다. 그걸로 내가
  #    하루에 **일곱 번**을 돌렸고, 그게 그대로 돈이 됐다.
  #    이제 **버튼으로만** 돈다. 자동으로 도는 길은 없앤다.
      tckey:
        description: '타입캐스트 열쇠 주소 (관리자 페이지가 채웁니다)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: voicepick
  cancel-in-progress: false

jobs:
  pick:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TCKEY_URL: ${{ inputs.tckey }}
      ADMIN_PASS: ${{ secrets.ADMIN_PASSWORD }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
      # ⚠️ 이 실행에서 목소리를 몇 번까지 부를 수 있는가.
      #    상한이 없으면 실패가 겹칠 때 조용히 수백 번을 부른다.
      TTS_CALL_CAP: '30'
      ONLY: ${{ inputs.only }}
      SID: ${{ inputs.sid }}

    steps:
      - uses: actions/checkout@v4
      # ⚠️⚠️ 2026-08-23 — 여기서 사고가 났었다. 열쇠 받기 단계를 끼워 넣을 때
      #    setup-python 의 with(파이썬 판 지정)가 **열쇠 단계에 잘못 붙어서**
      #    run 과 with 가 한 단계에 같이 있게 됐다. 깃허브는 그런 워크플로
      #    파일을 통째로 거부한다 — [전부 다 들어보기]가 오류만 낸 까닭이다.
      #    (tools/workflow_step_check.py 가 이제 이 무늬를 기계로 잡는다)
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ⭐ 타입캐스트 열쇠 (관리자 페이지 보관함에서 받는다) — 값은 실행 기록에
      #    안 싣고 주소만 받아, 암호(ADMIN_PASSWORD)를 대고 꺼낸 뒤 가린다.
      - name: 타입캐스트 열쇠 받기
        continue-on-error: true
        run: |
          if [ -n "${TCKEY_URL:-}" ]; then
            case "$TCKEY_URL" in https://*.workers.dev/*) : ;; *) exit 0 ;; esac
            K=$(curl -fsSL -H "x-vt-pass: ${ADMIN_PASS}" "$TCKEY_URL" || true)
            if [ -n "$K" ]; then
              echo "::add-mask::$K"
              echo "TYPECAST_API_KEY=$K" >> "$GITHUB_ENV"
              echo "타입캐스트 열쇠를 받았다 — 목소리가 타입캐스트로 나간다"
            fi
          fi

      - name: 준비물 (ffmpeg)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      # ⭐⭐ 2026-08-23 운영자: "목소리가 1125개인데 전부 다 들어보게 하면 어떡하냐.
      #    등장인물별로 추천을 몇 개씩 해줘야 될 거 아니야."
      #    맞다. 타입캐스트는 목소리가 1125개라 전부는 말이 안 된다(값도 시간도).
      #    → 인물표(나이·성별)에 맞는 후보를 **인물마다 4개씩만** 골라,
      #      그 인물의 실제 첫 대사로 견본을 만든다. 3인물 × 4개 = 12개.
      - name: 목소리 견본 만들기
        run: |
          set -o pipefail
          if [ -n "${TYPECAST_API_KEY:-}" ]; then
            python3 src/tts.py --audition build/pick --cast-sid "${SID:-S001}" \
              2>&1 | tee pick.log
          else
            python3 src/tts.py --audition build/pick --only "$ONLY" 2>&1 | tee pick.log
          fi

      # ⭐⭐ 2026-08-22 운영자: "니가 알아서 기준과 알고리즘을 만들어서 잘 골라봐."
      #    나는 귀가 없으니 **재서** 고른다. 무엇을 재는지는 voice_judge.py 머리에.
      - name: 재서 점수 매기고 고르기
        continue-on-error: true
        run: |
          set -o pipefail
          # ⚠️ 판정기는 제미나이 목소리 전용이다. 타입캐스트는 인물별 후보를
          #    운영자가 귀로 고른다 — 여기서 돌리면 엉뚱한 것을 고른다.
          if [ -n "${TYPECAST_API_KEY:-}" ]; then
            echo "타입캐스트 — 판정 건너뜀 (운영자가 귀로 고른다)" | tee judge.log
          else
            python3 tools/voice_judge.py --dir build/pick \
              --out state/voice_rank.json --pick state/voice.json 2>&1 | tee judge.log
          fi

      # ⚠️ 고른 결과는 **저장소에 남긴다.** 릴리스에만 두면 다음에 영상을 만들 때
      #    내려받아야 하는데, 저장소에 있으면 그냥 읽힌다. 작은 글 파일이라
      #    커밋해도 된다 (커밋 금지는 완성 영상 이야기다).
      - name: 고른 결과를 저장소에 남기기
        run: |
          set -euo pipefail
          git config user.name "verdict-theater-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/voice.json state/voice_rank.json
          if git diff --cached --quiet; then
            echo "바뀐 것이 없다"
          else
            git commit -m "목소리: 재서 고른 결과 [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      # 올리기가 실패해도 위에서 이미 결과는 남았다
      - name: 릴리스에 올리기
        continue-on-error: true
        run: |
          set -euo pipefail
          # ⚠️ 압축해서 올리면 화면에서 바로 못 튼다. **하나씩** 올린다.
          for f in build/pick/*.mp3; do
            python3 tools/release_file.py put voicepick "$(basename "$f")" "$f"
          done
          python3 tools/release_file.py put voicepick list.json build/pick/list.json
          # 고른 결과도 함께 — 관리자 페이지가 이걸 보고 ✅ 를 찍는다
          cp state/voice.json build/chosen.json
          python3 tools/release_file.py put voicepick chosen.json build/chosen.json
          python3 tools/release_file.py put voicepick rank.json state/voice_rank.json

      # ⚠️⚠️ 2026-08-22 — 장부(state/spend.json)가 **한 번도 안 남고 있었다.**
      #    깃허브 안에서만 적히고 컨테이너와 함께 버려졌다. 그래서 8/18 이후
      #    쓴 돈이 장부에 하나도 없었다. 쓴 만큼은 반드시 남긴다.
      - name: 쓴 돈 장부 남기기
        if: always()
        continue-on-error: true
        run: |
          git config user.name "verdict-theater-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/spend.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "장부에 새로 적힌 것이 없다"
          else
            git commit -m "장부: 쓴 돈 [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}" || echo "못 밀었다"
          fi

      - name: 결과 화면
        if: always()
        run: |
          # ⚠️ 화면 요약만으로는 못 읽는다 (긴 글은 뒤쪽만 잘려 보인다).
          #    **로그 맨 끝**에도 찍어야 밖에서 읽을 수 있다.
          echo "──────── 판정 기록 (맨 끝) ────────"
          tail -n 60 judge.log 2>/dev/null || echo "판정 기록 없음"
          echo "──────────────────────────────────"
          {
            echo "## 목소리 고르기"
            echo ""
            echo '```'
            tail -n 45 judge.log 2>/dev/null || tail -n 20 pick.log 2>/dev/null \
              || echo "기록 없음"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
