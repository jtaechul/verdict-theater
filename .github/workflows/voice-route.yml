name: 0-2. 목소리 창구 확인 (1원 미만)

# ⭐⭐ 2026-08-31 손님: "지금 어느 창구인지 확인해서 알려줘."
#
#   같은 제미나이 목소리를 두 창구로 부를 수 있는데, 소리는 같아도
#   **하루에 몇 번까지 만들어 주느냐**가 하늘과 땅 차이다.
#     AI 스튜디오 창구  — 무료 등급 하루 10번 (90초 한 편은 23줄이라 모자란다)
#     구글 클라우드 창구 — 하루 횟수 제한 없음
#
#   어느 쪽인지 모르면, 11번째 줄부터 옛 목소리로 바뀌어 **한 편 안에서
#   아내 목소리가 달라지는데도** 영상은 멀쩡히 나와서 눈으로는 안 보인다.
#   그래서 돈 쓰기 전에 이 단추로 먼저 본다.
#
# ⚠️ 값: 창구를 알아보려면 아주 짧은 소리 한 번을 실제로 만들어 봐야 한다
#    (1원 미만). 그 밖에는 아무것도 안 만든다.
# ⚠️ 밀 때마다 돌면 안 된다 — **단추로만** 돈다 (tools/auto_spend_check.py 규칙).

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: voice-route
  cancel-in-progress: true

jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
      TTS_CALL_CAP: '3'          # 알아보기만 한다 — 세 번이면 넉넉하다
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 준비물
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: 지금 어느 창구인가
        run: python3 tools/voice_route.py 2>&1 | tee route.txt
      - name: 결과 화면
        if: always()
        run: |
          {
            echo "## 목소리 창구"
            echo ""
            echo '```'
            cat route.txt 2>/dev/null || echo "확인하지 못했습니다"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
