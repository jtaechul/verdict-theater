name: 목소리 오디션 (한 번 약 280원)

# **Gemini 목소리 30개를 같은 대사로 한 번씩 읽혀** 높이를 재고, 한 파일로 이어 붙인다.
#
# 왜 (2026-08-09 손님: "나중에도 이러면 어떡해.
#                      목소리를 바꾸고 싶은 사람이 있으면 어떻게 해야 되는지도 제안해 줘.")
#   같은 실수를 세 번 했다 — Puck(들뜬) · Algenib(쉰 목소리) · Gacrux(186Hz 여자 음역).
#   셋 다 구글이 붙인 **설명만 보고** 고른 것이다. 들어보지도 재보지도 않았다.
#   여기서 한 번에 다 들어보고 다 재 두면, 앞으로는 짐작할 일이 없다.
#
# 무엇이 남나
#   ① data/voices.json — 목소리별 실측 높이. **배역-목소리 검사가 이 표를 쓴다.**
#      (남자 배역에 여자 음역 목소리가 배정되면 영상 만들기가 멈춘다)
#   ② 보관함에 audition_all.mp3 — 낮은 목소리부터 이어 붙인 파일.
#      관리자 페이지 [들어보기] 에서 그대로 재생된다.
#
# 값: 짧은 대사 한 줄 × 30개 ≈ 2분 30초치 = **약 280원, 한 번만.**
#     그 뒤로 누구 목소리를 바꾸든 이 파일을 다시 들으면 되므로 0원이다.
#     ⚠️ 모델이 바뀌면 높이가 통째로 달라진다(실측: 같은 이름이 86Hz ↔ 186Hz).
#        그때 한 번 더 돌리면 된다.

on:
  push:
    paths:
      - '.trigger/voiceaudition'
  workflow_dispatch:
    inputs:
      only:
        description: '이 목소리들만 (쉼표로 구분). 비우면 30개 전부'
        required: false
        default: ''
      dry:
        description: '값 쓰지 않고 얼마나 들지만 봅니다'
        required: false
        default: '아니오 (실제로 만듭니다)'
        type: choice
        options:
          - '아니오 (실제로 만듭니다)'
          - '예 (계획만 보기 · 0원)'
          # 이미 만들어 둔 소리는 그대로 두고, '누가 몇 초에 나오는지' 목록만 다시 만든다.
          # 제미나이를 부르지 않으므로 값이 0원이다.
          - '목록만 다시 만들기 (0원)'

permissions:
  contents: write

concurrency:
  group: voiceaudition
  cancel-in-progress: false

jobs:
  audition:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    # ⚠️ 표식 파일(push)로 돌면 inputs 가 비어 있다.
    #    그때 **값이 드는 쪽이 기본이 되면 안 된다** — 표식 파일을 건드릴 때마다
    #    280원이 나갈 수 있다. 그래서 기본을 '목록만 다시 만들기(0원)' 로 둔다.
    #    실제로 만들려면 관리자 페이지에서 골라 누르셔야 한다.
    env:
      ONLY: ${{ inputs.only || '' }}
      MODE: ${{ inputs.dry || '목록만 다시 만들기 (0원)' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 도구 준비
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python3 -m pip install --quiet numpy

      - name: 열쇠 확인
        env:
          K: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "${K:-}" ]; then
            echo "## 제미나이 열쇠가 없습니다" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::GEMINI_API_KEY 가 없습니다."
            exit 1
          fi
          echo "열쇠 있습니다."

      # ⭐ 값 0원 길 — 이미 보관함에 있는 소리를 그대로 두고 **목록만** 다시 만든다.
      #    (2026-08-09 손님: "삼십 개 들어보기 했는데 이걸 확인할 방법이 없잖아.")
      #    30개를 한 파일에 이어 붙여 놓고 어느 소리가 누구인지 알려 주지 않았다.
      #    여기서 무음을 찾아 '누가 몇 초에 나오는지' 를 적어 준다. 제미나이를 안 부른다.
      - name: 목록만 다시 만들기 (값 0원)
        if: env.MODE == '목록만 다시 만들기 (0원)'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          mkdir -p build/audition
          gh release download "voice-audition" --pattern "voices_all.mp3" \
            --dir build/audition --clobber
          gh release download "voice-audition" --pattern "audition_order.txt" \
            --dir build/audition --clobber
          python3 tools/audition_index.py build/audition/voices_all.mp3 \
            --order build/audition/audition_order.txt \
            --out build/audition/audition_index.json 2>&1 | tee au.log

      - name: 목소리 30개 만들어 재기
        if: env.MODE != '목록만 다시 만들기 (0원)'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -o pipefail
          ARGS=()
          [ -n "$ONLY" ] && ARGS+=(--only "$ONLY")
          [ "$MODE" = "예 (계획만 보기 · 0원)" ] && ARGS+=(--dry)
          python3 tools/voice_audition.py --out build/audition "${ARGS[@]}" 2>&1 | tee au.log
          # 만들었으면 '누가 몇 초에 나오는지' 목록도 바로 만들어 둔다
          if [ -f build/audition/voices_all.mp3 ]; then
            python3 tools/audition_index.py build/audition/voices_all.mp3 \
              --order build/audition/audition_order.txt \
              --out build/audition/audition_index.json 2>&1 | tee -a au.log
          fi

      - name: 결과 화면
        if: always()
        run: |
          {
            echo "## 목소리 오디션"
            echo ""
            echo '```'
            tail -n 60 au.log 2>/dev/null || echo "(기록 없음)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 들어보기 파일을 보관함에 — 관리자 페이지 [들어보기] 에서 재생된다.
      - name: 보관함에 올리기
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd build/audition 2>/dev/null || { echo "만든 것이 없습니다."; exit 0; }
          [ -f audition_all.mp3 ] && cp audition_all.mp3 voices_all.mp3
          UP=()
          for f in voices_all.mp3 audition_order.txt audition_index.json; do
            [ -f "$f" ] && UP+=("$f")
          done
          [ ${#UP[@]} -gt 0 ] || { echo "올릴 것이 없습니다."; exit 0; }
          cd ../..
          FILES=(); for f in "${UP[@]}"; do FILES+=("build/audition/$f"); done
          gh release view "voice-audition" >/dev/null 2>&1 \
            && gh release upload "voice-audition" "${FILES[@]}" --clobber \
            || gh release create "voice-audition" --title "목소리 오디션" \
                 --notes "낮은 목소리부터 이어 붙였습니다. 누가 몇 초에 나오는지는 audition_index.json 참고." \
                 --prerelease "${FILES[@]}"
          echo "보관함: voice-audition (${#FILES[@]}개)"

      # ⭐ 잰 높이표를 저장소에 적어 둔다 — 배역-목소리 검사가 이 파일을 읽는다.
      - name: 높이표 적어 두기
        if: always()
        run: |
          git config user.name  "verdict-theater-bot"
          git config user.email "actions@github.com"
          git add data/voices.json 2>/dev/null || true
          git diff --cached --quiet && { echo "바뀐 것이 없습니다."; exit 0; }
          git commit -m "목소리 높이표: 오디션으로 실측한 값으로 바꿈 [skip ci]"
          # ⚠️ 직접 push 하지 않는다. 밀렸을 때 rebase 충돌이 나면 예전 방식은
          #    커밋을 조용히 버리고 "Everything up-to-date" 로 성공 처리했다.
          #    (2026-08-10 EP002 대본 실종) tools/push.sh 가 그 자리를 안전하게 처리한다.
          bash tools/push.sh "목소리 높이표: 오디션으로 실측한 값으로 바꿈 [skip ci]" data/voices.json
