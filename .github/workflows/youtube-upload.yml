name: 유튜브에 올리기 (즉시 공개)

# 관리자 페이지 '영상 보기' 에서 **영상을 눈으로 본 뒤** 누르는 버튼이 부른다.
#
# ⚠️ **바로 공개로 올라간다.** 비공개가 아니다.
#    되돌리려면 유튜브 앱에서 직접 지우거나 비공개로 바꿔야 한다.
#    그래서 관리자 페이지에서 확인을 한 번 더 받는다.
#
# 영상은 저장소에 없다(커밋 금지 규칙). '영상 만들기' 가 보관해 둔 릴리스에서 꺼내 온다.
# 제목·설명·목차·해시태그도 그때 같이 보관한 meta.json 을 그대로 쓴다 —
# 화면에서 보여드린 것과 실제로 올라가는 것이 **반드시 같아야** 하기 때문이다.

on:
  workflow_dispatch:
    inputs:
      episode:
        description: '회차'
        required: true
        default: ''
      what:
        description: '무엇을 올릴까요'
        required: true
        default: 'longform'
        type: choice
        options:
          - 'longform'
          - 'short1'
          - 'short2'
          - 'short3'
      mode:
        description: "연습이면 올리지 않고 되는지만 봅니다"
        required: false
        default: '진짜로 올리기'
        type: choice
        options:
          - '진짜로 올리기'
          - '연습 (올리지 않고 확인만)'

# ⚠️ write 여야 한다. 올린 뒤 state/episodes.json 에 '공개됨' 을 적어 되돌려 놓는다.
#    예전에는 read 였고 적어 넣는 단계도 없었다 → 올려 놓고도 관리자 페이지에는
#    여전히 '안 올림' 으로 보이고, 손님이 또 누르면 같은 영상이 두 번 올라간다.
permissions:
  contents: write

concurrency:
  group: youtube-upload
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ⭐ 2026-08-09 13:11 실측 — 손님이 버튼을 누르자 **18초 만에 죽었다**:
      #      ModuleNotFoundError: No module named 'PIL'
      #    upload.py 가 render.py 를 부르고, render.py 는 맨 윗줄에서 Pillow(그림
      #    라이브러리)를 부르는데 이 워크플로에는 Pillow 가 없었다.
      #    upload.py 쪽은 '늦게 부르기' 로 고쳤고(보관된 meta.json 이 있으면 아예
      #    안 부른다), 여기서도 **깔아 둔다** — 옛 회차처럼 meta.json 이 없어서
      #    대본에서 목차를 새로 계산해야 할 때를 위해서다.
      - name: 도구 준비
        run: python3 -m pip install --quiet Pillow

      # ⚠️ 열쇠는 **셋 다** 있어야 한다. 예전에는 REFRESH_TOKEN 하나만 봤다 —
      #    나머지가 없으면 한참 뒤에 알 수 없는 오류로 죽어 원인을 못 찾는다.
      - name: 열쇠 확인
        env:
          CID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          CSEC: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          RTOK: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          set -uo pipefail
          MISS=""
          [ -n "${CID:-}"  ] || MISS="$MISS YOUTUBE_CLIENT_ID"
          [ -n "${CSEC:-}" ] || MISS="$MISS YOUTUBE_CLIENT_SECRET"
          [ -n "${RTOK:-}" ] || MISS="$MISS YOUTUBE_REFRESH_TOKEN"
          if [ -n "$MISS" ]; then
            {
              echo "## 유튜브 열쇠가 모자랍니다"
              echo ""
              echo "없는 것:"
              for m in $MISS; do echo "- \`$m\`"; done
              echo ""
              echo "저장소 → Settings → Secrets and variables → Actions →"
              echo "Secrets 탭에서 등록하십시오."
              echo "(관리자 페이지의 [유튜브 연결] 을 돌리면 세 가지가 한 번에 나옵니다)"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::유튜브 열쇠가 모자랍니다:$MISS"
            exit 1
          fi
          echo "유튜브 열쇠 3가지 모두 있습니다."

      - name: 보관해 둔 영상 꺼내기
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          EP="${{ inputs.episode }}"
          WHAT="${{ inputs.what }}"
          mkdir -p build
          # 영상 + 올라갈 내용 + 썸네일. 썸네일은 없어도 그냥 넘어간다.
          gh release download "video-$EP" --pattern "$WHAT.mp4" --dir build --clobber
          gh release download "video-$EP" --pattern "meta.json" --dir build --clobber || true
          gh release download "video-$EP" --pattern "thumb.jpg" --dir build --clobber || true
          ls -la build/
          [ -f "build/$WHAT.mp4" ] || {
            echo "::error::$WHAT.mp4 가 보관함에 없습니다. 먼저 '영상 만들기' 를 돌리십시오."
            exit 1
          }

      - name: 유튜브에 올리기 (공개)
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          set -o pipefail
          DRY=""
          [ "${{ inputs.mode }}" = "연습 (올리지 않고 확인만)" ] && DRY="--dry"
          python3 src/upload.py public "${{ inputs.episode }}" \
            --what "${{ inputs.what }}" \
            --video "build/${{ inputs.what }}.mp4" $DRY 2>&1 | tee up.log

      # ⭐ 올린 사실을 저장소에 적어 되돌려 놓는다.
      #    upload.py 는 state/episodes.json 에 '공개됨' 과 영상 번호를 적지만,
      #    그것은 **일회용 컴퓨터(러너) 안의 파일**이라 여기서 커밋하지 않으면
      #    작업이 끝나는 순간 사라진다. 그러면 관리자 페이지는 계속 '안 올림'
      #    으로 보이고, 손님이 또 눌러 같은 영상이 두 번 올라간다.
      - name: 올린 사실 적어 두기
        if: always()
        run: |
          git config user.name  "verdict-theater-bot"
          git config user.email "actions@github.com"
          git add state 2>/dev/null || true
          git diff --cached --quiet && { echo "적을 것이 없다."; exit 0; }
          git commit -m "공개 업로드: ${{ inputs.episode }} ${{ inputs.what }} [skip ci]"
          for i in 1 2 3 4; do
            git push origin HEAD:main && break
            sleep $((2**i)); git pull --rebase origin main || true
          done

      - name: 결과 화면
        if: always()
        run: |
          {
            echo "## 유튜브 올리기 — ${{ inputs.episode }} · ${{ inputs.what }}"
            echo ""
            echo '```'
            cat up.log 2>/dev/null || echo "(못 올렸습니다)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 텔레그램 알림
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -n "${TELEGRAM_BOT_TOKEN:-}" ] || exit 0
          URL=$(grep -o 'https://youtu.be/[A-Za-z0-9_-]*' up.log 2>/dev/null | head -1 || true)
          if [ -n "$URL" ]; then
            MSG="판결극장 · ${{ inputs.episode }} ${{ inputs.what }} 공개 업로드 완료%0A$URL"
          else
            MSG="판결극장 · ${{ inputs.episode }} ${{ inputs.what }} 업로드 실패"
          fi
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -d "chat_id=$TELEGRAM_CHAT_ID" -d "text=$MSG" >/dev/null || true
