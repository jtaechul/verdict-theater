name: 유튜브에 올리기 (즉시 공개)

# 관리자 페이지 '영상 보기' 에서 **영상을 눈으로 본 뒤** 누르는 버튼이 부른다.
#
# ⚠️ **바로 공개로 올라간다.** 비공개가 아니다.
#    되돌리려면 유튜브 앱에서 직접 지우거나 비공개로 바꿔야 한다.
#    그래서 관리자 페이지에서 확인을 한 번 더 받는다.
#
# 영상은 저장소에 없다(커밋 금지 규칙). '영상 만들기' 가 보관해 둔 릴리스에서 꺼내 온다.
# 제목·설명·목차·해시태그도 그때 같이 보관한 meta.json 을 그대로 쓴다 —
# 화면에서 보여드린 것과 실제로 올라가는 것이 **반드시 같아야** 하기 때문이다.

on:
  workflow_dispatch:
    inputs:
      episode:
        description: '회차'
        required: true
        default: ''
      what:
        description: '무엇을 올릴까요'
        required: true
        default: 'longform'
        type: choice
        options:
          - 'longform'
          - 'short1'
          - 'short2'
          - 'short3'

permissions:
  contents: read

concurrency:
  group: youtube-upload
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 열쇠 확인
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.YOUTUBE_REFRESH_TOKEN }}" ]; then
            {
              echo "## 유튜브 열쇠가 없습니다"
              echo ""
              echo "저장소 → Settings → Secrets → \`YOUTUBE_REFRESH_TOKEN\` 을 등록하십시오."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::유튜브 열쇠가 없습니다."
            exit 1
          fi

      - name: 보관해 둔 영상 꺼내기
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          EP="${{ inputs.episode }}"
          WHAT="${{ inputs.what }}"
          mkdir -p build
          # 영상 + 올라갈 내용 + 썸네일. 썸네일은 없어도 그냥 넘어간다.
          gh release download "video-$EP" --pattern "$WHAT.mp4" --dir build --clobber
          gh release download "video-$EP" --pattern "meta.json" --dir build --clobber || true
          gh release download "video-$EP" --pattern "thumb.jpg" --dir build --clobber || true
          ls -la build/
          [ -f "build/$WHAT.mp4" ] || {
            echo "::error::$WHAT.mp4 가 보관함에 없습니다. 먼저 '영상 만들기' 를 돌리십시오."
            exit 1
          }

      - name: 유튜브에 올리기 (공개)
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          set -o pipefail
          python3 src/upload.py public "${{ inputs.episode }}" \
            --what "${{ inputs.what }}" \
            --video "build/${{ inputs.what }}.mp4" 2>&1 | tee up.log

      - name: 결과 화면
        if: always()
        run: |
          {
            echo "## 유튜브 올리기 — ${{ inputs.episode }} · ${{ inputs.what }}"
            echo ""
            echo '```'
            cat up.log 2>/dev/null || echo "(못 올렸습니다)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 텔레그램 알림
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -n "${TELEGRAM_BOT_TOKEN:-}" ] || exit 0
          URL=$(grep -o 'https://youtu.be/[A-Za-z0-9_-]*' up.log 2>/dev/null | head -1 || true)
          if [ -n "$URL" ]; then
            MSG="판결극장 · ${{ inputs.episode }} ${{ inputs.what }} 공개 업로드 완료%0A$URL"
          else
            MSG="판결극장 · ${{ inputs.episode }} ${{ inputs.what }} 업로드 실패"
          fi
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -d "chat_id=$TELEGRAM_CHAT_ID" -d "text=$MSG" >/dev/null || true
