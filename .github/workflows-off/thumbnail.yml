# 번호를 붙이지 않는다. 1~6번은 순서대로 누르는 것이고,
# 이것은 순서 밖에서 필요할 때만 누르는 버튼이라 섞이면 헷갈린다.
name: 썸네일 다시 만들기

# 썸네일 한 장만 다시 그린다. **영상은 건드리지 않는다.**
#
# 왜 따로 있나
#   영상 한 편을 다시 만들면 한 시간이 걸리고 값도 든다. 그런데 썸네일이 마음에
#   안 들어서 다시 만드는 일은 자주 생긴다. 그림은 코드가 그리므로 **값이 0원**이고
#   1분이면 끝난다. 그래서 영상 만들기와 갈라 놓았다.
#
# 어떻게 쓰나 (버튼만 누른다)
#   관리자 페이지 → 회차의 [영상 보기] → 썸네일 아래 [다시 만들기]
#   (Actions 탭에서 직접 눌러도 똑같이 된다)
#
# 무엇이 바뀌나
#   ① 관리자 페이지에 보이는 썸네일 (릴리스 자산 thumb.jpg)
#   ② 이미 유튜브에 올라간 영상이면 유튜브 썸네일도 같이 갈아 끼운다
#      — 아직 안 올렸으면 ① 만 하고 조용히 넘어간다.

on:
  workflow_dispatch:
    inputs:
      episode:
        description: '회차 (비우면 가장 최근 회차)'
        required: false
        default: ''
      variant:
        description: '문구 고르기 — 누를 때마다 바꾸면 다른 그림이 나옵니다'
        required: true
        default: '문구 1'
        type: choice
        options:
          - '문구 1'
          - '문구 2'
          - '문구 3'

permissions:
  contents: write

concurrency:
  group: thumbnail
  cancel-in-progress: false

jobs:
  thumbnail:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 도구 준비 (그림 라이브러리)
        run: python3 -m pip install --quiet Pillow

      - name: 회차 정하기
        id: pick
        run: |
          set -euo pipefail
          EP="${{ inputs.episode }}"
          if [ -z "$EP" ]; then
            # ⚠️ `|| true` 가 없으면 대본이 하나도 없을 때 pipefail 로 여기서 그냥 죽어
            #    아래의 친절한 안내가 나오지 않는다 (grep 은 못 찾으면 1 을 돌려준다).
            EP=$(ls -1 data/scripts/EP*.json 2>/dev/null \
                 | grep -v '\.eval\.\|\.shorts\.' | sort | tail -1 \
                 | xargs -r -n1 basename | sed 's/\.json//' || true)
          fi
          if [ -z "$EP" ] || [ ! -f "data/scripts/$EP.json" ]; then
            echo "## 대본이 없습니다" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "먼저 **2. 대본 만들기** 를 실행하십시오." >> "$GITHUB_STEP_SUMMARY"
            echo "::error::대본이 없습니다: $EP"
            exit 1
          fi
          # '문구 1' → 0 · '문구 2' → 1 · '문구 3' → 2
          V=$(echo "${{ inputs.variant }}" | tr -dc '0-9')
          echo "ep=$EP" >> "$GITHUB_OUTPUT"
          echo "variant=$(( ${V:-1} - 1 ))" >> "$GITHUB_OUTPUT"
          echo "회차: $EP · 문구 ${V:-1}"

      - name: 썸네일 만들기
        id: make
        run: |
          set -o pipefail
          python3 src/thumb.py "data/scripts/${{ steps.pick.outputs.ep }}.json" \
            --variant "${{ steps.pick.outputs.variant }}" \
            --out build/thumb.jpg 2>&1 | tee thumb.log

      # 관리자 페이지가 보여주는 그림은 릴리스 자산 thumb.jpg 하나다.
      # 영상 릴리스가 이미 있으면 그 안의 그림만 갈아 끼우고(--clobber),
      # 없으면(영상은 아직 안 만들고 썸네일만 보고 싶을 때) 새로 만든다.
      - name: 관리자 페이지에 반영 (릴리스 자산 교체)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          EP="${{ steps.pick.outputs.ep }}"
          TAG="video-$EP"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" build/thumb.jpg --clobber
            echo "기존 보관함($TAG)의 썸네일을 갈아 끼웠습니다."
          else
            gh release create "$TAG" \
              --title "$EP 영상" \
              --notes "관리자 페이지에서 보기 위한 파일입니다. 저장소 커밋이 아닙니다." \
              --prerelease \
              build/thumb.jpg
            echo "보관함($TAG)을 새로 만들고 썸네일을 넣었습니다."
          fi

      # 이미 유튜브에 올라간 회차면 유튜브 쪽 썸네일도 같이 바꾼다.
      # 안 올라갔으면 upload.py 가 스스로 알아보고 그냥 넘어간다.
      - name: 유튜브 썸네일도 갈아 끼우기
        continue-on-error: true
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python3 src/upload.py thumb "${{ steps.pick.outputs.ep }}" --thumb build/thumb.jpg

      - name: 결과 요약
        if: always()
        run: |
          {
            echo "## 썸네일 다시 만들기 — ${{ steps.pick.outputs.ep }}"
            echo ""
            echo '```'
            cat thumb.log 2>/dev/null || echo "(만들지 못했습니다)"
            echo '```'
            echo ""
            echo "관리자 페이지의 **[영상 보기]** 에서 바뀐 그림을 확인하십시오."
            echo "마음에 안 들면 **문구**를 다른 번호로 바꿔 다시 누르시면 됩니다."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('build/thumb.jpg') != ''
        with:
          name: thumbnail-${{ steps.pick.outputs.ep }}
          path: build/thumb.jpg
          retention-days: 14
